name: Update Jobs

on:
  schedule:
    - cron: "30 13 * * *" # 7:30 AM Edmonton during MDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: node scripts/update-jobs.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Update jobs"
          git push
