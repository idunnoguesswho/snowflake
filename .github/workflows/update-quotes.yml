name: Update Daily Quotes

on:
  schedule:
    - cron: "15 13 * * *" # 7:15 AM Edmonton during MDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/update-quotes.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add quotes.json
          git diff --cached --quiet || git commit -m "Update daily quotes"
          git push
