
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCSO Study — Safety Certification Prep</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap');

    :root {
      --bg: #0f1117; --surface: #181c25; --card: #1e2330; --border: #2a3040;
      --accent: #f59e0b; --accent2: #3b82f6; --success: #10b981; --danger: #ef4444;
      --text: #e8eaf0; --muted: #7c8494; --tag-bg: #252b3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: 0.05em; color: var(--accent); }
    .logo span { color: var(--text); }
    .timer-bar { display: flex; align-items: center; gap: 10px; font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--muted); }
    .timer-circle { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--accent) var(--progress, 0%), #2a3040 0%); display: flex; align-items: center; justify-content: center; position: relative; }
    .timer-circle::after { content: ''; width: 28px; height: 28px; background: var(--surface); border-radius: 50%; position: absolute; }
    .timer-digits { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--accent); z-index: 1; position: relative; }
    .container { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
    .section-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
    .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 40px; }
    .module-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; cursor: pointer; transition: border-color 0.2s, transform 0.15s; position: relative; overflow: hidden; }
    .module-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--module-color, var(--accent)); opacity: 0.8; }
    .module-card:hover { border-color: var(--module-color, var(--accent)); transform: translateY(-2px); }
    .module-num { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--module-color, var(--accent)); letter-spacing: 0.1em; margin-bottom: 6px; }
    .module-title { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .module-meta { font-size: 0.75rem; color: var(--muted); }
    .session-view { display: none; }
    .session-view.visible { display: block; }
    .session-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .session-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--text); }
    .session-subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s, transform 0.1s; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #0f1117; }
    .btn-ghost { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-sm { padding: 6px 12px; font-size: 0.76rem; }
    .tab-bar { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
    .tab { flex: 1; padding: 8px 12px; text-align: center; font-size: 0.8rem; font-weight: 500; color: var(--muted); cursor: pointer; border-radius: 7px; transition: background 0.2s, color 0.2s; }
    .tab.active { background: var(--surface); color: var(--text); }
    .reading-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .reading-section h3 { font-size: 1rem; font-weight: 600; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .reading-section p { font-size: 0.88rem; color: #c4c8d4; line-height: 1.75; margin-bottom: 12px; }
    .reading-section p:last-child { margin-bottom: 0; }
    .reading-section ul { padding-left: 20px; margin-bottom: 12px; }
    .reading-section li { font-size: 0.87rem; color: #c4c8d4; margin-bottom: 6px; line-height: 1.6; }
    .reading-section strong { color: var(--text); }
    .key-term { display: inline-block; background: var(--tag-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 0.83rem; color: #c4c8d4; margin-bottom: 8px; width: 100%; }
    .key-term strong { color: var(--accent); display: block; margin-bottom: 2px; font-size: 0.8rem; }
    .ref-block { background: var(--tag-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; }
    .ref-icon { font-size: 1.1rem; margin-top: 1px; flex-shrink: 0; }
    .ref-text { font-size: 0.82rem; color: #c4c8d4; }
    .ref-text strong { color: var(--text); display: block; margin-bottom: 2px; }
    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .flip-card { perspective: 1000px; min-height: 140px; cursor: pointer; border-radius: 12px; }
    .flip-inner { position: relative; width: 100%; min-height: 140px; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back { position: absolute; width: 100%; min-height: 140px; backface-visibility: hidden; border-radius: 12px; padding: 20px 22px; border: 1px solid var(--border); }
    .flip-front { background: var(--card); }
    .flip-back { background: #1a2535; border-color: var(--accent2); transform: rotateY(180deg); }
    .flip-front-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .flip-question { font-size: 0.92rem; font-weight: 500; color: var(--text); line-height: 1.55; }
    .flip-hint { margin-top: 12px; font-size: 0.72rem; color: var(--muted); font-family: 'DM Mono', monospace; }
    .flip-back-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
    .flip-answer { font-size: 0.88rem; color: #c4c8d4; line-height: 1.65; }
    .flip-answer strong { color: var(--success); }
    .q-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
    .badge-reg { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .badge-haz { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .badge-ppe { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .badge-inv { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .badge-wkp { background: rgba(168,85,247,0.15); color: #d8b4fe; }
    .badge-cs  { background: rgba(20,184,166,0.15); color: #5eead4; }
    .badge-elec { background: rgba(234,179,8,0.15); color: #fde047; }
    .badge-fire { background: rgba(249,115,22,0.15); color: #fdba74; }
    .badge-exam { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
    .progress-text { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .mc-question { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
    .mc-question.correct { border-color: var(--success); }
    .mc-question.incorrect { border-color: var(--danger); }
    .mc-q-num { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
    .mc-q-text { font-size: 0.92rem; font-weight: 500; color: var(--text); margin-bottom: 14px; line-height: 1.5; }
    .mc-options { display: grid; gap: 8px; }
    .mc-option { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--tag-bg); font-size: 0.85rem; color: #c4c8d4; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
    .mc-option:hover:not(.locked) { border-color: var(--accent2); color: var(--text); }
    .mc-option.selected-correct { background: rgba(16,185,129,0.1); border-color: var(--success); color: var(--success); }
    .mc-option.selected-wrong { background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger); }
    .mc-option.reveal-correct { background: rgba(16,185,129,0.08); border-color: var(--success); color: var(--success); }
    .mc-option.locked { cursor: default; }
    .mc-explanation { margin-top: 12px; padding: 10px 14px; background: var(--tag-bg); border-radius: 6px; font-size: 0.82rem; color: #c4c8d4; display: none; }
    .mc-explanation.show { display: block; }
    .exam-score { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 28px; }
    .exam-score h2 { font-family: 'Syne', sans-serif; font-size: 1.4rem; color: var(--accent); margin-bottom: 8px; }
    .score-num { font-family: 'DM Mono', monospace; font-size: 2.5rem; color: var(--text); margin: 12px 0; }
    .score-label { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">NCSO<span> Study</span></div>
    <div class="timer-bar">
      <div class="timer-circle" id="timerCircle">
        <span class="timer-digits" id="timerDigits">15:00</span>
      </div>
      <span id="timerLabel">session</span>
      <button class="btn btn-ghost btn-sm" id="timerBtn" onclick="toggleTimer()">Start</button>
    </div>
  </header>
  <div class="container">
    <!-- HOME VIEW -->
    <div class="home-view" id="homeView">
      <div style="margin-bottom:36px;">
        <h1 style="font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;line-height:1.2;margin-bottom:10px;">
          NCSO Certification<br><span style="color:var(--accent)">Study Sessions</span>
        </h1>
        <p style="color:var(--muted);font-size:0.9rem;max-width:480px;">15-minute focused sessions covering Canadian construction safety legislation, hazard recognition, and field practices. Tap any module to begin.</p>
      </div>
      <div class="section-label">Core Modules — pick a session</div>
      <div class="module-grid" id="moduleGrid"></div>
    </div>
    <!-- SESSION VIEW -->
    <div class="session-view" id="sessionView">
      <div class="session-header">
        <div>
          <div class="session-title" id="sessionTitle"></div>
          <div class="session-subtitle" id="sessionSubtitle"></div>
        </div>
        <button class="btn btn-ghost" onclick="goHome()">← All Modules</button>
      </div>
      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('learn',this)">📖 Learn</div>
        <div class="tab" onclick="switchTab('quiz',this)">🃏 Quiz Cards</div>
        <div class="tab" onclick="switchTab('refs',this)">📚 References</div>
      </div>
      <div id="tabLearn"></div>
      <div id="tabQuiz" style="display:none;"></div>
      <div id="tabRefs" style="display:none;"></div>
    </div>
  </div>
  <script>
    // ── TIMER ──────────────────────────────────────────────────────────────
    let seconds = 15 * 60;
    let timerRunning = false;
    let timerInterval = null;

    function toggleTimer() {
      timerRunning = !timerRunning;
      document.getElementById('timerBtn').textContent = timerRunning ? 'Pause' : 'Resume';
      if (timerRunning) {
        timerInterval = setInterval(() => {
          if (seconds > 0) { seconds--; updateTimerUI(); }
          else {
            clearInterval(timerInterval); timerRunning = false;
            document.getElementById('timerBtn').textContent = 'Done ✓';
            document.getElementById('timerLabel').textContent = 'complete';
          }
        }, 1000);
      } else { clearInterval(timerInterval); }
    }

    function resetTimer() {
      clearInterval(timerInterval); timerRunning = false; seconds = 15 * 60;
      document.getElementById('timerBtn').textContent = 'Start';
      document.getElementById('timerLabel').textContent = 'session';
      updateTimerUI();
    }

    function updateTimerUI() {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDigits').textContent = `${m}:${s}`;
      const pct = ((900 - seconds) / 900) * 100;
      document.getElementById('timerCircle').style.setProperty('--progress', pct + '%');
    }

    // ── DATA ──────────────────────────────────────────────────────────────
    const modules = [
      {
        id: 1,
        title: "Legislation & Regulatory Framework",
        sub: "OHS Law, IRS, Duties of Workplace Parties",
        color: "#3b82f6",
        time: "15 min",
        learn: `
          <div class="reading-section">
            <h3>⚖️ The Legal Foundation of OHS</h3>
            <p>Occupational Health and Safety (OHS) is <strong>provincially regulated</strong> in Canada, meaning each province has its own legislation. The <strong>Canada Labour Code Part II</strong> applies to federally regulated workplaces (e.g., federal buildings, telecom, interprovincial pipelines). The NCSO certification primarily applies to <strong>provincial construction workers</strong>.</p>
            <p>In Alberta, the three-part OHS framework includes:</p>
            <ul>
              <li><strong>OHS Act</strong> — sets out the rights, duties, and responsibilities of workplace parties</li>
              <li><strong>OHS Regulation</strong> — provides administrative requirements and procedures</li>
              <li><strong>OHS Code</strong> — contains specific technical safety requirements for workplaces</li>
            </ul>
          </div>
          <div class="reading-section">
            <h3>👥 The Internal Responsibility System (IRS)</h3>
            <p>The IRS is the foundation of Canadian workplace safety. It holds that <strong>everyone in the workplace shares responsibility for safety</strong> — not just management. It is built on three core worker rights:</p>
            <div class="key-term"><strong>Right to KNOW</strong>Workers have the right to know about hazards in their workplace, including training, information, and access to safety data.</div>
            <div class="key-term"><strong>Right to PARTICIPATE</strong>Workers have the right to participate in safety decisions, including through Joint Work Site Health and Safety Committees (JWSHSC).</div>
            <div class="key-term"><strong>Right to REFUSE</strong>Workers have the right to refuse work they reasonably believe is dangerous to themselves or others, without fear of reprisal.</div>
          </div>
          <div class="reading-section">
            <h3>📋 Duties of Workplace Parties</h3>
            <div class="key-term"><strong>Employer</strong>Ensure the health, safety, and welfare of all workers. Provide adequate training, equipment, and supervision. Establish a safety program.</div>
            <div class="key-term"><strong>Prime Contractor</strong>On multi-employer worksites: coordinate all OHS activities and ensure all contractors comply with applicable legislation.</div>
            <div class="key-term"><strong>Supervisor</strong>Ensure workers follow safety rules, advise workers of hazards, take corrective action when unsafe conditions are observed.</div>
            <div class="key-term"><strong>Worker</strong>Take reasonable care to protect themselves and others, co-operate with employer safety programs.</div>
            <div class="key-term"><strong>Owner / Contractor</strong>Ensure compliance with OHS legislation for matters under their control.</div>
          </div>
          <div class="reading-section">
            <h3>🏛️ OHS Officers &amp; Enforcement</h3>
            <p>OHS officers have authority to <strong>enter any workplace</strong>, inspect conditions, investigate incidents, review records, issue <strong>stop-work orders</strong> and <strong>compliance orders</strong>, and recommend prosecution.</p>
            <p>Contravention of the OHS Act can result in fines up to <strong>$1,000,000 per day</strong> (corporation) and up to <strong>12 months imprisonment</strong> for individuals.</p>
            <p>A <strong>competent worker</strong> is defined as adequately qualified, suitably trained, and with sufficient experience to safely perform work without supervision or with minimal supervision.</p>
          </div>
        `,
        quiz: [
          { q: "What is the Internal Responsibility System (IRS)?", a: "A system where everyone in a workplace (employers, supervisors, workers) shares responsibility for safety. It is built on three worker rights: the right to know, participate, and refuse unsafe work.", badge: "badge-reg" },
          { q: "Name the three worker rights under the IRS.", a: "1. Right to KNOW about hazards\n2. Right to PARTICIPATE in safety decisions\n3. Right to REFUSE unsafe work without reprisal", badge: "badge-reg" },
          { q: "Who is the Prime Contractor and what is their duty?", a: "The employer who controls a multi-employer worksite. They must coordinate all OHS activities and ensure all contractors comply with applicable legislation.", badge: "badge-reg" },
          { q: "Under what federal legislation does construction fall if it is federally regulated?", a: "Canada Labour Code, Part II (e.g., works crossing provincial borders like bridges, telecom, federal buildings).", badge: "badge-reg" },
          { q: "What is the difference between the OHS Act, Regulation, and Code?", a: "The Act sets general rights and duties. The Regulation provides administrative requirements. The Code contains specific technical safety requirements for workplaces.", badge: "badge-reg" },
          { q: "Can a worker refuse unsafe work? What is the process?", a: "Yes. The worker must report to their supervisor, who investigates. If not resolved, a government OHS officer is called. The worker cannot be disciplined for a good-faith refusal.", badge: "badge-reg" },
          { q: "What is a 'competent worker' under Alberta OHS legislation?", a: "A worker who is adequately qualified, suitably trained, and has sufficient experience to safely perform assigned work without supervision or with only minimal supervision.", badge: "badge-reg" },
          { q: "What are the powers of an OHS officer?", a: "OHS officers can enter any workplace, inspect conditions, review records, issue stop-work orders and compliance orders, and recommend prosecution for violations.", badge: "badge-reg" },
          { q: "What penalties can an employer face for violating the OHS Act in Alberta?", a: "Corporations can face fines up to $1,000,000 per day of contravention. Individuals may face fines and/or imprisonment up to 12 months.", badge: "badge-reg" },
          { q: "When is a Joint Work Site Health and Safety Committee (JWSHSC) required?", a: "In Alberta, a JWSHSC is required at work sites with 20 or more workers. It includes equal employer and worker representatives and meets regularly to review safety.", badge: "badge-reg" }
        ],
        refs: [
          { icon: "📘", title: "Alberta OHS Act", desc: "Occupational Health and Safety Act, RSA 2000" },
          { icon: "📗", title: "OHS Code", desc: "Alberta OHS Code — technical requirements for all workplace parties" },
          { icon: "📙", title: "Canada Labour Code Part II", desc: "Federal jurisdiction OHS legislation" },
          { icon: "🔗", title: "CCOHS — OHS Legislation", desc: "ccohs.ca — overview of Canadian OHS Acts by province" },
          { icon: "📕", title: "NCSO Textbook Ch. 1", desc: "Legislation and Regulatory Framework — suggested pre-reading" }
        ]
      },
      {
        id: 2,
        title: "Hazard Identification & Risk Assessment",
        sub: "HIRA, Hierarchy of Controls, JSA",
        color: "#ef4444",
        time: "15 min",
        learn: `
          <div class="reading-section">
            <h3>🚨 What is a Hazard?</h3>
            <p>A <strong>hazard</strong> is something with the potential to cause harm. <strong>Risk</strong> is the likelihood that the hazard will actually result in harm, factoring in both probability and severity.</p>
            <p>Types of workplace hazards:</p>
            <ul>
              <li><strong>Physical</strong> — falls, struck-by, noise, vibration, temperature extremes</li>
              <li><strong>Chemical</strong> — silica dust, asbestos, solvents, toxic gases</li>
              <li><strong>Biological</strong> — mold, bacteria, viruses, bloodborne pathogens</li>
              <li><strong>Ergonomic</strong> — repetitive motion, awkward posture, excessive force</li>
              <li><strong>Psychosocial</strong> — workplace violence, fatigue, stress</li>
            </ul>
          </div>
          <div class="reading-section">
            <h3>📊 The HIRA Process</h3>
            <p>Hazard Identification and Risk Assessment (HIRA) is a 4-step process:</p>
            <div class="key-term"><strong>Step 1: Identify</strong>Find all hazards in the work environment, tasks, and equipment.</div>
            <div class="key-term"><strong>Step 2: Assess</strong>Calculate Risk = Likelihood × Severity using a 1–5 scale. Scores 1–4 = low, 5–12 = medium, 13–25 = high.</div>
            <div class="key-term"><strong>Step 3: Control</strong>Apply controls using the hierarchy (see below).</div>
            <div class="key-term"><strong>Step 4: Evaluate</strong>Verify that controls are effective and document results.</div>
          </div>
          <div class="reading-section">
            <h3>⚠️ Hierarchy of Controls</h3>
            <div class="key-term"><strong>1. Elimination</strong>Remove the hazard entirely from the workplace. Most effective. Example: discontinue a hazardous chemical process.</div>
            <div class="key-term"><strong>2. Substitution</strong>Replace the hazard with something less dangerous. Example: use water-based paint instead of solvent-based.</div>
            <div class="key-term"><strong>3. Engineering Controls</strong>Physically change the environment or equipment. Example: machine guarding, local exhaust ventilation, sound barriers.</div>
            <div class="key-term"><strong>4. Administrative Controls</strong>Change how work is done. Example: job rotation, safe work procedures, scheduling to reduce exposure time.</div>
            <div class="key-term"><strong>5. PPE</strong>Personal Protective Equipment. Last line of defence — does not eliminate the hazard. Example: respirators, hard hats, safety glasses.</div>
          </div>
          <div class="reading-section">
            <h3>📝 Job Safety Analysis (JSA)</h3>
            <p>A JSA (also called a FLHA — Field Level Hazard Assessment) breaks a job into steps, identifies hazards at each step, and lists controls. It is completed by workers and supervisors <strong>before starting non-routine or high-risk tasks</strong>.</p>
          </div>
          <div class="reading-section">
            <h3>📐 Risk Assessment in Practice</h3>
            <p><strong>Risk = Likelihood × Severity</strong>. Each factor is rated 1–5. Risk matrix: low (1–4), medium (5–12), high (13–25).</p>
            <p>When risk is <strong>high</strong>, work must stop until controls are implemented. <strong>"Reasonably practicable"</strong> means balancing the degree of risk against the cost and effort of controlling it.</p>
          </div>
        `,
        quiz: [
          { q: "What is the difference between a hazard and a risk?", a: "A hazard is something with the potential to cause harm. Risk is the likelihood that the hazard will actually cause harm, factoring in probability and severity.", badge: "badge-haz" },
          { q: "List the 5 levels of the Hierarchy of Controls in order from most to least effective.", a: "1. Elimination\n2. Substitution\n3. Engineering Controls\n4. Administrative Controls\n5. PPE", badge: "badge-haz" },
          { q: "Why is PPE considered the last line of defence?", a: "PPE does not eliminate or reduce the hazard — it only protects the worker if all other controls fail. It can fail due to improper use, damage, or fit issues.", badge: "badge-ppe" },
          { q: "What does HIRA stand for and what are its four steps?", a: "Hazard Identification and Risk Assessment.\n1. Identify hazards\n2. Assess risk (likelihood × severity)\n3. Apply controls\n4. Evaluate effectiveness", badge: "badge-haz" },

          <div class="reading-section">
            <h3>🔍 Purpose of Incident Investigation</h3>
            <p>The <strong>primary goal</strong> is to prevent recurrence — not assign blame. Key definitions:</p>
            <ul>
              <li><strong>Incident</strong> — an unplanned event that did or could have caused injury or damage</li>
              <li><strong>Near Miss</strong> — no injury but had the potential to cause one; requires the same corrective action</li>
              <li><strong>Accident</strong> — an incident that resulted in injury or damage</li>
            </ul>
            <p>All incidents and near misses must be investigated and documented.</p>
          </div>
          <div class="reading-section">
            <h3>🧊 The Iceberg Model</h3>
            <p>Visible injuries (above the waterline) represent only ~1% of all incidents. Below the surface: property damage, near misses, unsafe acts, and unsafe conditions. For every serious injury, there may be ~10 minor injuries, 30 property damage incidents, and <strong>600 near misses</strong>.</p>
          </div>
          <div class="reading-section">
            <h3>🌳 Root Cause Analysis</h3>
            <div class="key-term"><strong>Immediate Cause</strong>The direct unsafe act or condition that caused the incident.</div>
            <div class="key-term"><strong>Contributing Cause</strong>Factors that allowed the immediate cause to exist (e.g., inadequate training, poor lighting).</div>
            <div class="key-term"><strong>Root Cause</strong>The systemic organizational failure underlying the contributing causes.</div>
            <p style="margin-top:12px;">Common methods: <strong>5 Whys</strong> (keep asking "why" until the root cause is found), <strong>Fishbone/Ishikawa Diagram</strong> (Man, Machine, Method, Material, Environment).</p>
          </div>
          <div class="reading-section">
            <h3>📋 Reporting Requirements in Alberta</h3>
            <p>Serious injuries must be reported <strong>immediately</strong> (by phone) to OHS. A serious injury includes: fractures, amputations, loss of consciousness, hospitalization. A <strong>written report</strong> must be submitted within <strong>10 days</strong>.</p>
            <p>Fatalities and potentially serious incidents require <strong>scene preservation</strong> until an OHS officer releases it.</p>
          </div>
          <div class="reading-section">
            <h3>📄 Investigation Report Components</h3>
            <p>A complete investigation report includes:</p>
            <ul>
              <li>Description of the incident (who, what, when, where)</li>
              <li>Immediate causes (unsafe acts/conditions)</li>
              <li>Contributing/root causes</li>
              <li>Corrective actions with assigned responsibility and deadline</li>
              <li>Follow-up verification</li>
            </ul>
            <p>The <strong>FLHA (Field Level Hazard Assessment)</strong> is a pre-work daily assessment completed by workers at the field level before starting tasks.</p>
          </div>

      {
        id: 11, isExam: true, color: "#3b82f6", time: "20 min",
        title: "Exam Bank 1",
        sub: "Legislation & IRS — 20 Questions",
        learn: `<div class="reading-section"><h3>📝 Exam Bank 1 — Legislation &amp; IRS</h3><p>20 multiple-choice questions covering the Alberta OHS Act, Regulation, and Code; the Internal Responsibility System; worker rights; duties of workplace parties; JWSHSC requirements; and OHS officer powers. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "Alberta OHS Act", desc: "Occupational Health and Safety Act, RSA 2000" },
          { icon: "📗", title: "Alberta OHS Code", desc: "Technical safety requirements for workplaces" },
          { icon: "📕", title: "NCSO Textbook Ch. 1", desc: "Legislation and Regulatory Framework" }
        ],
        quiz: [
          { q: "Under the Alberta OHS Act, which party is primarily responsible for establishing a written safety program?", options: ["The supervisor","The employer","The prime contractor","The JWSHSC"], correct: 1, explanation: "The employer is legally required to establish and maintain a safety program. While other parties have responsibilities, the employer holds the primary obligation to create the documented program." },
          { q: "A Joint Work Site Health and Safety Committee (JWSHSC) is required in Alberta when a worksite has at least:", options: ["5 workers","10 workers","20 workers","50 workers"], correct: 2, explanation: "Under Alberta OHS legislation, a JWSHSC is required at worksites with 20 or more workers. It must include equal employer and worker representatives and meet regularly to address safety issues." },
          { q: "Which of the following is NOT one of the three core worker rights under the Internal Responsibility System?", options: ["Right to know","Right to participate","Right to compensation","Right to refuse"], correct: 2, explanation: "The three rights are: know (about hazards), participate (in safety decisions), and refuse (unsafe work). Compensation is a WCB entitlement, not an IRS worker right." },
          { q: "Under Alberta OHS legislation, a 'competent worker' is defined as one who is:", options: ["Licensed by a provincial trade authority","Adequately qualified, suitably trained, and has sufficient experience to perform work safely","Employed for more than 5 years in a trade","Certified by the WCB"], correct: 1, explanation: "A competent worker is defined by three criteria: adequate qualifications, suitable training, and sufficient experience to perform work safely without supervision or with minimal supervision." },
          { q: "Which body of legislation governs OHS in federally regulated workplaces such as interprovincial pipelines?", options: ["Alberta OHS Act","Canada Labour Code, Part II","Workers' Compensation Act","Canadian Environmental Protection Act"], correct: 1, explanation: "The Canada Labour Code, Part II covers federally regulated industries including interprovincial transportation, telecommunications, federal buildings, and banks. Provincial OHS acts cover construction and most other workplaces." },
          { q: "What is the maximum daily fine for a corporation that contravenes the Alberta OHS Act?", options: ["$100,000","$500,000","$1,000,000","$5,000,000"], correct: 2, explanation: "Under the Alberta OHS Act, corporations can face fines of up to $1,000,000 per day of contravention. Individuals may face fines and/or imprisonment up to 12 months." },
          { q: "What is the primary purpose of the Alberta OHS Code?", options: ["Setting penalties for safety violations","Outlining general rights and duties of workplace parties","Providing specific technical safety requirements","Administering workers' compensation claims"], correct: 2, explanation: "The OHS Code contains specific technical safety requirements for workplaces — things like minimum guardrail heights, atmospheric limits for confined spaces, and LOTO procedures. The Act covers general duties; the Regulation covers administration." },
          { q: "A worker refuses unsafe work and the supervisor does not resolve the concern. What is the correct next step?", options: ["The worker must return to work immediately","The worker must contact a government OHS officer","The worker should resign and file a complaint","The prime contractor takes over the investigation"], correct: 1, explanation: "If the supervisor does not resolve the concern after a work refusal, a government OHS officer must be called to investigate. The worker is protected from reprisal for a good-faith refusal." },
          { q: "The Internal Responsibility System (IRS) is best described as:", options: ["A government inspection program","A system where everyone in the workplace shares responsibility for safety","A union-led safety oversight body","An insurance compensation program"], correct: 1, explanation: "The IRS is Canada's foundational safety philosophy: employers, supervisors, and workers all share responsibility for safety. It is not run by government or unions — it operates from within the workplace." },
          { q: "A supervisor who is aware of a hazard but fails to address it — and a worker is injured — shares legal responsibility with:", options: ["The injured worker only","The OHS officer who last inspected the site","The employer","The union representative"], correct: 2, explanation: "Both the supervisor and the employer share legal responsibility. The supervisor is obligated to address known hazards, and the employer is responsible for ensuring supervisors fulfill that duty." },
          { q: "OHS officers in Alberta have the authority to do all of the following EXCEPT:", options: ["Enter any workplace without a warrant","Issue stop-work orders","Review safety records and documentation","Arrest a worker for safety violations"], correct: 3, explanation: "OHS officers can enter workplaces, inspect conditions, issue compliance and stop-work orders, and recommend prosecution. However, they cannot make arrests — that is a police power." },
          { q: "Under Alberta OHS legislation, how often must a JWSHSC meet at minimum?", options: ["Weekly","Monthly","Quarterly","Twice per year"], correct: 1, explanation: "A JWSHSC must meet at least monthly. Meeting minutes must be recorded and made available to workers. The committee reviews inspection results, incident investigations, and safety program effectiveness." },
          { q: "A worker suffers reprisal after refusing unsafe work. What is the appropriate action?", options: ["Resign and file a civil lawsuit","File a complaint with the OHS Director","Apply for WCB benefits","Contact the prime contractor"], correct: 1, explanation: "A worker who suffers reprisal (demotion, discipline, dismissal) for a good-faith work refusal can file a complaint with the OHS Director. Reprisal for exercising safety rights is prohibited under the OHS Act." },
          { q: "The Alberta OHS Regulation primarily covers:", options: ["Specific technical requirements like guardrail heights","Administrative requirements and procedures","Penalties for violations","Occupational exposure limits for chemicals"], correct: 1, explanation: "The OHS Regulation covers administrative and procedural requirements. Specific technical requirements are in the OHS Code, and penalties are in the OHS Act. OELs are in OHS Code Schedule 1." },
          { q: "Who is the 'prime contractor' on a multi-employer worksite?", options: ["The employer with the most workers on site","The employer who controls the worksite and coordinates OHS activities","The first employer to arrive on site","The employer with the highest WCB premium"], correct: 1, explanation: "The prime contractor is the employer who controls the worksite. They are responsible for coordinating OHS activities across all employers and ensuring all contractors comply with applicable legislation." },
          { q: "Under the IRS, what should happen when a worker identifies a hazard?", options: ["Document it and wait for the annual safety review","Report it to the supervisor who must investigate and take corrective action","Report it directly to OHS without telling the employer","Continue working as long as PPE is worn"], correct: 1, explanation: "Under the IRS, workers report hazards to their supervisor, who is responsible for investigating and taking corrective action. This is the internal process before involving external parties like OHS." },
          { q: "Which document defines specific technical requirements like minimum scaffold heights in Alberta?", options: ["OHS Act","OHS Regulation","OHS Code","Workers' Compensation Act"], correct: 2, explanation: "The OHS Code contains all the specific technical requirements — guardrail heights, confined space atmospheric limits, ladder angles, etc. The Act and Regulation deal with responsibilities and administration." },
          { q: "A JWSHSC must consist of:", options: ["Management representatives only","Worker representatives only","Equal numbers of employer and worker representatives","Only OHS-certified individuals"], correct: 2, explanation: "By law, a JWSHSC must have equal representation from the employer and workers. This balanced composition ensures both parties have a voice in the safety process." },
          { q: "An employer with fewer than 20 workers must still:", options: ["Establish a JWSHSC","Have a written safety program only if workers request one","Ensure workers have access to information about hazards that may affect them","Hire a full-time safety officer"], correct: 2, explanation: "Regardless of size, all employers must inform workers about hazards affecting them. JWSHSC requirements apply at 20+ workers, and written safety programs have their own threshold, but hazard communication is always required." },
          { q: "Stop-work orders issued by an OHS officer are most appropriate when:", options: ["A minor paperwork error is found","There is imminent danger to workers or a serious OHS violation","An employer disputes a compliance order","Workers refuse to participate in a safety audit"], correct: 1, explanation: "Stop-work orders are reserved for situations of imminent danger or serious violations. They require the employer to cease operations in the affected area until the hazard is corrected." }
        ]
      },
      {
        id: 12, isExam: true, color: "#ef4444", time: "20 min",
        title: "Exam Bank 2",
        sub: "Hazard ID & Risk Assessment — 20 Questions",
        learn: `<div class="reading-section"><h3>📝 Exam Bank 2 — Hazard ID &amp; Risk Assessment</h3><p>20 multiple-choice questions covering HIRA steps, the hierarchy of controls, hazard types, JSA/FLHA, risk matrices, and the meaning of 'reasonably practicable'. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 2", desc: "Hazard Assessment, Elimination and Control" },
          { icon: "📗", title: "NCSO Textbook Ch. 3", desc: "Hazard Recognition, Assessment, and Control" }
        ],
        quiz: [
          { q: "What is the FIRST step of the HIRA (Hazard Identification and Risk Assessment) process?", options: ["Apply controls","Assess the risk level","Identify hazards","Evaluate control effectiveness"], correct: 2, explanation: "The four steps of HIRA are: 1. Identify, 2. Assess, 3. Control, 4. Evaluate. You must identify all hazards before you can assess their risk or implement controls." },
          { q: "In a 1–5 risk matrix (Likelihood × Severity), a score of 20 is classified as:", options: ["Low risk (1–4)","Medium risk (5–12)","High risk (13–25)","Extreme risk requiring immediate evacuation"], correct: 2, explanation: "Risk = Likelihood × Severity. Scores of 13–25 are HIGH risk and require immediate action before work can proceed. 1–4 = low, 5–12 = medium." },
          { q: "A worker repeatedly lifting boxes from floor level represents which type of hazard?", options: ["Chemical","Biological","Ergonomic","Physical"], correct: 2, explanation: "Repetitive lifting from floor level is an ergonomic hazard. Ergonomic hazards involve physical demands — repetitive motion, awkward postures, excessive force — that can cause musculoskeletal disorders." },
          { q: "A company replaces solvent-based paint with water-based paint to reduce chemical exposure. This is an example of:", options: ["Elimination","Substitution","Engineering control","Administrative control"], correct: 1, explanation: "Substitution replaces one hazardous material or process with a less hazardous one. The hazard (paint) still exists, but the risk is reduced. Elimination would remove the painting step entirely." },
          { q: "Installing a physical guard over rotating machinery parts is an example of:", options: ["Elimination","Substitution","Engineering control","Administrative control"], correct: 2, explanation: "Engineering controls physically change the work environment or equipment. Machine guarding, local exhaust ventilation, and interlocks are all engineering controls that reduce exposure at the source." },
          { q: "Scheduling noisy work during low-occupancy periods to reduce worker exposure is an example of:", options: ["Engineering control","Elimination","Administrative control","PPE"], correct: 2, explanation: "Administrative controls change how work is organized or performed. Job rotation, scheduling, safe work procedures, and training are all administrative controls. They rely on human behavior, making them less reliable than engineering controls." },
          { q: "Which of the following is a psychosocial hazard?", options: ["Repetitive motion injuries","Solvent vapors","Workplace violence and harassment","Noise above 85 dBA"], correct: 2, explanation: "Psychosocial hazards include workplace violence, harassment, fatigue, job stress, and shift work. They can result in mental health conditions as well as physical injuries." },
          { q: "The term 'reasonably practicable' in OHS means:", options: ["All controls must be implemented regardless of cost","Risk is weighed against the time, cost, and effort of implementing controls","Only high-risk hazards require controls","Controls are optional if workers consent"], correct: 1, explanation: "'Reasonably practicable' means balancing the degree of risk against the burden of controlling it. A control is required when the risk outweighs the cost. This prevents employers from citing cost as a reason to ignore serious hazards." },
          { q: "A Field Level Hazard Assessment (FLHA) differs from a formal HIRA in that:", options: ["FLHAs are completed by management only","FLHAs are completed daily in the field before starting specific tasks","FLHAs cover all hazards across the entire project","FLHAs are only required for confined space entry"], correct: 1, explanation: "A FLHA is a real-time, field-level tool completed by workers before each task or shift at the specific location. A formal HIRA is a systematic organizational process covering all hazards in a work environment." },
          { q: "Which control is considered MOST effective in the hierarchy of controls?", options: ["PPE","Administrative controls","Engineering controls","Elimination"], correct: 3, explanation: "Elimination — removing the hazard entirely — is the most effective control because it eliminates risk at the source. All other controls manage or reduce the hazard but leave it in place to some degree." },
          { q: "PPE is considered the least effective control because:", options: ["It is the most expensive option","It does not eliminate or reduce the hazard — it only protects the worker if other controls fail","It requires government approval to implement","It is difficult to obtain in Alberta"], correct: 1, explanation: "PPE is the last line of defence. It does not address the hazard itself and can fail due to improper fit, damage, or misuse. All higher-level controls should be applied first." },
          { q: "Mold discovered during a building renovation is classified as which type of hazard?", options: ["Physical","Chemical","Biological","Ergonomic"], correct: 2, explanation: "Biological hazards include mold, bacteria, viruses, and bloodborne pathogens. On construction sites, biological hazards are common during renovation of older buildings." },
          { q: "A JSA (Job Safety Analysis) should be completed:", options: ["Only after a previous incident on the same task","Before starting any non-routine, high-risk, or unfamiliar task","Only by the safety manager","Once per project for each task type"], correct: 1, explanation: "A JSA breaks a job into steps, identifies hazards at each step, and lists controls. It should be completed before starting any task that poses elevated risk — not just after incidents occur." },
          { q: "Severity in a risk assessment is rated based on:", options: ["Number of workers exposed","Cost of the damaged equipment","Potential seriousness of the injury or illness","Frequency of the hazard occurring"], correct: 2, explanation: "Severity rates the potential outcome — from minor first aid to fatality. Likelihood rates the probability of the event occurring. Together they give the risk score." },
          { q: "After controls are implemented, the HIRA process requires:", options: ["Filing the document and closing the hazard","Re-evaluating to confirm the controls are effective","Submitting a report to OHS","Starting the process over from the beginning"], correct: 1, explanation: "Step 4 of HIRA is 'Evaluate' — verifying that implemented controls actually reduce the risk to an acceptable level. Controls may be inadequate, introduce new hazards, or erode over time." },
          { q: "UV radiation from welding operations is classified as which type of hazard?", options: ["Chemical","Ergonomic","Physical","Psychosocial"], correct: 2, explanation: "Physical hazards include energy forms: noise, vibration, radiation (UV, IR, ionizing), extreme temperatures, and forces like struck-by or falls. UV from welding can cause arc eye and skin burns." },
          { q: "A near miss must be investigated because:", options: ["It is required by WCB legislation","It reveals the same systemic failures that could lead to a serious injury","It always indicates a worker was at fault","It is only significant if equipment was damaged"], correct: 1, explanation: "A near miss had the potential to cause harm. The same hazards, unsafe acts, and systemic failures are present. Investigating near misses prevents the next event from becoming a serious injury." },
          { q: "Which of the following is an example of an engineering control for noise?", options: ["Requiring workers to wear earplugs","Scheduling noisy work during lunch breaks","Installing an acoustic enclosure around a generator","Training workers on the effects of noise exposure"], correct: 2, explanation: "An acoustic enclosure physically reduces noise at the source — an engineering control. Earplugs are PPE; scheduling is administrative; training is administrative. Engineering controls are the most effective non-elimination option." },
          { q: "In a risk matrix scored 1–5, a risk score of 6 falls into which category?", options: ["Low (1–4)","Medium (5–12)","High (13–25)","Critical"], correct: 1, explanation: "A score of 6 falls in the medium range (5–12). Medium-risk hazards require controls to be implemented and monitored but do not necessarily require stopping work immediately." },
          { q: "Who is typically responsible for completing a Job Safety Analysis (JSA)?", options: ["The OHS officer assigned to the project","The workers and supervisor performing the task","The employer alone","The prime contractor's safety manager"], correct: 1, explanation: "JSAs are most effective when completed by the workers who will do the job, with their supervisor. Front-line workers have direct knowledge of the task's hazards and the most practical control ideas." }
        ]
      },
      {
        id: 13, isExam: true, color: "#f59e0b", time: "20 min",
        title: "Exam Bank 3",
        sub: "Fall Protection — 20 Questions",
        learn: `<div class="reading-section"><h3>📝 Exam Bank 3 — Fall Protection</h3><p>20 multiple-choice questions covering OHS Code Part 9, fall arrest vs. restraint systems, anchor ratings, ladder rules, scaffolding, guardrails, and inspection requirements. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 9", desc: "Fall Protection — Alberta requirements" },
          { icon: "📗", title: "CSA Z259 Series", desc: "Fall protection equipment standards" }
        ],
        quiz: [
          { q: "Under Alberta OHS Code Part 9, fall protection is required when a worker could fall:", options: ["1.5 m or more","3 m (approximately 10 ft) or more","5 m or more","Any height above ground level"], correct: 1, explanation: "Fall protection is required at 3 metres or more. It is also required at any height when falling into a hazardous substance, onto moving equipment, or over open water — regardless of height." },
          { q: "The minimum rated anchor strength for a personal fall arrest system (PFAS) in Alberta is:", options: ["8 kN","15 kN","22 kN","35 kN"], correct: 2, explanation: "Anchor points for fall arrest systems must be rated to withstand the forces generated during a fall — a minimum of 22 kN (approximately 5,000 lbs). This accounts for dynamic loading during arrest." },
          { q: "The maximum free-fall distance permitted in a personal fall arrest system in Alberta is:", options: ["0.6 m","1.2 m","1.8 m","3.0 m"], correct: 1, explanation: "The maximum free-fall distance is 1.2 metres. The total fall distance (free-fall + deceleration) must keep the worker at least 0.6 m from any lower level or obstruction." },
          { q: "A self-retracting lifeline (SRL) is used in fall arrest systems because:", options: ["It eliminates the need for an anchor point","It automatically extends and retracts to limit free-fall distance","It replaces the full body harness","It is required for all work at any height"], correct: 1, explanation: "An SRL automatically extends as the worker moves and retracts to take up slack. In a fall, it locks quickly, significantly reducing free-fall distance compared to a standard lanyard." },
          { q: "The correct top rail height for a guardrail on an elevated work platform in Alberta is:", options: ["0.9 m (36 in)","1.07 m (42 in)","1.2 m (48 in)","1.5 m (60 in)"], correct: 1, explanation: "The top rail must be 1.07 m (42 inches) above the work surface. The mid-rail goes halfway between, and the toeboard must be at least 90 mm high to prevent tools and materials from rolling off." },
          { q: "Fall restraint differs from fall arrest in that fall restraint:", options: ["Stops a worker mid-fall","Prevents the worker from reaching the fall hazard edge","Uses a higher-rated anchor","Is only used on rooftops"], correct: 1, explanation: "Fall restraint limits the worker's movement so they cannot reach the edge or fall hazard. The lanyard length is set so the worker physically cannot reach the point of danger. Fall arrest stops a worker who has already begun to fall." },
          { q: "The 4:1 ladder angle for an extension ladder means:", options: ["The ladder must weigh 4× the user's weight","One unit out from the wall for every four units of height","Four units out for every one unit of height","The ladder must extend 4 rungs above the landing"], correct: 1, explanation: "4:1 means for every 4 units of vertical height, the base is 1 unit away from the wall — a working angle of approximately 75°. This balances slip resistance at the base with tip-over resistance at the top." },
          { q: "An extension ladder used to access a roof must extend above the landing by at least:", options: ["0.5 m","1 m (3 ft)","1.5 m","2 m"], correct: 1, explanation: "The ladder must extend at least 1 metre (3 feet) above the landing or access point. This gives workers a secure handhold when stepping on and off the ladder." },
          { q: "A toeboard on a guardrail system must be at least how high?", options: ["50 mm (2 in)","90 mm (3.5 in)","150 mm (6 in)","200 mm (8 in)"], correct: 1, explanation: "The toeboard must be at least 90 mm (3.5 in) high to prevent tools, materials, and debris from rolling or being kicked off elevated work platforms onto workers below." },
          { q: "When must a full body harness be removed from service?", options: ["Every 5 years regardless of condition","After any fall arrest event, even if visually undamaged","Only if webbing is visibly frayed","After 500 hours of use"], correct: 1, explanation: "A harness must be immediately retired after arresting any fall, even if it appears undamaged. Internal webbing and structural components may have been damaged in ways not visible externally. Tag it out and replace." },
          { q: "Warning lines in a Controlled Access Zone (CAZ) must be placed at least how far from the edge?", options: ["1 m","2 m","3 m","5 m"], correct: 1, explanation: "Warning lines must be placed at least 2 metres from the unprotected edge. The CAZ allows trained workers to operate within this zone without full fall arrest, but only under controlled conditions." },
          { q: "A shock-absorbing lanyard reduces arrest forces by:", options: ["Being made of a shorter material","Tearing apart in a controlled way to absorb energy during a fall","Reducing the weight of the harness","Connecting to multiple anchor points simultaneously"], correct: 1, explanation: "Shock-absorbing (deceleration) lanyards contain a folded inner sleeve that tears in a controlled manner during a fall, extending the deceleration time and reducing the peak arrest force on the worker's body." },
          { q: "Scaffolding in Alberta must be inspected before each use by:", options: ["A professional engineer","A government OHS inspector","A competent person","The prime contractor only"], correct: 2, explanation: "A competent person — someone with the knowledge, training, and experience to identify scaffold hazards — must inspect scaffolding before each shift and after any event that could affect its integrity." },
          { q: "An extension ladder used on a construction site must be secured:", options: ["At the top only","At the bottom only","At both the top and bottom","At the middle only"], correct: 2, explanation: "Extension ladders must be secured at both the top and bottom to prevent movement. The top can be tied off or secured against a stable structure, and the base must be on stable, level ground." },
          { q: "Fall protection is required at heights below 3 m when a worker could fall into:", options: ["A soft sand pile","Loose soil","A hazardous substance or onto moving equipment","A gravel surface"], correct: 2, explanation: "Even below 3 m, fall protection is required when the landing surface is hazardous — such as chemicals, machinery, open water, or moving equipment. The nature of the landing, not just the height, determines the requirement." },
          { q: "Which of the following is a component of a personal fall arrest system?", options: ["Work positioning belt","Shock-absorbing lanyard","Travel restriction tether","Warning line barrier"], correct: 1, explanation: "A PFAS has three components: (1) full body harness, (2) connecting subsystem (shock-absorbing lanyard or SRL), and (3) anchor point. Work positioning belts and travel restriction systems are separate systems." },
          { q: "At approximately what angle from horizontal is an extension ladder set correctly?", options: ["60°","70°","75°","80°"], correct: 2, explanation: "The 4:1 ratio corresponds to an angle of approximately 75° from horizontal. At this angle, the ladder is steep enough to prevent slipping at the base but not so steep it risks tipping backward." },
          { q: "A safety monitoring system may only be used as fall protection when:", options: ["All workers are certified in fall protection","It is combined with a warning line system","Other methods are not reasonably practicable","The height is less than 5 m"], correct: 2, explanation: "The safety monitoring system is the lowest-level fall protection method. It can only be used when other methods (guardrails, fall arrest, travel restraint) are not reasonably practicable. A competent monitor must watch workers at all times." },
          { q: "The mid-rail in a guardrail system is positioned:", options: ["0.5 m above the work surface","Halfway between the top rail and the work surface","30 cm below the top rail","At the same height as the toeboard"], correct: 1, explanation: "The mid-rail is installed halfway between the top rail (1.07 m) and the work surface. Together with the top rail and toeboard, it creates a complete barrier preventing workers and materials from falling." },
          { q: "What does the Alberta OHS Code require after an event (such as wind or impact) that could affect scaffold integrity?", options: ["Workers may continue if no visible damage is seen","The scaffold must be re-inspected by a competent person before use","The scaffold must be dismantled and rebuilt","An OHS officer must certify the scaffold safe"], correct: 1, explanation: "After any event that could compromise scaffold integrity — high winds, vehicle impact, overloading — a competent person must inspect the scaffold before workers resume using it. Visual inspection by a worker is not sufficient." }
        ]
      },
      {
        id: 14, isExam: true, color: "#10b981", time: "20 min",

        sub: "WHMIS & Chemical Safety — 20 Questions",
        learn: `<div class="reading-section"><h3>📝 Exam Bank 4 — WHMIS &amp; Chemical Safety</h3><p>20 multiple-choice questions covering WHMIS 2015/GHS, SDS sections, label elements, signal words, hazard classes, exposure limits, and employer/worker obligations. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "Hazardous Products Act", desc: "WHMIS 2015 federal legislation" },
          { icon: "📗", title: "OHS Code Schedule 1", desc: "Alberta occupational exposure limits" }
        ],
        quiz: [
          { q: "WHMIS 2015 was updated to align with which international system?", options: ["ISO 14001","REACH (EU)","Globally Harmonized System (GHS)","OSHA HazCom 2012"], correct: 2, explanation: "WHMIS 2015 adopted the Globally Harmonized System (GHS), which standardizes chemical classification and labelling worldwide. This alignment helps workers recognize hazards on products from any country." },
          { q: "How many standardized sections does a Safety Data Sheet (SDS) contain?", options: ["8","12","16","20"], correct: 2, explanation: "Every SDS under WHMIS 2015/GHS has exactly 16 standardized sections, always in the same order. This consistency allows workers and emergency responders to quickly find needed information." },
          { q: "Which SDS section contains first aid measures?", options: ["Section 2","Section 4","Section 6","Section 8"], correct: 1, explanation: "Section 4 covers First Aid Measures — what to do for inhalation, skin contact, eye contact, and ingestion. Section 8 covers exposure controls and PPE; Section 2 covers hazard identification." },
          { q: "The GHS skull-and-crossbones pictogram indicates:", options: ["Flammable material","Oxidizing substance","Acute toxicity (severe)","Corrosive material"], correct: 2, explanation: "The skull and crossbones indicates severe acute toxicity (Categories 1–3) — substances that can cause death or serious harm after a single brief exposure by inhalation, skin contact, or ingestion." },
          { q: "The signal word 'DANGER' on a WHMIS label is reserved for hazard categories:", options: ["3–5","4–5 only","1–2 (most severe)","All categories equally"], correct: 2, explanation: "'DANGER' applies to hazard categories 1 and 2 — the most severe. These substances can cause death or serious irreversible injury. 'WARNING' applies to less severe categories (3 and above)." },
          { q: "Occupational Exposure Limits (OELs) for chemical agents in Alberta workplaces are found in:", options: ["The Hazardous Products Act","OHS Code Schedule 1","Health Canada's SDS registry","The Workers' Compensation Act"], correct: 1, explanation: "OELs for Alberta workplaces are set in OHS Code Schedule 1. Employers must ensure worker exposure to chemical agents does not exceed these limits. The limits are based on 8-hour time-weighted averages." },
          { q: "Which of the following products is EXEMPT from WHMIS 2015 requirements?", options: ["Welding rods","Explosives regulated under the Explosives Act","Industrial solvents","Compressed gases in cylinders"], correct: 1, explanation: "Explosives regulated under the federal Explosives Act are exempt from WHMIS 2015, as are firearms ammunition, radioactive materials under the Nuclear Safety and Control Act, and a few other federally regulated hazardous products." },
          { q: "A TLV-TWA represents:", options: ["Total Liquid Volume — Toxic Waste Assessment","Threshold Limit Value — Time-Weighted Average exposure over 8 hours","Temporary Limit Value for Task-related Warnings","Toxicological Limit Value with Technical Work Allowance"], correct: 1, explanation: "TLV-TWA (Threshold Limit Value — Time-Weighted Average) is the maximum acceptable average concentration of a substance over an 8-hour workday. Exposure above this level over time increases health risk." },
          { q: "IDLH stands for:", options: ["Intermediate Danger to Life and Health","Inhalation Danger Level Hazard","Immediately Dangerous to Life or Health","Identified Dust and Liquid Hazard"], correct: 2, explanation: "IDLH (Immediately Dangerous to Life or Health) is the maximum concentration from which a worker could escape within 30 minutes without irreversible health effects. IDLH atmospheres require supplied-air respiratory protection." },
          { q: "Which SDS section covers stability and reactivity information?", options: ["Section 7","Section 9","Section 10","Section 12"], correct: 2, explanation: "Section 10 covers Stability and Reactivity — whether the product is stable, what conditions to avoid, incompatible materials, and hazardous decomposition products. Section 7 covers handling and storage." },
          { q: "A workplace label is required when:", options: ["An SDS is unavailable for a product","A hazardous product is transferred into a different container","A product is rated 'Danger' only","Any liquid product is used"], correct: 1, explanation: "A workplace label is required whenever a hazardous product is moved from its original container into another container. It must include the product name, safe handling instructions, and reference to the SDS." },
          { q: "Which of the following is a WHMIS 2015 physical hazard class?", options: ["Carcinogenicity","Acute toxicity","Flammable gases","Reproductive toxicity"], correct: 2, explanation: "Flammable gases is a physical hazard class. Carcinogenicity, acute toxicity, and reproductive toxicity are health hazard classes. Physical hazards relate to the substance's physical properties (fire, explosion, reactivity)." },
          { q: "Employers must ensure SDS documents are:", options: ["Stored in the safety manager's locked office","Readily available to workers at all times during the shift","Available within 24 hours of request","Mailed to workers upon hire"], correct: 1, explanation: "SDS documents must be readily accessible to workers during every shift — not locked away or available only on request. Workers must be able to access the information in an emergency at any time." },
          { q: "An N95 respirator filters airborne particles at a minimum efficiency of:", options: ["80% at 1.0 micron","90% at 0.5 micron","95% at 0.3 micron","99% at 0.1 micron"], correct: 2, explanation: "N95 respirators filter at least 95% of airborne particles at the most penetrating particle size of 0.3 microns. The 'N' means 'Not resistant to oil.' They are single-use and require a proper fit seal." },
          { q: "The employer's obligation for WHMIS education and training requires:", options: ["Workers to seek training independently","The supplier to train workers at point of delivery","The employer to provide training on the hazardous products workers work with","Training every 10 years per worker"], correct: 2, explanation: "Employers are legally required to provide WHMIS education and training to workers who work with or near hazardous products. Training must be specific to the products in the workplace and reviewed regularly." },
          { q: "The GHS exclamation mark pictogram represents:", options: ["Severe acute toxicity","Skin/eye irritation, harmful if inhaled or swallowed","Flammable materials","Environmental hazard"], correct: 1, explanation: "The exclamation mark pictogram indicates less severe health hazards: skin irritation, eye irritation, skin sensitization, harmful if swallowed or inhaled, and narcotic effects. Compare to the skull-and-crossbones for severe acute toxicity." },
          { q: "What should a worker do if an SDS is not available for a product they are about to use?", options: ["Proceed with caution wearing maximum PPE","Work must stop until the SDS is obtained","Substitute with a similar product that has an SDS","Estimate the hazards based on the label alone"], correct: 1, explanation: "Work with the hazardous product must stop until the SDS is obtained. The employer is legally required to have SDS available for every hazardous product in the workplace. There is no acceptable alternative." },
          { q: "Benzene is a concern for which exposure route beyond inhalation?", options: ["Ingestion only","Skin absorption","Eye contact only","Injection"], correct: 1, explanation: "Benzene can be absorbed through intact skin in significant amounts, adding to inhalation exposure. Workers handling benzene-containing products must protect both their respiratory system and skin." },
          { q: "The Lower Explosive Limit (LEL) of a flammable substance is:", options: ["The maximum concentration safe for worker exposure","The minimum concentration in air that can ignite","The threshold concentration for health effects","The flashpoint temperature of the liquid"], correct: 1, explanation: "The LEL is the minimum concentration of a flammable gas or vapour in air that can ignite. Below the LEL, there is insufficient fuel to sustain combustion. Above the UEL (Upper Explosive Limit), there is too little oxygen." },
          { q: "How long must supplier Safety Data Sheets remain current under WHMIS 2015 regulations?", options: ["1 year","3 years","5 years","10 years"], correct: 1, explanation: "Under WHMIS 2015, SDS documents must be updated within 90 days of the supplier becoming aware of new hazard information, and must generally be reviewed at least every 3 years to ensure accuracy." }
        ]

        learn: `<div class="reading-section"><h3>📝 Exam Bank 5 — Incident Investigation</h3><p>20 multiple-choice questions covering investigation purpose, root/immediate/contributing causes, reporting timelines, scene preservation, iceberg model, 5 Whys, and FLHA. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Act Section 18", desc: "Reporting requirements — serious injuries and fatalities" },
          { icon: "📗", title: "NCSO Textbook Ch. 5", desc: "Incident Investigation" }
        ],
        quiz: [
          { q: "Which of the following must be reported IMMEDIATELY (by telephone) to Alberta OHS?", options: ["A near miss involving equipment damage","A minor cut requiring only first aid","A fracture or amputation","Any spill of a WHMIS-controlled product"], correct: 2, explanation: "Serious injuries — including fractures, amputations, loss of consciousness, and hospitalizations — must be reported immediately by phone to OHS. A written report follows within 10 days." },
          { q: "After the immediate telephone notification of a serious injury, a written report must be submitted within:", options: ["24 hours","72 hours","10 days","30 days"], correct: 2, explanation: "The written incident report must be submitted to OHS within 10 days of the serious incident. The initial verbal notification must happen immediately (within hours, not days)." },
          { q: "The 5 Whys technique is a root cause analysis tool that involves:", options: ["Asking five different workers about the incident","Identifying five possible causes and selecting the most likely","Repeatedly asking 'Why?' until the underlying systemic cause is found","Assigning responsibility across five departments"], correct: 2, explanation: "The 5 Whys method involves asking 'Why did this happen?' and then asking why again about each answer — typically five times — until the root systemic cause is identified rather than just the surface-level event." },
          { q: "The 'iceberg model' of workplace incidents illustrates that:", options: ["Most construction fatalities involve equipment","Serious injuries represent only the visible tip of a much larger set of underlying problems","All incidents must be reported to WCB","Near misses are less important than property damage incidents"], correct: 1, explanation: "The iceberg model shows that for every serious injury visible 'above the waterline,' there are many more near misses, minor injuries, unsafe acts, and unsafe conditions hidden beneath. Addressing these prevents serious events." },
          { q: "According to the iceberg model, for every serious injury there may be approximately how many near misses?", options: ["10","30","100","600"], correct: 3, explanation: "Research suggests the ratio is approximately: 1 serious injury : 10 minor injuries : 30 property damage incidents : 600 near misses. This shows that near misses are the most common and most preventable warning signs." },
          { q: "Scene preservation after a serious incident is required until:", options: ["The investigation report is complete","The employer's insurance adjuster arrives","An OHS officer releases the scene","72 hours have passed"], correct: 2, explanation: "The scene must remain undisturbed until an OHS officer grants permission to resume. The only exceptions are attending to the injured, preventing further injury, and preventing critical equipment damage." },
          { q: "The Fishbone (Ishikawa) diagram is used in incident investigation to:", options: ["Map the evacuation route taken during the incident","Organize potential causes of an incident by category","Calculate the financial cost of the incident","Document PPE requirements for the next task"], correct: 1, explanation: "The fishbone diagram organizes potential causes into categories — commonly Man, Machine, Method, Material, and Environment — helping investigators identify all contributing factors rather than focusing on a single cause." },
          { q: "An 'unsafe act' is best described as:", options: ["A physical condition that increases risk","A behavior by a worker that deviates from safe work procedures","A gap in the written safety program","A hazard identified during a formal HIRA"], correct: 1, explanation: "Unsafe acts are behaviors: bypassing a guard, working without required PPE, using defective tools. Unsafe conditions are physical states: a wet floor, poor lighting, a missing guardrail. Both can be immediate causes of incidents." },
          { q: "An example of a CONTRIBUTING cause in an incident investigation is:", options: ["The worker slipped on a wet floor","The wet floor had no warning sign","The supervisor failed to ensure wet floor signs were posted","There was no policy requiring wet floor signs to be posted"], correct: 2, explanation: "Contributing causes allow the immediate cause to exist: the supervisor's failure to enforce the rule. The immediate cause is the wet floor. The root cause is the absent policy. All three require corrective action." },
          { q: "An example of a ROOT cause in an incident investigation is:", options: ["The worker fell from the scaffold","A scaffold board was broken","The scaffold was not inspected before use","There was no written procedure requiring scaffold inspection before each shift"], correct: 3, explanation: "The root cause is the systemic failure that allowed everything else to happen — the missing inspection procedure. Without addressing this, the same sequence of events will recur." },
          { q: "The PRIMARY purpose of incident investigation is:", options: ["To determine who is at fault","To calculate insurance premiums","To prevent recurrence by identifying root causes","To meet regulatory documentation requirements"], correct: 2, explanation: "Investigation is about preventing recurrence — not blame assignment. By identifying root and contributing causes, organizations can implement systemic changes that stop the same incident from happening again." },
          { q: "Who should be included on an incident investigation team?", options: ["Only management to maintain confidentiality","Only external consultants for impartiality","A mix of management and worker representatives familiar with the work","The employer's legal counsel only"], correct: 2, explanation: "Investigation teams should include workers familiar with the task and work area, as well as supervisors and management. Worker involvement improves accuracy and buy-in for corrective actions." },
          { q: "A corrective action documented in an incident investigation report must include:", options: ["The name of the worker who caused the incident","A responsible person and a deadline for completion","The estimated WCB claim value","The worker's complete injury history"], correct: 1, explanation: "Corrective actions are only effective when someone is accountable for completing them by a specific date. Undated, unassigned actions rarely get done and leave the hazard in place." },
          { q: "What is a 'near miss'?", options: ["An incident that resulted in a minor injury","An unplanned event that could have caused harm but did not","An accident involving only property damage","A safety violation noted during an inspection"], correct: 1, explanation: "A near miss is an unplanned event that did not result in injury, illness, or damage but had the potential to do so. It must be investigated with the same rigor as a serious incident because the same failures are present." },
          { q: "First aid records in Alberta must be retained for:", options: ["1 year","3 years","5 years","10 years"], correct: 1, explanation: "Under Alberta OHS Code Part 11, first aid records must be kept for a minimum of 3 years. These records can be important for identifying injury patterns and potential occupational disease claims." },
          { q: "What action should a supervisor take IMMEDIATELY after a serious incident?", options: ["Complete the investigation report before notifying anyone","Call the media and the employer's legal team","Secure the scene, call for first aid, and notify management and OHS","Continue operations to minimize financial impact"], correct: 2, explanation: "The immediate priority is life safety: secure the scene to prevent further injury, get first aid to the injured worker, and notify management and OHS. Investigation comes after the immediate emergency is managed." },
          { q: "Workers who witnessed an incident should be interviewed:", options: ["Together to develop a unified statement","Separately to gather independent, uninfluenced accounts","Only after they have submitted written statements","Only if they were directly involved"], correct: 1, explanation: "Witnesses must be interviewed separately to prevent one person's account from influencing another's. Each witness will have observed different aspects of the event, and this diversity of perspectives strengthens the investigation." },
          { q: "A WCB (Workers' Compensation Board) report is required for injuries that:", options: ["Result in a fatality only","Require more than first aid (lost time, medical aid)","Occur outside normal working hours only","Are reported by a union representative"], correct: 1, explanation: "WCB requires reporting of injuries that require medical treatment beyond first aid — including medical aid claims (doctor visits) and lost-time injuries. First-aid-only incidents are typically not reported to WCB." },
          { q: "The FLHA (Field Level Hazard Assessment) is completed:", options: ["Annually by the safety manager","Before each shift or new task, at the specific work location","Only before high-risk tasks identified in the formal HIRA","Once per project for each work area"], correct: 1, explanation: "The FLHA is a daily field-level tool completed by workers at the actual work location before starting. It captures hazards that may have changed since the last formal assessment — new equipment, weather, other crews." },
          { q: "After investigating an incident and implementing corrective actions, the final step should be:", options: ["Closing the investigation file","Verifying the corrective actions are effective and preventing recurrence","Submitting the report to WCB","Scheduling a refresher training session for the involved worker"], correct: 1, explanation: "The investigation is not complete until corrective actions are verified as effective. A follow-up review confirms that the implemented controls are working and that the root cause has been addressed, not just documented." }
        ]

      {
