        sub: "Personal Protective Equipment — 20 Questions",
        learn: `<div class="reading-section"><h3>📝 Exam Bank 6 — Personal Protective Equipment</h3><p>20 multiple-choice questions covering CSA standards for head, eye, hearing, foot, and respiratory protection; inspection requirements; employer obligations; and PPE limitations. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 18", desc: "Personal Protective Equipment — Alberta requirements" },
          { icon: "📗", title: "CSA Z94.1 / Z94.3 / Z195", desc: "Head, eye, and foot protection standards" }
        ],
        quiz: [
          { q: "Which CSA standard governs industrial protective headwear (hard hats) in Canada?", options: ["CSA Z94.3","CSA Z94.1","CSA Z195","CSA Z96"], correct: 1, explanation: "CSA Z94.1 specifies performance requirements for hard hats including impact, penetration, electrical, and flammability resistance. It defines Class E (electrical) and Class G (general) designations." },
          { q: "What class of hard hat provides protection against electrical hazards up to 20,000 volts?", options: ["Class G","Class E","Class C","Class D"], correct: 1, explanation: "Class E (Electrical) hard hats are rated to withstand 20,000 volts. Class G (General) hard hats are rated to 2,200 volts. Class C hard hats provide no electrical protection." },
          { q: "Safety footwear bearing an Orange Triangle designation provides protection against:", options: ["Puncture through the sole","Electrical hazard (step-on and pass-through)","Chemical splash to the foot","Slip resistance on oily surfaces"], correct: 1, explanation: "Orange Triangle footwear (under CSA Z195) provides electrical hazard protection — the sole and heel insulate the wearer from step-on and pass-through electrical hazards. Green Triangle provides toe and puncture protection." },
          { q: "Which of the following is NOT an air-purifying respirator?", options: ["N95 disposable filtering facepiece","Half-face reusable respirator","Full-face reusable respirator","Self-Contained Breathing Apparatus (SCBA)"], correct: 3, explanation: "A SCBA is a supplied-air respirator — it carries its own air supply and does not filter ambient air. Air-purifying respirators clean the ambient air through filters or cartridges. SCBAs are required in IDLH atmospheres." },
          { q: "CSA Z96 high-visibility apparel Class 3 is required when workers are:", options: ["Working inside a building after dark","Working at heights above 10 m","Working on roadways with vehicular traffic","Working with hazardous chemicals"], correct: 2, explanation: "Class 3 high-visibility apparel provides the greatest retroreflectivity and is required on roadways where workers are exposed to vehicle traffic. Class 2 may be acceptable for non-road construction sites with mobile equipment." },
          { q: "Before using a tight-fitting respirator, a worker must have BOTH:", options: ["A fit test and supervisor approval","A medical evaluation and annual fit test","A doctor's note and OHS certification","A daily seal check and annual inspection"], correct: 1, explanation: "Alberta OHS Code requires both a medical evaluation (to ensure the worker is physically able to wear a respirator) and a fit test (to confirm the device seals properly). Both must be renewed periodically." },
          { q: "Hard hats should be replaced after a significant impact AND at a maximum interval of:", options: ["3 years","5 years","7 years","10 years"], correct: 1, explanation: "Hard hats must be replaced after any significant impact (even if undamaged) and at the manufacturer's recommended interval — typically 5 years from the manufacture date due to UV degradation of the plastic shell." },
          { q: "Hearing protection is required in Alberta when noise levels exceed:", options: ["80 dBA","85 dBA","90 dBA","95 dBA"], correct: 1, explanation: "The 8-hour exposure limit is 85 dBA in Alberta. Engineering and administrative controls should be implemented first. Hearing protection is the control of last resort." },
          { q: "Double hearing protection (earplugs AND earmuffs combined) is typically required when noise levels exceed:", options: ["85 dBA","90 dBA","105 dBA","115 dBA"], correct: 2, explanation: "When noise levels exceed 105 dBA, a single hearing protector may not provide sufficient attenuation, and double protection (combining earplugs and earmuffs) is required to reduce exposure to safe levels." },
          { q: "Green Triangle safety footwear (CSA Z195 Grade 1) provides:", options: ["Electrical hazard and chemical resistance","Toe cap protection and puncture-resistant sole","Chainsaw-resistant leg protection","Cold insulation for winter work"], correct: 1, explanation: "Green Triangle (Grade 1) is the most common safety footwear — it provides impact and compression protection (steel toe cap) and puncture protection (sole). It is required on most construction sites." },
          { q: "Safety glasses worn as primary eye protection must meet which standard?", options: ["CSA Z94.1","CSA Z94.3","CSA Z195","CSA Z96"], correct: 1, explanation: "CSA Z94.3 governs eye and face protectors in Canada. Safety glasses, face shields, and goggles must meet this standard. It specifies lens impact resistance, optical quality, and side protection requirements." },
          { q: "A respirator filter rated 'P100' provides filtration efficiency of:", options: ["80%","95%","99.97%","100%"], correct: 2, explanation: "P100 filters (also called HEPA filters) remove at least 99.97% of airborne particles. The 'P' means 'oil Proof' — resistant to oil aerosols. These are used for asbestos, lead, and high-hazard dust applications." },
          { q: "The employer's obligation regarding PPE costs is:", options: ["Workers must purchase their own PPE","Employers must provide required PPE at no cost to the worker","PPE costs are deducted from wages and reimbursed annually","PPE is the worker's responsibility for basic items"], correct: 1, explanation: "Under Alberta OHS legislation, employers must provide required PPE at no cost to workers. Requiring workers to purchase PPE as a condition of employment is not permitted." },
          { q: "Can a face shield replace safety glasses as the only eye protection?", options: ["Yes, if it covers the full face","Yes, for chemical splash only","No — safety glasses must be worn under a face shield","Yes, if the face shield meets CSA Z94.3"], correct: 2, explanation: "A face shield protects the face and neck but does not provide complete eye protection on its own. Safety glasses (or goggles) must be worn underneath. The face shield provides supplemental protection." },
          { q: "Before each use of a reusable half-face respirator, the worker should perform:", options: ["A full fit test","A positive and negative pressure user seal check","A medical evaluation","An atmospheric test of the work area"], correct: 1, explanation: "Before each use, the worker performs a positive pressure check (block the exhalation valve and breathe out slightly — no leaks should occur) and negative pressure check (block inhalation valve and inhale — facepiece should collapse slightly). This verifies the seal." },
          { q: "Welding operations require which eye/face protection?", options: ["Safety glasses alone","A clear polycarbonate face shield","A welding helmet with the correct shade lens","Tinted safety glasses rated for sunlight"], correct: 2, explanation: "Welding produces intense UV and IR radiation, intense visible light, and sparks. A welding helmet with the appropriate shade number lens is required. The shade number depends on the welding process and amperage." },
          { q: "The hard hat suspension system serves to:", options: ["Attach the hard hat to a chin strap","Keep the shell away from the head and absorb shock energy","Provide additional thermal insulation","Allow ventilation in hot weather"], correct: 1, explanation: "The suspension system holds the shell away from the worker's head, creating a space that allows the shell to absorb and distribute impact energy before it reaches the skull. A damaged suspension reduces protection even if the shell looks fine." },
          { q: "Cut-resistant gloves should be selected based on:", options: ["Colour coding by manufacturer","ANSI/ISEA cut resistance level matched to the specific cutting hazard","Worker preference for comfort","Cost compared to other PPE options"], correct: 1, explanation: "Gloves are rated on cut resistance scales (ANSI/ISEA A1–A9 or EN388). The level must match the hazard — a blade that easily cuts through lower-rated gloves requires a higher protection level." },
          { q: "When cleaning reusable PPE, the worker should:", options: ["Use any household detergent available","Follow the manufacturer's cleaning instructions","Replace PPE rather than ever washing it","Soak in a bleach solution for 30 minutes"], correct: 1, explanation: "Manufacturer cleaning instructions must be followed. Incorrect cleaning agents can degrade harness webbing, respirator materials, or hard hat plastics — reducing the protection they provide without any visible damage." },
          { q: "Which of the following indicates that PPE inspection has failed and the item should be removed from service?", options: ["Minor surface scratches on safety glasses","Slight discolouration of a hard hat shell from age","Frayed webbing on a safety harness","Hearing protection with a slightly compressed foam tip"], correct: 2, explanation: "Frayed webbing on a harness is a serious defect that reduces load-bearing capacity. The harness must be immediately removed from service and replaced. Minor cosmetic wear on glasses or normal discolouration of hard hats does not automatically condemn them." }
        ]

      {

        learn: `<div class="reading-section"><h3>📝 Exam Bank 7 — Confined Space &amp; Electrical Safety</h3><p>20 multiple-choice questions covering confined space classification, atmospheric testing, entry permits, LOTO steps, arc flash, GFCIs, power line clearances, and stored energy. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 5", desc: "Confined Spaces" },
          { icon: "📗", title: "OHS Code Part 15", desc: "Control of Hazardous Energy (LOTO)" },
          { icon: "📙", title: "CSA Z462", desc: "Workplace Electrical Safety" }
        ],
        quiz: [
          { q: "Which of the following is NOT a defining characteristic of a confined space?", options: ["Limited means of entry or exit","Large enough to enter and perform work","Not designed for continuous occupancy","Located underground"], correct: 3, explanation: "Being underground is not required for a space to be classified as a confined space. A tank, hopper, silo, or above-ground vault can all be confined spaces. The three defining criteria are size, access, and occupancy purpose." },
          { q: "What oxygen concentration is considered 'oxygen enriched' in a confined space?", options: ["Above 20.9%","Above 21%","Above 23%","Above 25%"], correct: 2, explanation: "Above 23% oxygen is considered oxygen enriched, which significantly increases the risk of fire and explosion. Normal air is approximately 20.9% oxygen. Below 19.5% is oxygen deficient — a risk to life." },
          { q: "In confined space atmospheric testing, what is tested FIRST?", options: ["Toxic substances","Combustible gases (LEL)","Oxygen concentration","Carbon monoxide"], correct: 2, explanation: "Oxygen must be tested first for two reasons: it ensures there is sufficient O₂ to sustain the tester's life, and it affects how the combustible gas meter reads. An oxygen-deficient atmosphere can give a false low LEL reading." },
          { q: "Entry into a confined space is prohibited when the combustible gas concentration reaches:", options: ["5% of LEL","10% of LEL","25% of LEL","50% of LEL"], correct: 1, explanation: "Entry is prohibited when the atmosphere is at or above 10% of the LEL. This provides a safety margin well below the explosive range. Workers must evacuate immediately if the reading reaches 10% LEL." },
          { q: "The standby person (attendant) during confined space entry must:", options: ["Wear a supplied-air respirator at all times","Enter the space to retrieve an unresponsive entrant","Remain outside the space and initiate non-entry rescue if needed","Have the same confined space entry training as the entrant"], correct: 2, explanation: "The standby person must stay outside the space at all times. They monitor entrants, maintain communication, and initiate rescue by non-entry means (tripod and winch) or by calling emergency services." },
          { q: "A confined space entry permit must be posted:", options: ["In the safety manager's office","In the prime contractor's trailer","At the entry point to the confined space","With the entry supervisor throughout the job"], correct: 2, explanation: "The permit must be posted at the entry point so all workers can see it and verify the conditions and authorizations before entering. It is a live document that must reflect current atmospheric readings." },
          { q: "Most confined space fatalities are caused by:", options: ["Electrical hazards","Engulfment by grain or sand","Would-be rescuers entering without proper equipment","Mechanical hazards inside the space"], correct: 2, explanation: "The majority of confined space fatalities are would-be rescuers who enter without proper equipment or training. Non-entry rescue should always be the first choice — initiate the emergency response plan and call 911." },
          { q: "What does LOTO stand for?", options: ["Lock Out, Tag Out","Log Out, Test On","Lock On, Turn Off","Lift Out, Take Over"], correct: 0, explanation: "LOTO stands for Lockout/Tagout — a procedure to prevent the unexpected energization, startup, or release of stored energy during maintenance or servicing of equipment." },
          { q: "In the LOTO procedure, each worker applies their own personal lock because:", options: ["It is a union requirement","No one can remove another worker's lock, ensuring they cannot be exposed to energy without their consent","It reduces the number of tags required","It satisfies the OHS documentation requirement"], correct: 1, explanation: "Personal locks mean only the worker who applied the lock can remove it. This guarantees the equipment cannot be re-energized while that worker is still in the danger zone — regardless of what others decide." },
          { q: "Which of the following is a type of stored energy that must be addressed in LOTO?", options: ["Static electricity from worker clothing","Thermal energy in heated process piping","Sound energy from nearby equipment","Magnetic fields from nearby transformers"], correct: 1, explanation: "Stored energy types include: gravitational (suspended loads), hydraulic/pneumatic pressure, spring tension, capacitor charge, and thermal energy (heated pipes, steam). All must be released or restrained before work begins." },
          { q: "The verification step of LOTO requires:", options: ["Confirming the written procedure matches the equipment","Attempting to start or operate the equipment to confirm it cannot be energized","Notifying all affected workers that lockout is in place","Testing the equipment to ensure it works normally after LOTO is removed"], correct: 1, explanation: "After all locks are applied and stored energy is released, the worker attempts to start the equipment. If it cannot be started or energized, zero energy state is confirmed. If it starts, the procedure has failed and must be repeated." },
          { q: "The minimum clearance from overhead power lines above 750V for construction equipment in Alberta is:", options: ["3 m","5 m","7 m","10 m"], correct: 2, explanation: "A minimum 7-metre clearance is required from power lines above 750V. A spotter must assist equipment operators. If closer work is required, the utility owner must be contacted to de-energize or guard the line." },
          { q: "GFCIs on construction sites are required to trip when detecting a ground fault of as little as:", options: ["1–2 mA","4–6 mA","10–15 mA","20–30 mA"], correct: 1, explanation: "GFCIs detect current leakage as small as 4–6 mA (milliamps) and trip within 1/40th of a second. This is below the threshold for ventricular fibrillation (about 10 mA), preventing electrocution from small ground faults." },
          { q: "An arc flash produces temperatures that can reach:", options: ["1,000°C","5,000°C","20,000°C","100,000°C"], correct: 2, explanation: "Arc flash temperatures can reach 20,000°C — hotter than the surface of the sun. This produces intense radiant heat, pressure waves, UV and IR radiation, and shrapnel from vaporized conductors." },
          { q: "Arc flash PPE is rated in units of:", options: ["Volts per metre","Joules per square centimetre","Calories per square centimetre (cal/cm²)","Watts per square metre"], correct: 2, explanation: "Arc flash incident energy is measured in cal/cm² (calories per square centimetre). PPE is selected to match or exceed the calculated incident energy level at the specific work location." },
          { q: "Why is tagout alone considered less safe than lockout?", options: ["Tags are more difficult to apply correctly","Tags can be removed by anyone — they do not physically prevent re-energization","Tags require more documentation","Tags only work on electrical energy sources"], correct: 1, explanation: "A tag is a warning device only — it can be removed or ignored. A lock physically prevents the isolation device from being moved, providing positive protection that a tag cannot. Lockout is always preferred over tagout alone." },
          { q: "An energized electrical work permit is required when:", options: ["Any electrical equipment is being used","Work on or near energized conductors is unavoidable and de-energizing is not feasible","Workers are within 3 m of any electrical panel","Outdoor electrical work is performed during rain"], correct: 1, explanation: "Working on energized equipment should be a last resort. When unavoidable, a written energized electrical work permit must document the justification, arc flash assessment, qualified worker identity, and required PPE." },
          { q: "Class 0 rubber insulating gloves provide protection against voltages up to:", options: ["500 V","1,000 V","5,000 V","10,000 V"], correct: 1, explanation: "Class 0 rubber insulating gloves are rated for use up to 1,000 volts. Higher classes protect against higher voltages. Gloves must be inspected before each use (air inflation test) and worn with leather protector gloves." },
          { q: "A confined space is classified as 'permit-required' when it:", options: ["Is located underground","Has a depth of more than 1.5 m","Contains or could develop a serious hazard (atmospheric, engulfment, entrapment)","Requires more than one worker to enter"], correct: 2, explanation: "A confined space is permit-required when it has a known or potential serious hazard: an atmospheric hazard (toxic, oxygen deficient/enriched, flammable), engulfment, entrapment, or any other recognized serious safety or health hazard." },
          { q: "After a confined space entry permit expires, what must occur before workers re-enter?", options: ["Workers may continue if conditions appear unchanged","The entry supervisor must re-sign the existing permit only","A new permit must be issued with current atmospheric readings","Work may continue for up to 4 additional hours without a new permit"], correct: 2, explanation: "Each confined space entry permit has a defined time limit. When it expires, conditions must be re-evaluated and a new permit issued. Atmospheric conditions can change rapidly — an expired permit is no longer valid." }
        ]
      },

        learn: `<div class="reading-section"><h3>📝 Exam Bank 8 — Fire Safety &amp; Emergency Response</h3><p>20 multiple-choice questions covering fire classes, PASS technique, extinguisher types and inspection, the fire triangle, ERP components, first aid levels, and muster point procedures. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 7", desc: "Emergency Preparedness and Response" },
          { icon: "📗", title: "OHS Code Part 11", desc: "First Aid requirements" },
          { icon: "📙", title: "NFPA 10", desc: "Portable Fire Extinguishers" }
        ],
        quiz: [
          { q: "A fire involving flammable liquids such as gasoline, oil, or paint is classified as:", options: ["Class A","Class B","Class C","Class D"], correct: 1, explanation: "Class B fires involve flammable and combustible liquids. They require an extinguisher that smothers or interrupts the combustion chain — such as CO₂, dry chemical (ABC or BC), or foam. Never use water on Class B fires." },
          { q: "The first action in the PASS technique for fire extinguisher use is:", options: ["Aim at the base of the fire","Squeeze the handle","Pull the pin","Sweep side to side"], correct: 2, explanation: "PASS: Pull the pin → Aim at the base → Squeeze → Sweep. Pulling the pin breaks the tamper seal and allows the handle to be squeezed. Without pulling the pin first, the extinguisher cannot be activated." },
          { q: "A Class C fire involves:", options: ["Ordinary combustibles like wood and paper","Flammable liquids","Energized electrical equipment","Combustible metals"], correct: 2, explanation: "Class C fires involve energized electrical equipment. Once power is cut, the fire becomes a Class A or B fire. Never use water on Class C fires — it conducts electricity. Use CO₂ or dry chemical (ABC) extinguishers." },
          { q: "How often must portable fire extinguishers receive a professional inspection by a certified technician?", options: ["Monthly","Quarterly","Annually","Every 3 years"], correct: 2, explanation: "Professional inspections occur annually. Workers perform monthly visual checks (pressure gauge in green zone, tamper seal intact, no visible damage). Internal maintenance is required every 6 years. Recharge immediately after any use." },
          { q: "When using a fire extinguisher, where should you aim?", options: ["At the top of the flames","At the smoke above the fire","At the base of the fire","At the worker nearest the fire"], correct: 2, explanation: "Aiming at the base (the fuel source) puts out the fire. Aiming at the flames is ineffective because the extinguishing agent passes through the flame without stopping combustion at the fuel surface." },
          { q: "Under OHS Code Part 11, a construction site with 25 workers in a medium-hazard setting requires:", options: ["An Emergency Medical Responder","Level 3 first aider","Level 2 first aider","Level 1 first aider"], correct: 2, explanation: "10–49 workers requires a Level 2 first aider on site at all times when workers are present. The level increases with worker count and hazard classification. A first aider must always be on-site, not just on call." },
          { q: "An Emergency Response Plan (ERP) must include:", options: ["Worker personal emergency contact information only","Potential emergency scenarios, evacuation routes, muster points, and emergency contacts","A list of all WHMIS-controlled products on site","Insurance policy numbers and claim procedures"], correct: 1, explanation: "An ERP must address: potential emergencies, alarm/notification procedures, evacuation routes and exits, muster points, worker accountability, emergency contact numbers, and first aid/rescue procedures." },
          { q: "Workers may re-enter a building after an evacuation only when:", options: ["30 minutes have passed since the alarm stopped","The fire alarm has been reset","Authorized by emergency responders (fire department or incident commander)","The supervisor gives the verbal all-clear"], correct: 2, explanation: "Only emergency responders (fire department or incident commander) can authorize re-entry. A supervisor cannot make this call — they do not have the information about internal conditions that firefighters do." },
          { q: "A fire involving combustible metals such as magnesium or titanium is classified as:", options: ["Class A","Class B","Class C","Class D"], correct: 3, explanation: "Class D fires involve combustible metals. They require a specialized dry powder extinguisher specifically rated for the metal involved. Standard ABC extinguishers are ineffective and can intensify Class D fires." },
          { q: "What does removing oxygen from the fire triangle accomplish?", options: ["Reduces the temperature below ignition point","Removes the fuel source","Starves the fire of oxygen, stopping combustion","Interrupts the chemical chain reaction only"], correct: 2, explanation: "The fire triangle requires fuel, oxygen, and heat. Removing oxygen (e.g., by smothering with CO₂ or a fire blanket) stops combustion. This is why CO₂ extinguishers work on Class B and C fires." },
          { q: "First aid records in Alberta must be retained for:", options: ["1 year","3 years","5 years","10 years"], correct: 1, explanation: "Alberta OHS Code Part 11 requires first aid records to be kept for at least 3 years. These records support WCB claims and help identify recurring injury patterns or potential occupational disease." },
          { q: "The purpose of a muster point (assembly area) after an evacuation is to:", options: ["Stage firefighting equipment","Account for all workers and identify anyone missing","Provide a media briefing location","Store emergency supplies"], correct: 1, explanation: "At the muster point, supervisors/wardens account for every worker. If anyone is unaccounted for, emergency responders are immediately notified so search and rescue can begin. Never assume everyone is out." },
          { q: "An ABC dry chemical fire extinguisher is effective on which fire classes?", options: ["A, B, and D","A, B, and C","B, C, and K","A, C, and K"], correct: 1, explanation: "ABC dry chemical (multi-purpose) extinguishers work on: Class A (combustibles), Class B (flammable liquids), and Class C (energized electrical). They are the most common type on construction sites." },
          { q: "A 'hot work permit' is required for:", options: ["All work performed in summer heat","Welding, cutting, or grinding near flammable materials","Work in confined spaces with elevated temperatures","Any work involving Class B flammable liquids"], correct: 1, explanation: "Hot work permits are required when performing any ignition-producing work (welding, cutting, grinding, open flames) in areas where flammable materials or vapors may be present. The permit ensures the area is prepared and monitored." },
          { q: "Emergency contact numbers on a construction site must be:", options: ["Kept in the safety manager's locked files","Posted at the worksite where workers can see them","Memorized by all workers","Submitted to OHS before work begins"], correct: 1, explanation: "Emergency numbers must be posted visibly at the worksite so any worker can access them immediately. Numbers should include local emergency services (911), the employer's emergency contact, and site-specific numbers (utility companies, etc.)." },
          { q: "Which element is NOT part of the fire triangle?", options: ["Fuel","Oxygen","Heat","Pressure"], correct: 3, explanation: "The fire triangle has three elements: fuel, oxygen, and heat. Remove any one to extinguish the fire. Pressure is not a component of the fire triangle (though it is relevant to some explosion hazards separately)." },
          { q: "OHS Code Part 7 covers which workplace topic?", options: ["Fall protection","Emergency preparedness and response","Confined space entry","Personal protective equipment"], correct: 1, explanation: "Alberta OHS Code Part 7 covers Emergency Preparedness and Response — including the requirement for written ERPs, communication procedures, and evacuation planning for all workplaces." },
          { q: "A worker's clothing catches fire. The correct response is:", options: ["Run to the nearest exit","Remove the burning clothing immediately","Stop, drop to the ground, and roll to smother the flames","Use a fire extinguisher directed at themselves"], correct: 2, explanation: "Stop, Drop, and Roll smothers the fire by cutting off oxygen. Running fans the flames and makes them worse. Dropping quickly gets the fire away from the face. Rolling smothers flames on clothing." },
          { q: "A Class K fire involves:", options: ["Ordinary combustibles","Flammable liquids","Energized electrical equipment","Cooking oils and fats in commercial kitchens"], correct: 3, explanation: "Class K fires involve cooking oils and animal fats at high temperatures in commercial cooking equipment. They require specialized wet chemical extinguishers. Standard extinguishers are ineffective and dangerous on Class K fires." },
          { q: "Emergency drills for an ERP are required because:", options: ["OHS officers check for drill records during inspections","Workers must practice procedures so they respond correctly without thinking under stress","Drills satisfy the employer's insurance requirements","Workers must earn first aid certification annually"], correct: 1, explanation: "Drills make emergency procedures automatic. Under stress, workers revert to practiced behavior. An ERP that has never been drilled may not be executed correctly when it matters most — during an actual emergency." }
        ]
      },

        learn: `<div class="reading-section"><h3>📝 Exam Bank 9 — Excavation, Mobile Equipment &amp; Cranes</h3><p>20 multiple-choice questions covering trench safety, soil classification, utility locating, mobile equipment pre-use inspection, crane operations, rigging, and spotter requirements. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 32", desc: "Excavating and Tunneling" },
          { icon: "📗", title: "OHS Code Part 22", desc: "Cranes, Hoists, and Lifting Devices" },
          { icon: "📙", title: "Alberta One-Call (Utility Safety Partners)", desc: "Underground utility locating requirements" }
        ],
        quiz: [
          { q: "In Alberta, a hazard assessment must be completed before excavating when the trench depth will exceed:", options: ["0.5 m","1.5 m","3 m","5 m"], correct: 1, explanation: "A hazard assessment is required before any excavation that will be deeper than 1.5 m (approximately 5 feet). Workers must not enter an unprotected trench of this depth without an appropriate protective system." },
          { q: "Before any excavation work, what must be done regarding underground utilities?", options: ["Purchase additional insurance","Locate and mark all underground utilities through Alberta One-Call","Hire a licensed utility contractor to supervise","File a notification with OHS two weeks in advance"], correct: 1, explanation: "Alberta One-Call (now Utility Safety Partners) must be contacted before any excavation. Utility owners will locate and mark their buried infrastructure. Hand-dig within 1 m of any marked utility to avoid damage." },
          { q: "The minimum safe approach distance when hand-excavating near a located utility in Alberta is:", options: ["0.3 m (1 ft)","1 m (3 ft) — mechanized; hand-dig within this zone","2 m","3 m"], correct: 1, explanation: "Alberta OHS Code requires hand digging within 1 metre of a located underground utility. Power equipment must maintain 1 m clearance and then hand tools take over. This prevents utility strikes." },
          { q: "Spoil piles from an excavation must be kept at minimum how far from the trench edge?", options: ["0.3 m","0.6 m","1 m","2 m"], correct: 2, explanation: "Spoil piles, equipment, and materials must be kept at least 1 metre from the edge of an excavation. Closer placement increases the surcharge load on the trench wall, increasing the risk of collapse." },
          { q: "A competent person must inspect an open excavation:", options: ["Once at the start of the job","After each rainfall event and before each shift","Only when workers are inside the excavation","Once per week during the project"], correct: 1, explanation: "Excavations must be inspected by a competent person before each shift and after any event that could affect stability — including rainfall, blasting, or nearby heavy equipment operation. Soil conditions change rapidly." },
          { q: "Workers in a trench must have a means of egress (ladder or ramp) within what maximum distance?", options: ["3 m","7.5 m","10 m","15 m"], correct: 1, explanation: "Alberta OHS Code requires that workers in an excavation have a means of egress (ladder, ramp, or stairway) within 7.5 metres of their work location. This ensures rapid exit in case of an emergency." },
          { q: "Type A soil for excavation purposes is characterized as:", options: ["Sandy or loose fill — most unstable","Cohesive and stable — highest strength","Saturated or submerged soil","Previously disturbed fill material"], correct: 1, explanation: "Type A soils are cohesive (clay-based) with high unconfined compressive strength. They are the most stable category. Type C (sandy, granular, or previously disturbed) is the least stable and most prone to collapse." },
          { q: "A pre-use inspection of mobile equipment must be performed:", options: ["Weekly","Monthly by a certified mechanic","Before each shift or before the operator uses the equipment","Once per project"], correct: 2, explanation: "Mobile equipment (forklifts, excavators, cranes, telehandlers) must be inspected before each shift. Operators complete pre-use inspection checklists — defects must be reported and tagged out before operation." },
          { q: "When mobile equipment is backing up on a construction site, safe practice requires:", options: ["Using the horn only","Using a backup alarm alone","A combination of backup alarm AND a spotter where workers are present","Mirrors only — spotters are not required"], correct: 2, explanation: "Backup alarms warn workers, but in noisy environments workers may not hear them. A spotter (designated signal person) actively watches the blind spots and guides the operator, providing a second layer of protection." },
          { q: "The purpose of tag lines on a crane lift is to:", options: ["Measure the weight of the load","Secure the load to the crane hook","Control the swing of the load and keep workers clear of it","Signal the crane operator to lower the load"], correct: 2, explanation: "Tag lines allow ground workers to control the orientation and swing of a suspended load without standing in its fall zone or touching it directly. Workers must never use their hands to control a load." },
          { q: "When directing a crane, signals used by the signaller should be:", options: ["Always verbal over radio — no hand signals permitted","Standardized hand signals agreed upon by all parties before the lift","Based solely on the operator's personal preference","Improvised based on the specific lift requirements"], correct: 1, explanation: "Standardized hand signals must be agreed upon by the operator and signaller (banksman) before the lift begins. Only one designated signaller gives signals to the operator at a time to prevent confusion." },
          { q: "'Two-blocking' in crane operations refers to:", options: ["Using two cranes on a single lift","Blocking the swing radius on two sides with barriers","The load block travelling up until it contacts the boom tip, risking catastrophic failure","Using two sets of brakes simultaneously"], correct: 2, explanation: "Two-blocking occurs when the lower block (hook) travels up and contacts the upper block (boom head), causing the wire rope to snap or the hook assembly to fail. Modern cranes have anti-two-block devices to prevent this." },
          { q: "A crane load should not be left suspended unattended when:", options: ["It is below 2 m from the ground","Workers are in the area or could travel under the load","The load weighs less than 500 kg","The operator is on a regulated rest break"], correct: 1, explanation: "Suspended loads are a struck-by hazard. Workers must never work under or pass under a suspended load. If a load must be left suspended, the area must be barricaded and workers kept out." },
          { q: "The role of a spotter when construction equipment operates near overhead power lines is to:", options: ["Document the equipment's proximity to the lines","Disconnect power to the lines before work begins","Watch the clearance distance and guide the operator to maintain safe clearance","Measure the exact distance every 30 minutes"], correct: 2, explanation: "The spotter watches the equipment's closest point to the power line and communicates clearance to the operator. The operator cannot accurately judge clearance from inside the cab and needs eyes outside." },
          { q: "Which of the following is a rigging hazard that requires a sling to be removed from service?", options: ["A sling that is slightly dirty from the last use","A synthetic sling with cuts, fraying, or knotted sections","A wire rope sling that has been used for more than 1 year","A chain sling used at low temperatures"], correct: 1, explanation: "Cuts, fraying, and knotting reduce a sling's rated capacity significantly. Damaged slings must be removed from service immediately — a sling failure during a lift can be fatal to workers below." },
          { q: "What must be done before excavating in a location where underground utilities may be present?", options: ["Post a warning sign and proceed carefully","Contact Alberta One-Call to locate and mark utilities","Hire a professional engineer to oversee the work","Use only hand tools for the entire excavation"], correct: 1, explanation: "Alberta's Damage Prevention Act requires contacting Alberta One-Call (Utility Safety Partners) before digging. They notify utility owners who locate and mark their infrastructure, preventing potentially fatal utility strikes." },
          { q: "Under Alberta OHS Code Part 22, a crane operator must be:", options: ["Over 21 years of age","A professional engineer","A competent worker or holder of a valid certificate","Approved by a WCB safety inspector"], correct: 2, explanation: "Crane operators must be competent — having the knowledge, training, and experience to operate the crane safely. Many crane types also require a provincial operator certificate. Employing an unqualified operator is an OHS violation." },
          { q: "When is a lift plan required for crane operations in Alberta?", options: ["For all lifts regardless of weight","For critical lifts — typically over 75% of crane capacity or involving special complexity","Only when the load is over 10,000 kg","Only for tower crane operations"], correct: 1, explanation: "Critical lift plans are required for lifts that exceed a threshold of crane capacity (typically 75–85%), involve multiple cranes, require workers in the path of the load, or involve particularly complex rigging arrangements." },
          { q: "The maximum side pull angle for a crane is typically:", options: ["0° — no side pulling is permitted without engineering approval","5° with supervisor approval","10° at reduced capacity","15% of rated capacity"], correct: 0, explanation: "Cranes are designed for vertical lifts. Side pulling creates lateral forces the crane is not designed to handle and can destabilize the machine. No side pulling is permitted without specific engineering approval." },
          { q: "Utility locating in Alberta before excavation must be completed by contacting:", options: ["The municipal public works office","Alberta One-Call (Utility Safety Partners)","The prime contractor's insurance company","The provincial government directly"], correct: 1, explanation: "Alberta One-Call (operating under Utility Safety Partners) is the single point of contact in Alberta for utility locating. Contacting them before digging is a legal requirement under the Damage Prevention Act." }
        ]
      },

        learn: `<div class="reading-section"><h3>📝 Exam Bank 10 — Working Alone, Ergonomics &amp; Safety Programs</h3><p>20 multiple-choice questions covering working alone procedures, check-in systems, MSDs, ergonomic controls, safety programs, workplace violence, heat/cold stress, noise, and safety culture. Switch to the <strong>Quiz Cards</strong> tab to begin.</p></div>`,
        refs: [
          { icon: "📘", title: "OHS Code Part 28", desc: "Working Alone" },
          { icon: "📗", title: "OHS Code Part 27", desc: "Violence" },
          { icon: "📙", title: "NCSO Textbook — Safety Management", desc: "Safety programs, committees, and culture" }
        ],
        quiz: [
          { q: "Under Alberta OHS legislation, a 'working alone' situation requires the employer to:", options: ["Prohibit solo work entirely","Conduct a hazard assessment and implement a check-in procedure","Assign a buddy to all solo workers at all times","File a notice with OHS before every solo shift"], correct: 1, explanation: "Employers must conduct a hazard assessment for work-alone situations and establish a check-in system to ensure the worker's well-being. The frequency of check-ins is based on the risk level of the work." },
          { q: "Check-in intervals for a worker working alone should be based on:", options: ["A fixed 4-hour schedule for all situations","The hazard assessment and the nature of the work","An hourly schedule for all conditions","Only at the start and end of the shift"], correct: 1, explanation: "Check-in frequency must reflect the risk. High-risk work alone (confined space prep, height work, remote locations) requires more frequent check-ins than low-risk administrative work. The hazard assessment determines the appropriate interval." },
          { q: "A musculoskeletal disorder (MSD) is defined as:", options: ["An injury caused by chemical exposure to the skin","An illness caused by extreme temperature exposure","An injury to muscles, tendons, joints, or nerves caused by ergonomic hazards","A respiratory condition from dust inhalation"], correct: 2, explanation: "MSDs (also called work-related musculoskeletal disorders or WMSDs) affect soft tissues. They include conditions like tendinitis, carpal tunnel syndrome, and back injuries. They are often caused by repetition, force, awkward postures, and vibration." },
          { q: "Which of the following is an effective ergonomic control for manual material handling?", options: ["Requiring workers to lift faster to reduce total time","Providing mechanical lifting assists such as forklifts and hand trucks","Requiring heavier PPE to support the back","Increasing box weight to reduce the number of trips"], correct: 1, explanation: "Mechanical assists (hoists, forklifts, pallet jacks, hand trucks) reduce or eliminate the manual lifting task — an engineering control in the hierarchy. They are more effective than administrative controls like training alone." },
          { q: "In Alberta, a written safety program is required when an employer has:", options: ["5 or more workers","10 or more workers","20 or more workers","50 or more workers"], correct: 1, explanation: "Under the Alberta OHS Act, employers with 10 or more workers are required to have a written occupational health and safety program. Smaller employers must still conduct hazard assessments and comply with all OHS requirements." },
          { q: "The primary purpose of a workplace health and safety program is:", options: ["To protect the employer from legal liability","To systematically prevent workplace injuries and illnesses","To satisfy WCB premium requirements","To document past incidents for insurance purposes"], correct: 1, explanation: "A safety program's primary purpose is prevention. It systematically identifies hazards, implements controls, provides training, and continuously improves safety performance. Legal protection and WCB benefits are secondary outcomes." },
          { q: "Under Alberta OHS legislation, 'workplace violence' is defined as:", options: ["Physical assault only","Any threat, physical assault, or aggressive behaviour that creates a risk of injury to a worker","Verbal disputes between coworkers","Intentional property damage"], correct: 1, explanation: "Violence includes threats (verbal, written, electronic), physical assault, and aggressive behaviour. It can come from members of the public, clients, co-workers, or supervisors. Employers must have a violence prevention program." },
          { q: "An employer's violence prevention program must include:", options: ["A list of employees who have made threats","A risk assessment and reporting/investigation procedures","Mandatory anger management for all employees","Security guards at all entrances"], correct: 1, explanation: "The program must include: a hazard assessment for violence, procedures for reporting and investigating incidents, measures to control the hazard, and worker education. Simply hiring security is insufficient." },
          { q: "The Alberta OHS Code Part governing violence in the workplace is:", options: ["Part 2 (Hazard Assessment)","Part 15 (LOTO)","Part 27 (Violence)","Part 32 (Excavating)"], correct: 2, explanation: "OHS Code Part 27 specifically addresses violence in the workplace — requirements for hazard assessment, violence prevention plans, and worker education for employers in industries with elevated violence risk." },
          { q: "Heat stroke differs from heat exhaustion in that heat stroke involves:", options: ["Excessive sweating and dizziness","Muscle cramps from electrolyte loss","Confusion, hot/dry skin, and possible loss of consciousness — a life-threatening emergency","Mild headache and fatigue"], correct: 2, explanation: "Heat stroke is a medical emergency: the body's cooling mechanism has failed. Key signs are hot, dry skin (or heavy sweating), confusion, and potential unconsciousness. Heat exhaustion involves heavy sweating and dizziness but consciousness is maintained." },
          { q: "Cold stress prevention measures for outdoor workers in winter include:", options: ["Scheduling work during the hottest part of the day","Prohibiting all outdoor work below -20°C","Providing warming shelters and layered clothing appropriate to the conditions","Requiring workers to do vigorous exercise every 30 minutes"], correct: 2, explanation: "Cold stress prevention includes: layered clothing systems (wick, insulate, protect), warming shelters for regular breaks, buddy systems to watch for symptoms of hypothermia and frostbite, and acclimatization for new workers." },
          { q: "The 8-hour noise exposure limit in Alberta is:", options: ["80 dBA","85 dBA","90 dBA","95 dBA"], correct: 1, explanation: "Alberta OHS Code sets the 8-hour TWA noise limit at 85 dBA. Above this level, employers must implement a hearing conservation program including noise monitoring, engineering controls, administrative controls, and hearing protection." },
          { q: "Every 3 dB increase in noise level has what effect on allowable exposure time?", options: ["Increases allowable exposure by 50%","Has no effect on exposure time limits","Doubles the sound energy, halving the allowable exposure time","Triples the hearing protection requirement"], correct: 2, explanation: "The equal energy principle: every 3 dB increase doubles the sound energy reaching the ear. Because the damage is based on energy, each 3 dB increase halves the allowable exposure time to maintain the same dose." },
          { q: "A safety orientation for new workers arriving on a construction site must cover:", options: ["The employer's financial performance targets","The worker's prior injury history","Hazards specific to the site, emergency procedures, and safe work practices","The history of the company and its safety certifications"], correct: 2, explanation: "Site-specific orientation must address: the specific hazards workers will encounter, emergency evacuation routes, muster points, first aid locations, and safe work procedures. Generic orientations that miss site-specific hazards are insufficient." },
          { q: "Workplace inspections should be conducted:", options: ["Only after an incident occurs","Regularly at a frequency based on risk, and must be documented","Only by government OHS officers","Only when requested by workers or the JWSHSC"], correct: 1, explanation: "Regular workplace inspections are a proactive safety activity. Frequency is based on the risk level of operations. Inspections must be documented, findings corrected, and results communicated to workers." },
          { q: "A safety incentive program that rewards workers for low injury rates can be problematic because:", options: ["It costs the employer money with no safety benefit","It improves safety culture only in low-risk industries","It may discourage injury reporting, masking the true injury rate","It is prohibited under Alberta OHS legislation"], correct: 2, explanation: "Rate-based incentive programs (rewards for zero injuries) have been shown to reduce reporting rather than reduce injuries. Workers may not report injuries to preserve the group's incentive. Leading indicator programs (hazard reports, training) are more effective." },
          { q: "What is 'duty to accommodate' under Alberta human rights law?", options: ["Providing any accommodation a worker requests regardless of cost","Accommodating a worker's disability or protected ground to the point of undue hardship","Hiring only fully able-bodied workers for safety-sensitive positions","Providing unlimited paid leave for all medical conditions"], correct: 1, explanation: "The duty to accommodate requires employers to adjust work duties, schedules, or environments to allow a worker with a disability or other protected characteristic to perform their job — up to the point where it causes undue hardship." },
          { q: "When repetitive strain injury prevention programs are implemented, they should focus on:", options: ["Eliminating all manual tasks through automation","Engineering controls, job rotation, proper technique, and workstation design","Only on workers who have already reported symptoms","Providing anti-inflammatory medication in first aid kits"], correct: 1, explanation: "MSD prevention programs use the hierarchy of controls: engineering (adjust tools/workstations), administrative (rotation, rest breaks, proper technique training), and PPE (anti-vibration gloves). Waiting for symptoms before acting is reactive, not preventive." },
          { q: "The hierarchy of controls is applied to hazards in order to:", options: ["Prioritize the most cost-effective controls first","Prioritize the most protective controls and apply them before less effective ones","Determine the appropriate level of PPE required","Satisfy the minimum requirements of OHS auditors"], correct: 1, explanation: "The hierarchy prioritizes effectiveness: eliminate first, then substitute, engineer, administrate, and finally use PPE. The goal is always to apply the most protective feasible control — not the cheapest or easiest." },
          { q: "A safety culture is best described as:", options: ["The number of incident-free days posted on the safety board","The shared values, beliefs, and behaviors that determine how safety is prioritized in an organization","The safety manager's qualifications and experience","The score achieved on the last OHS audit"], correct: 1, explanation: "Safety culture is the 'way things are done around here' regarding safety. It includes leadership commitment, worker involvement, open communication about hazards, and learning from incidents. It cannot be measured simply by a day-count board." }
        ]
      }
    ];

    // ── RENDER ────────────────────────────────────────────────────────────
    function renderModules() {
      const grid = document.getElementById('moduleGrid');
      grid.innerHTML = modules.map((m, i) => `
        <div class="module-card" style="--module-color:${m.color}" onclick="openModule(${i})">
          <div class="module-num">MODULE ${String(i+1).padStart(2,'0')} · ${m.time}</div>
          <div class="module-title">${m.title}</div>
          <div class="module-meta">${m.sub}</div>
        </div>
      `).join('');
    }

    function openModule(idx) {
      const m = modules[idx];
      document.getElementById('sessionTitle').textContent = m.title;
      document.getElementById('sessionSubtitle').textContent = `Module ${m.id} · ${m.sub}`;
      document.getElementById('tabLearn').innerHTML = m.learn;
      if (m.isExam) {
        currentExamModuleIdx = idx;
        renderExam(m.quiz);
      } else {
        renderQuiz(m.quiz);
      }
      renderRefs(m.refs);
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
      document.getElementById('tabLearn').style.display = '';
      document.getElementById('tabQuiz').style.display = 'none';
      document.getElementById('tabRefs').style.display = 'none';
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('sessionView').classList.add('visible');
      resetTimer();
      window.scrollTo(0,0);
    }

    function goHome() {
      document.getElementById('sessionView').classList.remove('visible');
      document.getElementById('homeView').style.display = '';
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tabLearn').style.display = tab === 'learn' ? '' : 'none';
      document.getElementById('tabQuiz').style.display = tab === 'quiz' ? '' : 'none';
      document.getElementById('tabRefs').style.display = tab === 'refs' ? '' : 'none';
    }

    let revealedCount = 0;

    function renderQuiz(quiz) {
      revealedCount = 0;
      const total = quiz.length;
      document.getElementById('tabQuiz').innerHTML = `
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <div class="progress-text" id="progressText">0 / ${total} revealed</div>
        </div>
        <div class="cards-grid">${quiz.map((card,i) => `
          <div class="flip-card" id="card${i}" onclick="flipCard(${i},${total})">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="q-badge ${card.badge}">QUESTION ${i+1}</div>
                <div class="flip-question">${card.q}</div>
                <div class="flip-hint">tap to reveal answer →</div>
              </div>
              <div class="flip-back">
                <div class="flip-back-label">ANSWER</div>
                <div class="flip-answer">${card.a.replace(/\n/g,'<br>')}</div>
              </div>
            </div>
          </div>
        `).join('')}</div>
        <button class="btn btn-ghost btn-sm" style="display:block;margin:20px auto 0" onclick="resetCards(${total})">↺ Reset Cards</button>
      `;
    }

    function flipCard(idx, total) {
      const card = document.getElementById('card' + idx);
      if (!card.classList.contains('flipped')) {
        card.classList.add('flipped');
        revealedCount++;
        const pct = (revealedCount / total) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = revealedCount + ' / ' + total + ' revealed';
      }
    }

    function resetCards(total) {
      revealedCount = 0;
      document.querySelectorAll('.flip-card').forEach(c => c.classList.remove('flipped'));
      if (document.getElementById('progressFill')) {
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('progressText').textContent = '0 / ' + total + ' revealed';
      }
    }

    function renderRefs(refs) {
      document.getElementById('tabRefs').innerHTML = refs.map(r => `
        <div class="ref-block">
          <div class="ref-icon">${r.icon}</div>
          <div class="ref-text"><strong>${r.title}</strong>${r.desc}</div>
        </div>
      `).join('');
    }

    // ── PRACTICE EXAM ─────────────────────────────────────────────────────
    let examAnswers = {};
    let examSubmitted = false;
    let currentExamModuleIdx = 0;

    function renderExam(questions) {
      examAnswers = {}; examSubmitted = false;
      document.getElementById('tabQuiz').innerHTML = `
        <div id="examContainer">
          <div style="margin-bottom:20px;font-size:0.88rem;color:var(--muted);">Select the best answer for each question. Submit when done to see your score.</div>
          ${questions.map((q,i) => `
            <div class="mc-question" id="mcq${i}">
              <div class="mc-q-num">Question ${i+1} of ${questions.length}</div>
              <div class="mc-q-text">${q.q}</div>
              <div class="mc-options">
                ${q.options.map((opt,j) => `
                  <div class="mc-option" id="opt${i}_${j}" onclick="selectOption(${i},${j},${q.correct})">
                    <span style="font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);min-width:16px">${'ABCD'[j]})</span>
                    ${opt}
                  </div>
                `).join('')}
              </div>
              <div class="mc-explanation" id="exp${i}">${q.explanation}</div>
            </div>
          `).join('')}
          <button class="btn btn-primary" style="margin:8px auto 0;display:block;" onclick="submitExam(${questions.length})">Submit Exam</button>
        </div>
      `;
    }

    function selectOption(qIdx, optIdx, correct) {
      if (examSubmitted) return;
      examAnswers[qIdx] = optIdx;
      const opts = document.querySelectorAll(`[id^="opt${qIdx}_"]`);
      opts.forEach(o => o.classList.remove('selected-correct','selected-wrong'));
      const sel = document.getElementById(`opt${qIdx}_${optIdx}`);
      sel.classList.add(optIdx === correct ? 'selected-correct' : 'selected-wrong');
    }

    function submitExam(total) {
      examSubmitted = true;
      let score = 0;
      const questions = modules[currentExamModuleIdx].quiz;
      questions.forEach((q, i) => {
        const chosen = examAnswers[i];
        const opts = document.querySelectorAll(`[id^="opt${i}_"]`);
        opts.forEach(o => o.classList.add('locked'));
        document.getElementById(`opt${i}_${q.correct}`).classList.add('reveal-correct');
        if (chosen === q.correct) score++;
        else if (chosen !== undefined) document.getElementById(`opt${i}_${chosen}`).classList.add('selected-wrong');
        const mcq = document.getElementById(`mcq${i}`);
        mcq.classList.add(chosen === q.correct ? 'correct' : 'incorrect');
        document.getElementById(`exp${i}`).classList.add('show');
      });
      const pct = Math.round((score/total)*100);
      const grade = pct >= 80 ? '✅ Pass' : '❌ Needs Review';
      const container = document.getElementById('examContainer');
      container.insertAdjacentHTML('afterbegin', `
        <div class="exam-score">
          <h2>Exam Complete</h2>
          <div class="score-num">${score} / ${total}</div>
          <div class="score-label">${pct}% — ${grade}</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:16px;" onclick="retakeExam()">↺ Retake Exam</button>
        </div>
      `);
      window.scrollTo(0,0);
    }

    function retakeExam() {
      renderExam(modules[currentExamModuleIdx].quiz);
    }

    renderModules();
  </script>
</body>
</html>
