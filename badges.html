  mission:'🎯 Missions', wellbeing:'💛 Wellbeing', faith:'✝️ Faith',
  recovery:'💜 Recovery', ncso:'🦺 Safety Certification'
};
const CAT_ORDER = ['life','nature','learning','kitchen','clean','creative','community','adventure','mission','wellbeing','faith','recovery','ncso'];
const USERS = {
  oliver:{ emoji:'🧒', label:'Oliver', color:'#3b82f6', bg:'linear-gradient(135deg,#dbeafe,#bfdbfe)' },
  logan:{ emoji:'🌱', label:'Logan', color:'#f59e0b', bg:'linear-gradient(135deg,#fef3c7,#fde68a)' },
  mom:{ emoji:'👩', label:'Mom', color:'#a855f7', bg:'linear-gradient(135deg,#f3e8ff,#e9d5ff)' }
};

let currentUser = localStorage.getItem('sf_badges_user') || 'oliver';
let userData = { oliver: loadEarned('oliver'), logan: loadEarned('logan'), mom: loadEarned('mom') };

function loadEarned(u) { try { return JSON.parse(localStorage.getItem('sf_badges_'+u)||'[]'); } catch(e) { return []; } }
function saveEarned(u) { try { localStorage.setItem('sf_badges_'+u, JSON.stringify(userData[u])); } catch(e) {} }
function isEarned(id) { return userData[currentUser].includes(id); }
function isEarnedBy(id, u) { return userData[u].includes(id); }

let activeFilter = 'all';
let modalBadge = null;

function switchUser(u) {
  currentUser = u;
  localStorage.setItem('sf_badges_user', u);
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+u).classList.add('active');
  updateStats(); renderBadges();
  if (modalBadge) refreshEarnBtn();
}

function updateStats() {
  const n = userData[currentUser].length;
  const pctVal = Math.round(n/106*100);
  document.getElementById('earnedCount').textContent = n;
  document.getElementById('pct').textContent = pctVal+'%';
  document.getElementById('pctLabel').textContent = n+' / 106';
  document.getElementById('progressFill').style.width = pctVal+'%';
  document.getElementById('progressName').textContent = USERS[currentUser].label+'\'s Progress';
  const catDone = CAT_ORDER.filter(cat => BADGES.filter(b=>b.cat===cat).every(b=>isEarned(b.id))).length;
  document.getElementById('catCount').textContent = catDone;
  ['oliver','logan','mom'].forEach(u => {
    document.getElementById('count-'+u).textContent = userData[u].length+' / 106';
  });
}

function renderBadges() {
  const section = document.getElementById('badgeSection');
  const cats = activeFilter === 'all' ? CAT_ORDER : [activeFilter];
  section.innerHTML = cats.map(cat => {
    const badges = BADGES.filter(b => b.cat === cat);
    return '<div class="cat-group"><div class="cat-heading">'+CAT_LABELS[cat]+'</div><div class="badge-grid">'+
      badges.map(b => {
        const cur = isEarned(b.id);
        const oliv = isEarnedBy(b.id,'oliver');
        const log  = isEarnedBy(b.id,'logan');
        const mom  = isEarnedBy(b.id,'mom');
        let pips = '';
        if (oliv) pips += '<div class="earned-pip pip-oliver">🧒</div>';
        if (log)  pips += '<div class="earned-pip pip-logan">🌱</div>';
        if (mom)  pips += '<div class="earned-pip pip-mom">👩</div>';
        const inds = (oliv||log) ? '<div class="earned-indicators">'+pips+'</div>' : '';
        return '<div class="badge-card '+(cur?'earned':'locked')+'" onclick="openModal(\''+b.id+'\')">' +
          '<div class="badge-circle bc-'+b.cat+'">'+b.icon+inds+'</div>' +
          '<div class="badge-name">'+b.name+'</div></div>';
      }).join('')+'</div></div>';
  }).join('');
}

function openModal(id) {
  modalBadge = BADGES.find(b => b.id === id);
  if (!modalBadge) return;
  const b = modalBadge;
  document.getElementById('mCircle').className = 'modal-badge-circle bc-'+b.cat;
  document.getElementById('mCircle').textContent = b.icon;
  document.getElementById('mTitle').textContent = b.name;
  document.getElementById('mCat').textContent = CAT_LABELS[b.cat];
  document.getElementById('mGoal').textContent = b.goal;
  document.getElementById('mSteps').innerHTML = b.steps.map((s,i)=>'<li><span class="step-num">'+(i+1)+'</span> '+s+'</li>').join('');
  document.getElementById('mHints').innerHTML = '<div class="modal-section-title">💡 Helpful Hints</div>'+b.hints.map(h=>'<div class="hint-item">• '+h+'</div>').join('');
  document.getElementById('mBonus').innerHTML = '<div class="modal-section-title">📸 Bonus Challenge</div><div class="bonus-text">'+b.bonus+'</div>';
  refreshEarnBtn();
  document.getElementById('modal').classList.remove('hidden');
}

function refreshEarnBtn() {
  if (!modalBadge) return;
  const b = modalBadge;
  const oliv = isEarnedBy(b.id,'oliver');
  const log  = isEarnedBy(b.id,'logan');
  const momE = isEarnedBy(b.id,'mom');
  document.getElementById('mEarnedStatus').innerHTML =
    '<div class="earned-tag '+(oliv?'yes-oliver':'no')+'">🧒 Oliver '+(oliv?'✓':'–')+'</div>'+
    '<div class="earned-tag '+(log?'yes-logan':'no')+'">🌱 Logan '+(log?'✓':'–')+'</div>'+
    '<div class="earned-tag '+(momE?'yes-mom':'no')+'">👩 Mom '+(momE?'✓':'–')+'</div>';
  const earned = isEarned(b.id);
  const btn = document.getElementById('earnBtn');
  btn.className = 'earn-btn '+currentUser+'-active '+(earned?'is-earned':'not-earned');
  btn.textContent = earned
    ? '✓ '+USERS[currentUser].label+' earned this — tap to undo'
    : '🏅 Mark as Earned for '+USERS[currentUser].label+'!';
}

function toggleEarn() {
  if (!modalBadge) return;
  const id = modalBadge.id;
  if (isEarned(id)) {
    userData[currentUser] = userData[currentUser].filter(x=>x!==id);
    toast('Removed for '+USERS[currentUser].label+'.');
  } else {
    userData[currentUser].push(id);
    try {
      const log = JSON.parse(localStorage.getItem('sf_activity_log') || '[]');
      log.push({ type: 'badge', icon: modalBadge.icon, title: modalBadge.name, person: USERS[currentUser].label, pts: 0, date: new Date().toISOString().slice(0, 10) });
      localStorage.setItem('sf_activity_log', JSON.stringify(log));
    } catch(e) {}
    celebrate();
    toast('🎉 '+USERS[currentUser].label+' earned: '+modalBadge.name+'!');
  }
  saveEarned(currentUser); updateStats(); renderBadges(); refreshEarnBtn();
}

function hideModal() { document.getElementById('modal').classList.add('hidden'); modalBadge = null; }
function closeModal(e) { if (e.target===document.getElementById('modal')) hideModal(); }

function celebrate() {
  const wrap = document.getElementById('confettiWrap');
  const cols = ['#ff6b9d','#ffa94d','#ffd43b','#69db7c','#4dabf7','#cc5de8','#f06878'];
  for (let i=0;i<60;i++) {
    const el = document.createElement('div'); el.className='confetto';
    el.style.cssText='left:'+Math.random()*100+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';width:'+(6+Math.random()*10)+'px;height:'+(6+Math.random()*10)+'px;animation-delay:'+Math.random()*.5+'s;animation-duration:'+(1.4+Math.random()*.8)+'s';
    wrap.appendChild(el); setTimeout(()=>el.remove(),2400);
  }
}

function toast(msg) {
  const area = document.getElementById('toastArea');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  area.appendChild(el); setTimeout(()=>el.remove(),3200);
}

document.getElementById('catTabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  activeFilter = tab.dataset.cat;
  renderBadges();
});

document.addEventListener('DOMContentLoaded', function() { updateStats(); renderBadges(); });
if (document.readyState !== 'loading') { updateStats(); renderBadges(); }
</script>
</body>
</html>
