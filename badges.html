<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summer Badges | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f2933; --muted: #667085; --line: #d8dee6;
  --paper: #fffdf6; --panel: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(160deg, #fff8e1 0%, #e8f4fd 50%, #f3e8ff 100%);
  min-height: 100vh; color: var(--ink);
}

/* ── Header ── */
.site-header {
  background: linear-gradient(135deg, #ff6b9d, #ffa94d, #ffd43b, #69db7c, #4dabf7, #cc5de8);
  background-size: 300% 300%;
  animation: rainbow 8s ease infinite;
  padding: 28px 24px 20px; text-align: center; position: relative;
}
@keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
.site-header h1 {
  font-family: 'Baloo 2', cursive; font-size: clamp(2rem,5vw,3rem);
  color: white; text-shadow: 0 3px 0 rgba(0,0,0,0.18); letter-spacing: 1px;
}
.site-header p { color: rgba(255,255,255,0.92); font-size: 1.05rem; margin-top: 4px; font-weight: 700; }
.back-link {
  position: absolute; left: 20px; top: 22px;
  background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5);
  color: white; text-decoration: none; font-weight: 800; font-size: 0.9rem;
  padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(6px); transition: background 0.2s;
}
.back-link:hover { background: rgba(255,255,255,0.4); }

/* ── Stats ── */
.stats-bar {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  padding: 20px 24px; background: white; border-bottom: 2px solid var(--line);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.stat-pill {
  display: flex; align-items: center; gap: 8px; background: #f8f9fe;
  border: 2px solid var(--line); border-radius: 50px; padding: 8px 18px;
  font-weight: 800; font-size: 0.95rem;
}
.stat-pill .num { font-size: 1.3rem; color: #4b9ef8; }
.stat-pill .label { color: var(--muted); font-size: 0.82rem; font-weight: 700; }

.progress-wrap { padding: 16px 24px 8px; max-width: 700px; margin: 0 auto; }
.progress-label { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.88rem; color: var(--muted); margin-bottom: 6px; }
.progress-bar { height: 16px; background: #e8edf2; border-radius: 50px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #4dabf7, #cc5de8); border-radius: 50px; transition: width 0.6s cubic-bezier(.34,1.56,.64,1); }

/* ── Tabs ── */
.cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 20px 24px 12px; max-width: 1200px; margin: 0 auto; }
.cat-tab {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: 50px; border: 2.5px solid transparent; background: white;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.88rem;
  cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.cat-tab:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
.cat-tab.active { color: white; }
.cat-tab[data-cat="all"].active      { background: linear-gradient(135deg,#667eea,#764ba2); }
.cat-tab[data-cat="life"].active     { background: linear-gradient(135deg,#f5a623,#f7dc6f); color: #7a4f00; }
.cat-tab[data-cat="nature"].active   { background: linear-gradient(135deg,#56ab2f,#a8e063); }
.cat-tab[data-cat="learning"].active { background: linear-gradient(135deg,#4b9ef8,#7ed3f7); }
.cat-tab[data-cat="kitchen"].active  { background: linear-gradient(135deg,#ef4444,#f97316); }
.cat-tab[data-cat="clean"].active    { background: linear-gradient(135deg,#14b8a6,#6ee7b7); }
.cat-tab[data-cat="creative"].active { background: linear-gradient(135deg,#f06878,#fda085); }
.cat-tab[data-cat="community"].active{ background: linear-gradient(135deg,#a855f7,#d8b4fe); }
.cat-tab[data-cat="adventure"].active{ background: linear-gradient(135deg,#dc2626,#9f1239); }

/* ── Badge grid ── */
.badge-section { padding: 8px 24px 60px; max-width: 1200px; margin: 0 auto; }
.cat-heading { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; margin: 24px 0 14px; display: flex; align-items: center; gap: 10px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 16px; }

.badge-card { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.2s; }
.badge-card:hover { transform: scale(1.08) rotate(-1deg); }
.badge-card.locked .badge-circle { filter: grayscale(80%) brightness(0.65); }
.badge-card.locked { opacity: 0.6; }

.badge-circle {
  width: 96px; height: 96px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.3rem; position: relative;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  border: 4px solid rgba(255,255,255,0.6); transition: box-shadow 0.2s;
}
.badge-card:hover .badge-circle { box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.badge-circle::after { content:''; position:absolute; inset:4px; border-radius:50%; border:3px solid rgba(255,255,255,0.35); pointer-events:none; }
.earned-star {
  position: absolute; bottom:-4px; right:-4px; background:#ffd43b; color:#7a4f00;
  font-size: 1rem; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }

.badge-name { font-weight: 800; font-size: 0.75rem; text-align: center; line-height: 1.2; color: var(--ink); max-width: 108px; }
.badge-card.locked .badge-name { color: var(--muted); }

.bc-life      { background: linear-gradient(135deg,#f5a623,#f7dc6f); }
.bc-nature    { background: linear-gradient(135deg,#56ab2f,#a8e063); }
.bc-learning  { background: linear-gradient(135deg,#4b9ef8,#7ed3f7); }
.bc-kitchen   { background: linear-gradient(135deg,#ef4444,#f97316); }
.bc-clean     { background: linear-gradient(135deg,#14b8a6,#6ee7b7); }
.bc-creative  { background: linear-gradient(135deg,#f06878,#fda085); }
.bc-community { background: linear-gradient(135deg,#a855f7,#d8b4fe); }
.bc-adventure { background: linear-gradient(135deg,#dc2626,#9f1239); }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px); animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-backdrop.hidden { display: none; }

.modal-box {
  background: white; border-radius: 24px; max-width: 500px; width: 100%;
  padding: 28px 28px 24px; box-shadow: 0 24px 80px rgba(0,0,0,0.25);
  animation: slideUp 0.25s cubic-bezier(.34,1.56,.64,1);
  position: relative; max-height: 90vh; overflow-y: auto;
}
@keyframes slideUp { from{transform:translateY(40px) scale(0.95);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }

.modal-close {
  position: sticky; float: right; top: 0; right: 0;
  background: #f1f5f9; border: none; width: 34px; height: 34px;
  border-radius: 50%; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  margin-left: auto; margin-bottom: 8px;
}
.modal-close:hover { background: #e2e8f0; }

.modal-badge-circle {
  width: 80px; height: 80px; border-radius: 50%; font-size: 2.2rem;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; border: 4px solid rgba(255,255,255,0.6);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
.modal-title { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 3px; }
.modal-cat-tag { text-align: center; font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }

.modal-goal {
  background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 12px;
  padding: 10px 14px; font-size: 0.9rem; font-weight: 700; color: #166534;
  margin-bottom: 14px; display: flex; gap: 8px; align-items: flex-start;
}
.goal-icon { font-size: 1rem; flex-shrink: 0; }

.modal-section-title { font-weight: 900; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.modal-steps { list-style: none; display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.modal-steps li { display: flex; gap: 9px; align-items: flex-start; font-size: 0.88rem; line-height: 1.4; color: #374151; }
.step-num {
  background: #4b9ef8; color: white; font-weight: 900; font-size: 0.72rem;
  min-width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}

.modal-hints {
  background: #fefce8; border: 1.5px solid #fde68a; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 12px;
}
.modal-hints .modal-section-title { color: #92400e; margin-bottom: 6px; }
.hint-item { font-size: 0.86rem; color: #78350f; display: flex; gap: 6px; margin-bottom: 3px; }

.modal-bonus {
  background: #fdf4ff; border: 1.5px solid #e9d5ff; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 16px;
}
.modal-bonus .modal-section-title { color: #7e22ce; margin-bottom: 4px; }
.bonus-text { font-size: 0.87rem; color: #6b21a8; font-weight: 700; }

.earn-btn {
  width: 100%; padding: 13px; border-radius: 50px; border: none;
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem;
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.earn-btn.not-earned { background: linear-gradient(135deg,#667eea,#764ba2); color: white; box-shadow: 0 4px 20px rgba(102,126,234,0.4); }
.earn-btn.not-earned:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(102,126,234,0.5); }
.earn-btn.is-earned { background: #f1f5f9; color: var(--muted); }
.earn-btn.is-earned:hover { background: #fee2e2; color: #dc2626; }

/* ── Confetti + Toast ── */
.confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
.confetto { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
.toast-area { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast { background: #1a202c; color: white; padding: 12px 24px; border-radius: 50px; font-weight: 800; font-size: 0.95rem; box-shadow: 0 8px 30px rgba(0,0,0,0.25); animation: toastIn 0.3s cubic-bezier(.34,1.56,.64,1); }
@keyframes toastIn { from{transform:translateY(20px) scale(0.9);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-link">← Home</a>
  <h1>🏅 Summer Badge Hunt</h1>
  <p>Earn all 80 badges before summer ends!</p>
</header>

<div class="stats-bar">
  <div class="stat-pill"><span class="num" id="earnedCount">0</span><span class="label">Badges Earned</span></div>
  <div class="stat-pill"><span class="num">80</span><span class="label">Total Badges</span></div>
  <div class="stat-pill"><span class="num" id="catCount">0</span><span class="label">Categories Done</span></div>
  <div class="stat-pill"><span class="num" id="pct">0%</span><span class="label">Complete</span></div>
</div>

<div class="progress-wrap">
  <div class="progress-label"><span>Summer Progress</span><span id="pctLabel">0 / 80</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="cat-tabs" id="catTabs">
  <button class="cat-tab active" data-cat="all">🌟 All</button>
  <button class="cat-tab" data-cat="life">🏠 Life Skills</button>
  <button class="cat-tab" data-cat="nature">🌿 Nature</button>
  <button class="cat-tab" data-cat="learning">🧠 Learning</button>
  <button class="cat-tab" data-cat="kitchen">🧑‍🍳 Kitchen</button>
  <button class="cat-tab" data-cat="clean">🧹 Clean &amp; Tidy</button>
  <button class="cat-tab" data-cat="creative">🎨 Creativity</button>
  <button class="cat-tab" data-cat="community">👫 Community</button>
  <button class="cat-tab" data-cat="adventure">⚔️ Adventure</button>
</div>

<div class="badge-section" id="badgeSection"></div>

<div class="modal-backdrop hidden" id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="hideModal()">✕</button>
    <div class="modal-badge-circle" id="mCircle"></div>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-cat-tag" id="mCat"></div>
    <div class="modal-goal"><span class="goal-icon">🎯</span><span id="mGoal"></span></div>
    <div class="modal-section-title">📋 What You\'ll Do</div>
    <ul class="modal-steps" id="mSteps"></ul>
    <div class="modal-hints" id="mHints"></div>
    <div class="modal-bonus" id="mBonus"></div>
    <button class="earn-btn" id="earnBtn" onclick="toggleEarn()"></button>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>
<div class="toast-area" id="toastArea"></div>

<script>
const BADGES = [
  // ── LIFE SKILLS & CHORES ──
  {id:'l1', cat:'life', icon:'🧺', name:'Laundry Legend',
   goal:'Learn how to sort, wash, dry, and fold your clothes.',
   steps:['Sort your laundry — separate darks, lights, and towels into different piles.',
          'Start the washing machine — add clothes and detergent, ask for help with settings, then press start!',
          'Move to the dryer — when the washer is done, transfer clothes to the dryer or drying rack.',
          'Fold everything — match socks, fold shirts and pants neatly, and stack towels.',
          'Put it all away — carry clothes to the right drawers or shelves.'],
   hints:['Do it with a grown-up the first time.','Use a checklist if it helps — it\'s okay to ask for help!'],
   bonus:'Take a photo of your neatly folded clothes or sorted laundry baskets!'},

  {id:'l2', cat:'life', icon:'🍽️', name:'Dish Duty Champ',
   goal:'Wash up after a meal all by yourself.',
   steps:['Clear the table — carry dishes to the sink carefully, one load at a time.',
          'Rinse first — rinse each dish with warm water to remove food bits.',
          'Wash with soap — scrub each dish, cup, and utensil with a soapy sponge.',
          'Rinse again — rinse off all the soap under running water.',
          'Dry and put away — dry with a clean towel or leave to air-dry, then return everything to its place.'],
   hints:['Be careful with sharp knives — ask a grown-up to handle those.','Hot water gets things cleaner!'],
   bonus:'Leave the kitchen sparkling — wipe down the counter too!'},

  {id:'l3', cat:'life', icon:'🛏️', name:'Room Rescuer',
   goal:'Tidy your bedroom from messy to clean, all on your own.',
   steps:['Pick up the floor — gather everything and sort: put away, rubbish, or donate.',
          'Make the bed — straighten the sheets, fluff the pillow, and pull up the blanket neatly.',
          'Clear flat surfaces — tidy your desk, windowsill, and shelves.',
          'Organize one drawer — re-fold or re-stack anything messy inside.',
          'Do a final check — walk around the room. Is anything still out of place?'],
   hints:['Put on music to make it more fun!','Set a timer — see how fast you can do it.'],
   bonus:'Spray the room with a light room spray and declare it officially done!'},

  {id:'l4', cat:'life', icon:'📦', name:'Organizing Hero',
   goal:'Organize one area of your home — a drawer, shelf, or cupboard.',
   steps:['Choose your spot — pick one area that really needs organizing.',
          'Empty it out — take everything out and lay it where you can see it all.',
          'Sort into groups — group similar things together.',
          'Decide what stays — remove anything broken, old, or no longer needed.',
          'Put it back neatly — replace items in a logical order and label if you can!'],
   hints:['Use small containers or boxes to keep groups together.','Start small — even one drawer counts!'],
   bonus:'Take a before-and-after photo!'},

  {id:'l5', cat:'life', icon:'🌱', name:'Plant Parent',
   goal:'Care for a plant every day for a full week without being reminded.',
   steps:['Learn about your plant — find out how often it needs water and whether it likes sun or shade.',
          'Set up a schedule — decide which days you\'ll water it and write it down.',
          'Water correctly — check the soil first; not too much, not too little.',
          'Find the right spot — move it to where it gets the right amount of light.',
          'Check in daily — look at the leaves, track any changes, and keep a little log.'],
   hints:['Stick your finger 1cm into the soil — if it\'s dry, time to water!','Over-watering is the #1 plant killer.'],
   bonus:'Take a daily photo and make a mini growth diary.'},

  {id:'l6', cat:'life', icon:'🐾', name:'Pet Pal',
   goal:'Take responsibility for a pet\'s care for one full day.',
   steps:['Feed on time — give your pet fresh food and water at the right time.',
          'Clean up — scoop litter, clean a cage, or pick up the yard.',
          'Exercise and play — spend at least 15 minutes playing with or exercising your pet.',
          'Health check — look at eyes, fur, and behaviour. Does anything seem different?',
          'Give love — spend calm, quiet time with your pet — petting, talking, or just sitting nearby.'],
   hints:['Ask a grown-up about your pet\'s routine before you start.','Animals rely on routine — consistency matters!'],
   bonus:'Draw or photograph your pet and write 3 facts about their species.'},

  {id:'l7', cat:'life', icon:'♻️', name:'Recycling Ranger',
   goal:'Sort a household recycling collection correctly.',
   steps:['Learn the rules — find out what goes in each bin (paper, plastic, glass, compost).',
          'Set up the sorting area — make sure all bins are in the right place.',
          'Sort a collection — go through a bag of mixed items and sort everything correctly.',
          'Check labels — read the recycling symbols on plastic items.',
          'Take it out — when full, take the recycling to the outdoor bin or collection point.'],
   hints:['When in doubt, it goes in regular rubbish rather than contaminating recycling.','Not sure? Look it up or ask!'],
   bonus:'Research one thing that happens to recycled plastic after it leaves your bin.'},

  {id:'l8', cat:'life', icon:'💰', name:'Money Minder',
   goal:'Learn the basics of saving and spending money wisely.',
   steps:['Count your money — find all your coins and bills and add them up.',
          'Set a saving goal — choose something to save for and write down the price.',
          'Make a plan — figure out how long it will take if you put some away each week.',
          'Track your spending — over 3 days, write down everything you spend money on.',
          'Review your choices — look at your spending. What would you do differently?'],
   hints:['Split money into 3 jars: Save, Spend, Give.','Even saving a little each week adds up fast!'],
   bonus:'Open a real savings account or start a labeled money jar with your goal written on it.'},

  {id:'l9', cat:'life', icon:'🍴', name:'Cooking Assistant',
   goal:'Help cook a full meal from start to finish.',
   steps:['Plan the meal — read the recipe together and understand every step.',
          'Get ready — wash your hands and set out all ingredients and tools.',
          'Measure and prep — measure ingredients, wash vegetables, and do safe prep tasks.',
          'Cook together — stir, pour, and help at the stove with supervision.',
          'Plate and serve — dish up the food and help bring it to the table.'],
   hints:['Ask before touching any sharp tools.','Keep your workspace tidy as you go — chefs call this "mise en place"!'],
   bonus:'Write the recipe in your own words so you can make it again.'},

  {id:'l10', cat:'life', icon:'🛒', name:'Grocery Helper',
   goal:'Help with grocery shopping and learn where food comes from.',
   steps:['Write the list — check what\'s low in the fridge and pantry.',
          'Organize the list — sort items by section to make shopping faster.',
          'Find items at the store — help locate each item on the list.',
          'Check prices — compare two similar products and figure out which is better value.',
          'Help pack and unpack — pack bags at checkout and put groceries away at home.'],
   hints:['Look at produce labels — your food might have travelled thousands of kilometres!','Organized lists save time and money.'],
   bonus:'Pick one fruit or vegetable you\'ve never tried before and taste it.'},

  // ── NATURE & OUTDOORS ──
  {id:'n1', cat:'nature', icon:'🐛', name:'Bug Spotter',
   goal:'Find and identify at least 5 different insects or bugs.',
   steps:['Get prepared — grab a notebook, pencil, and magnifying glass if you have one.',
          'Choose your spot — a garden, park, or patch of grass works perfectly.',
          'Look in the right places — check under rocks, leaves, near flowers, and logs.',
          'Observe without disturbing — how many legs? Wings? Antennae? Look closely!',
          'Record your finds — draw or describe each bug and try to identify it by name.'],
   hints:['Go in the morning when bugs are most active.','Be gentle — bugs are living creatures!'],
   bonus:'Look up one surprising fact about your favourite bug you found.'},

  {id:'n2', cat:'nature', icon:'🐦', name:'Bird Watcher',
   goal:'Sit quietly outside and spot at least 5 different birds.',
   steps:['Set up your spot — find a quiet place near trees, water, or a bird feeder.',
          'Be still and patient — sit quietly for at least 10 minutes without moving around.',
          'Watch and listen — notice colours, beak shapes, sizes, and sounds.',
          'Record what you see — draw or describe each bird in your notebook.',
          'Try to identify them — look them up in a bird book or app.'],
   hints:['Early morning is the best time for birds!','Wear quiet, non-bright clothing so you don\'t scare them.'],
   bonus:'Set up a simple bird feeder and watch who visits over a few days.'},

  {id:'n3', cat:'nature', icon:'🌳', name:'Tree Identifier',
   goal:'Identify at least 5 different types of trees.',
   steps:['Walk your area — stroll around a park, street, or your yard.',
          'Look at the whole tree — notice shape, height, and bark texture.',
          'Study the leaves — collect one fallen leaf from each tree and examine it closely.',
          'Look for fruit or seeds — acorns? Pine cones? Berries? These help with identification.',
          'Name them — use a tree guide or app to figure out what each tree is.'],
   hints:['Pressing paper over bark creates a cool rubbing you can keep!','Leaves are the easiest identification clue.'],
   bonus:'Find the oldest or tallest tree in your area and research its history.'},

  {id:'n4', cat:'nature', icon:'✏️', name:'Nature Sketcher',
   goal:'Go outside and draw 5 things from nature from careful observation.',
   steps:['Gather your tools — sketchbook or paper, pencil, and optional coloured pencils.',
          'Choose a spot — sit somewhere comfortable with interesting things to look at.',
          'Look before you draw — spend 30 seconds really studying your subject first.',
          'Draw slowly — focus on shape, texture, and shadows. Don\'t worry about perfection!',
          'Add details and labels — write what you drew and where you found it.'],
   hints:['Draw what you actually SEE, not what you think something looks like.','Every line is good practice!'],
   bonus:'Combine all your sketches into a mini nature field guide.'},

  {id:'n5', cat:'nature', icon:'🌻', name:'Garden Grower',
   goal:'Plant something and care for it until it sprouts or blooms.',
   steps:['Choose what to grow — seeds, bulbs, or seedlings all count!',
          'Prepare your pot or patch — fill with soil and make sure it drains well.',
          'Plant correctly — follow the depth and spacing instructions on the seed packet.',
          'Water and watch — keep it moist and in the right amount of light.',
          'Track its progress — check daily and write or draw what you notice each day.'],
   hints:['Tomatoes, sunflowers, and radishes grow quickly — great for beginners!','Read the label before planting.'],
   bonus:'Grow enough to pick and eat something you grew yourself.'},

  {id:'n6', cat:'nature', icon:'⭐', name:'Stargazer',
   goal:'Go outside at night and identify at least 3 constellations.',
   steps:['Plan your night — check for a clear forecast and let your eyes adjust for 10 minutes.',
          'Learn 3 constellations — look up Orion, the Big Dipper, and one other before going out.',
          'Find them in the sky — scan slowly and match the star patterns.',
          'Sketch what you see — draw the stars you can spot and connect the ones you recognize.',
          'Look for planets or the moon — note what else is visible. Planets don\'t twinkle!'],
   hints:['Get away from bright lights if you can.','Full eye adjustment takes 10–15 minutes in the dark.'],
   bonus:'Stay out and watch for a shooting star or satellite passing overhead.'},

  {id:'n7', cat:'nature', icon:'☁️', name:'Cloud Tracker',
   goal:'Go outside and identify at least 4 different types of clouds.',
   steps:['Learn the cloud types — look up cumulus, stratus, cirrus, and cumulonimbus first.',
          'Pick a watching spot — find somewhere open with a good view of the sky.',
          'Observe and sketch — sketch or photograph the clouds you can see.',
          'Identify each one — use a cloud chart to name what you\'re looking at.',
          'Predict the weather — guess what\'s coming based on what you see, then check back later!'],
   hints:['Fluffy = cumulus, flat and grey = stratus, wispy and high = cirrus.','Storm clouds are cumulonimbus!'],
   bonus:'Keep a cloud diary for 3 days and see if your weather predictions come true.'},

  {id:'n8', cat:'nature', icon:'🥾', name:'Trail Trekker',
   goal:'Complete a hike or nature walk of at least 30 minutes.',
   steps:['Plan the route — choose a trail or walk and check how long it is.',
          'Pack your bag — water, snack, sunscreen, and comfortable shoes.',
          'Walk the full route — don\'t skip ahead! Walk at a steady pace and stay on the trail.',
          'Observe along the way — notice plants, animals, sounds, and smells. Collect nothing!',
          'Record highlights — when you get back, write or draw 3 things you noticed.'],
   hints:['Tell someone where you\'re going.','Never leave the trail. Leave no trace!'],
   bonus:'Photograph one thing that genuinely surprised you on the trail.'},

  {id:'n9', cat:'nature', icon:'🌦️', name:'Weather Watcher',
   goal:'Observe and record the weather every day for 5 days.',
   steps:['Set up your weather log — create a table: date, temperature, cloud cover, wind, rain.',
          'Check each morning — go outside and observe before looking at a forecast.',
          'Record your findings — fill in the log after each observation.',
          'Compare to the forecast — look at what was predicted vs. what actually happened.',
          'Spot patterns — after 5 days, what patterns can you see in your data?'],
   hints:['Use a thermometer if you have one!','"Warm / cool / cold" is perfectly fine without one.'],
   bonus:'Build a simple rain gauge from a plastic bottle and measure actual rainfall.'},

  {id:'n10', cat:'nature', icon:'🪨', name:'Nature Collector',
   goal:'Collect 10 safe, non-living nature items and create a display.',
   steps:['Know the rules — only collect non-living items: rocks, feathers, shells, pine cones.',
          'Go on a collecting walk — bring a bag and look carefully as you go.',
          'Clean your finds — rinse off dirt gently and let everything dry.',
          'Arrange a display — lay them out on a tray, in a box, or on paper.',
          'Label each item — write the name, where you found it, and one interesting fact.'],
   hints:['Never take living things — leave plants rooted and animals undisturbed.','Feathers are fine; eggs and nests are not.'],
   bonus:'Create a mini museum card for your favourite find with a drawing and description.'},

  // ── LEARNING & CURIOSITY ──
  {id:'lr1', cat:'learning', icon:'📚', name:'Library Explorer',
   goal:'Visit a library and find 3 books on a topic you\'ve never read about before.',
   steps:['Plan your visit — think of a topic you\'re curious about.',
          'Find the section — ask a librarian to help you find the right area.',
          'Browse and choose — flip through several books and pick 3 that look interesting.',
          'Read at least one — spend at least 20 minutes reading at the library or check them out.',
          'Share what you learned — tell someone one surprising thing you discovered.'],
   hints:['Don\'t just read — look at maps, diagrams, and photos too!','Librarians love helping curious kids.'],
   bonus:'Write a recommendation note for one of the books and leave it inside for the next reader.'},

  {id:'lr2', cat:'learning', icon:'📖', name:'Bookworm Badge',
   goal:'Read 3 books this summer (fiction, non-fiction, or graphic novels all count).',
   steps:['Choose your books — pick 3 that genuinely interest you. Mix it up!',
          'Set a reading schedule — decide when each day you\'ll read. Even 20 minutes counts.',
          'Read each book fully — don\'t skip the ending! Take your time.',
          'Keep a reading log — write the title, author, and one sentence about each book.',
          'Recommend one — tell a friend or family member which book they should read next.'],
   hints:['Reading before bed is a great habit — it helps you sleep!','Audiobooks count too.'],
   bonus:'Give each book a star rating and write a 2-sentence mini review.'},

  {id:'lr3', cat:'learning', icon:'🏺', name:'History Hunter',
   goal:'Research a historical event or person and create a mini report or poster.',
   steps:['Choose a topic — pick something that genuinely interests you.',
          'Find 3 sources — use books, a library, or trusted websites.',
          'Take notes — write key facts, dates, names, and 3 things that surprised you.',
          'Make your report or poster — organize notes into headings. Add drawings or diagrams.',
          'Present it — share your report with at least one person and explain what you found.'],
   hints:['Ask "why" questions — why did it happen? What changed because of it? That\'s real history thinking!','Check more than one source.'],
   bonus:'Find out if any of this history connects to your own family or hometown.'},

  {id:'lr4', cat:'learning', icon:'🔬', name:'Science Sleuth',
   goal:'Choose a science question and design a simple experiment to answer it.',
   steps:['Ask a question — pick something you want to test. "Does ice melt faster in the sun?"',
          'Make a prediction — write down what you THINK will happen and why.',
          'Design the test — list what you\'ll need and exactly what you\'ll do.',
          'Run the experiment — carry out your test and record your results honestly.',
          'Draw a conclusion — did the results match your prediction? What did you learn?'],
   hints:['A good experiment changes only ONE variable — everything else stays the same!','"Fair test" is the key phrase.'],
   bonus:'Write up your experiment like a real scientist and share your findings.'},

  {id:'lr5', cat:'learning', icon:'🌍', name:'Geography Guru',
   goal:'Learn the locations and capitals of 10 countries you didn\'t know before.',
   steps:['Pick your countries — choose 10 that interest you, spread across different continents.',
          'Find them on a map — locate each one on a world map or globe.',
          'Learn the capitals — find out the capital city of each country.',
          'Learn one fact per country — a flag detail, famous landmark, language, or food.',
          'Test yourself — cover your notes and try to recall all 10 from memory.'],
   hints:['Use flashcards — flag on one side, capital on the back.','Geography games online can help!'],
   bonus:'Plan an imaginary trip visiting all 10 countries and map your route.'},

  {id:'lr6', cat:'learning', icon:'💡', name:'Junior Researcher',
   goal:'Research a topic in depth and teach it to someone else.',
   steps:['Pick your topic — choose something specific, like "how dolphins communicate."',
          'Use multiple sources — find at least 3 different sources of information.',
          'Organise your notes — sort into: facts, how it works, why it matters.',
          'Prepare to teach — write 5 key points you want to share. Use visuals if you can.',
          'Teach someone — present your topic to a real person and answer their questions.'],
   hints:['The best test of understanding is whether you can explain it clearly to someone else!','Simple words, clear examples.'],
   bonus:'Make a short quiz about your topic and see how much the person remembers afterwards.'},

  {id:'lr7', cat:'learning', icon:'🧩', name:'Puzzle Pro',
   goal:'Complete a challenging puzzle or brain teaser.',
   steps:['Choose your challenge — a jigsaw (500+ pieces), sudoku, crossword, or logic puzzle.',
          'Plan your approach — edges first? By colour? By theme? Decide before you start.',
          'Work through it — don\'t give up when it gets tricky! Take breaks and come back.',
          'Track your time — how long did the whole thing take?',
          'Reflect on your strategy — what worked? What would you do differently next time?'],
   hints:['If you\'re stuck, step away and come back with fresh eyes.','Persistence is the most important skill here!'],
   bonus:'Create your own puzzle or brain teaser for someone else to solve.'},

  {id:'lr8', cat:'learning', icon:'🔢', name:'Math Master',
   goal:'Complete a set of 20 maths problems with accuracy.',
   steps:['Choose your level — fractions, multiplication, geometry, or word problems.',
          'Write or find 20 problems — create your own or find a practice sheet.',
          'Work without rushing — focus on accuracy first, then speed.',
          'Check your answers — go back and check each one. Correct any mistakes.',
          'Track your score — how many right? Set a goal to improve next time.'],
   hints:['Show your working — it\'s much easier to find mistakes that way.','Maths is about practice, not talent!'],
   bonus:'Create a maths problem with a surprising or tricky answer and stump a grown-up.'},

  {id:'lr9', cat:'learning', icon:'🗣️', name:'Language Learner',
   goal:'Learn 20 words or phrases in a language you don\'t speak.',
   steps:['Pick your language — choose one you\'re curious about or connected to your family.',
          'Learn the basics first — numbers, colours, greetings, and common words.',
          'Make flashcards — English on one side, the new language on the other.',
          'Practice daily — spend 10 minutes a day for at least 3 days.',
          'Use it — try using 5 of your new words in a real conversation or sentence.'],
   hints:['Apps like Duolingo make it fun and gamified.','Watching a show in another language helps your ear tune in!'],
   bonus:'Record yourself saying all 20 words and compare to a native speaker.'},

  {id:'lr10', cat:'learning', icon:'💻', name:'Digital Detective',
   goal:'Use the internet safely to research a topic and evaluate your sources.',
   steps:['Choose your question — pick something you genuinely want to know more about.',
          'Search safely — use a safe search engine and stick to trusted websites.',
          'Find 3 different websites — don\'t just use the first result.',
          'Check if it\'s trustworthy — who wrote it? Is it up to date? Is it a reliable source?',
          'Summarize what you found — write 5 bullet points in your own words.'],
   hints:['If two reliable sources agree, it\'s probably true.','If they disagree, dig deeper!'],
   bonus:'Find one claim online that turned out to be wrong or misleading — how did you figure it out?'},

  // ── KITCHEN & FOOD ──
  {id:'k1', cat:'kitchen', icon:'🥪', name:'Sandwich Star',
   goal:'Make a complete, creative sandwich from scratch.',
   steps:['Plan your sandwich — think about flavour combinations. Sweet? Savoury? Both?',
          'Prepare your ingredients — wash any veg, slice toppings carefully.',
          'Build in layers — start with the bread and add fillings in a thoughtful order.',
          'Cut and plate it — cut into a fun shape and arrange nicely on a plate.',
          'Serve and share — make one for yourself AND one for someone else.'],
   hints:['Think about texture — crunchy + soft + creamy makes the best sandwiches!','Toast the bread for extra points.'],
   bonus:'Name your sandwich creation and write the recipe on a card.'},

  {id:'k2', cat:'kitchen', icon:'🍳', name:'Breakfast Boss',
   goal:'Make a complete breakfast for yourself from scratch.',
   steps:['Choose your menu — decide on at least 2 components (e.g. eggs + toast + fruit).',
          'Check you have everything — look in the fridge and cupboard first.',
          'Cook safely — follow safety rules at the stove. Ask for supervision if needed.',
          'Plate it attractively — arrange the food nicely — colour and presentation count!',
          'Clean as you go — wipe surfaces, rinse equipment, leave the kitchen tidy.'],
   hints:['Eggs can be scrambled, fried, or boiled — all great for beginners!','Plan something you can do mostly independently.'],
   bonus:'Set the table properly with a napkin and juice before serving.'},

  {id:'k3', cat:'kitchen', icon:'🍎', name:'Snack Stylist',
   goal:'Invent and make an original snack using at least 5 ingredients.',
   steps:['Brainstorm your snack — what flavours and textures do you enjoy together?',
          'Write down your recipe — list ingredients and steps before starting.',
          'Prepare all ingredients — wash, cut, and measure everything first.',
          'Assemble your snack — put it together according to your plan.',
          'Present and taste test — serve it nicely and rate it honestly out of 10.'],
   hints:['Sweet + salty is a classic winning combination.','Don\'t be afraid to experiment!'],
   bonus:'Get someone to taste test it without knowing the ingredients — can they guess?'},

  {id:'k4', cat:'kitchen', icon:'🥦', name:'Healthy Eater',
   goal:'Eat at least one fruit AND one vegetable every day for 5 days.',
   steps:['Set up your tracker — make a chart with 5 days and 2 columns: fruit and vegetable.',
          'Plan ahead — look at what\'s in the house and choose one for each day.',
          'Eat mindfully — notice the taste, texture, and colour of each one.',
          'Try something new — include at least one fruit or veg you\'ve never tried before.',
          'Complete your chart — fill it in each day. Can you go 5 for 5?'],
   hints:['Frozen fruit and veg count too!','Smoothies are a great way to sneak in extra goodness.'],
   bonus:'Find out where one of your vegetables was grown before it reached your plate.'},

  {id:'k5', cat:'kitchen', icon:'🦺', name:'Food Safety Scout',
   goal:'Learn and demonstrate 5 food safety rules.',
   steps:['Learn the rules — hand washing, safe temperatures, keeping raw meat separate, use-by dates, clean surfaces.',
          'Write them out — put the 5 rules in your own words from memory.',
          'Apply them — next time food is prepared, actively follow all 5 rules.',
          'Check the fridge — is anything past its use-by date? Is anything stored incorrectly?',
          'Teach one rule — explain one food safety rule to a family member.'],
   hints:['The danger zone for bacteria is 5°C–60°C — food shouldn\'t stay there long!','When in doubt, throw it out.'],
   bonus:'Create a food safety poster for your kitchen.'},

  {id:'k6', cat:'kitchen', icon:'🍽️', name:'Dish Designer',
   goal:'Present a simple meal beautifully, like a restaurant dish.',
   steps:['Plan the plate — sketch how you want the food arranged before you start.',
          'Think about colour — use at least 3 colours on the plate.',
          'Think about height — stack or lean things to create levels.',
          'Add a garnish — a sprig of herbs, a slice of lemon, or a sauce swirl makes it special.',
          'Photograph it — take a photo before anyone eats!'],
   hints:['Odd numbers (3 or 5 elements) look better on a plate than even numbers.','Chefs call this "plating"!'],
   bonus:'Recreate a dish from a restaurant, plating it as beautifully as the original.'},

  {id:'k7', cat:'kitchen', icon:'🧁', name:'Bake-Off Beginner',
   goal:'Bake something from a recipe, following every step exactly.',
   steps:['Choose your recipe — muffins, cookies, banana bread, or brownies are great starts.',
          'Read the whole recipe first — never skip this step! Understand it before beginning.',
          'Measure carefully — use proper measuring cups and spoons. Baking is a science!',
          'Follow every step — don\'t skip or improvise. Follow exactly this time.',
          'Taste and reflect — how did it turn out? What would you do differently next time?'],
   hints:['Always preheat your oven before starting to bake.','Measure everything before you begin — mise en place!'],
   bonus:'Decorate your bake beautifully and give some to a neighbour or friend.'},

  {id:'k8', cat:'kitchen', icon:'🥤', name:'Smoothie Maker',
   goal:'Create 3 different smoothie recipes and rate each one.',
   steps:['Gather ingredients — fruit, liquid (milk, juice, water), and optional extras (yogurt, oats).',
          'Make Smoothie 1 — blend, taste, and rate it out of 10. Note what you\'d change.',
          'Make Smoothie 2 — try a completely different flavour combination.',
          'Make Smoothie 3 — use what you\'ve learned to make your best version yet.',
          'Write your favourite recipe — record it so you can make it again.'],
   hints:['Freeze your fruit beforehand for a thicker, colder smoothie.','Banana adds creaminess without dairy!'],
   bonus:'Give your best smoothie a name and design a label for the glass.'},

  {id:'k9', cat:'kitchen', icon:'📏', name:'Measuring Maestro',
   goal:'Practice measuring ingredients accurately for 3 different recipes.',
   steps:['Learn the measures — cups, tablespoons, teaspoons, and grams.',
          'Choose 3 recipes — find 3 recipes that require measuring (not just "a handful").',
          'Measure each ingredient — use proper measuring tools. Level off dry ingredients with a knife.',
          'Compare methods — try measuring by cup AND by weight for one ingredient.',
          'Record your accuracy — ask an adult to check your measurements before you cook.'],
   hints:['For flour: spoon it into the cup rather than scooping — scooping packs it down!','Precise measuring = better results.'],
   bonus:'Convert a recipe from cups to grams using a conversion chart.'},

  {id:'k10', cat:'kitchen', icon:'📝', name:'Recipe Recorder',
   goal:'Write your own original recipe from scratch and cook it.',
   steps:['Invent your dish — think of something you\'d like to eat that you\'ve never had before.',
          'List your ingredients — write every ingredient with the exact amount.',
          'Write the steps — describe each step clearly enough that a stranger could follow it.',
          'Cook it — follow YOUR own recipe exactly. No improvising!',
          'Evaluate and edit — rate it and rewrite any steps that weren\'t clear.'],
   hints:['Good recipes describe HOW as well as WHAT — "stir gently" not just "stir."','Read it back as if you\'ve never cooked before.'],
   bonus:'Illustrate your recipe card with drawings of each step.'},

  // ── CLEAN & TIDY ──
  {id:'c1', cat:'clean', icon:'🧹', name:'Sweeping Star',
   goal:'Sweep a floor completely clean.',
   steps:['Clear the area — move furniture, shoes, and objects off the floor first.',
          'Start at the edges — sweep corners and edges first, working toward the middle.',
          'Collect the pile — guide all the debris into one tidy pile.',
          'Dustpan it — use a dustpan and brush to scoop it all up cleanly.',
          'Empty and rinse — empty the dustpan into the bin and wipe it clean.'],
   hints:['Sweep in ONE direction — back and forth just scatters the dust again!','Work from the furthest corner toward the door.'],
   bonus:'Mop the floor afterwards for a truly sparkling finish.'},

  {id:'c2', cat:'clean', icon:'🚿', name:'Bathroom Boss',
   goal:'Clean the bathroom completely from top to bottom.',
   steps:['Gather supplies — scrubbing brush, cloth, cleaning spray, and gloves if available.',
          'Wipe the sink and tap — spray and wipe. Don\'t forget the tap handles!',
          'Scrub the toilet — clean the outside first, then inside the bowl. Flush when done.',
          'Wipe the mirror — use a damp cloth or glass cleaner for a streak-free shine.',
          'Wipe surfaces and mop the floor — do bench tops first, then the floor last.'],
   hints:['Always clean from top to bottom — dirt falls down!','Wear gloves for the toilet.'],
   bonus:'Refill the soap dispenser and replace any empty toilet rolls too.'},

  {id:'c3', cat:'clean', icon:'👟', name:'Shoe Organizer',
   goal:'Organize and clean all the shoes in your home.',
   steps:['Collect all the shoes — gather every pair from everywhere in the house.',
          'Sort by person — make a pile for each family member.',
          'Clean them — wipe or brush off dirt from each pair.',
          'Match and pair — make sure every shoe has its partner.',
          'Put them away neatly — return them to their proper place.'],
   hints:['Stuffing newspaper inside wet shoes dries them out overnight!','Group by person or by type — whatever makes sense for your home.'],
   bonus:'Find any shoes that no longer fit and set them aside for donation.'},

  {id:'c4', cat:'clean', icon:'🛏️', name:'Bed Maker',
   goal:'Make your bed neatly every morning for 5 days in a row.',
   steps:['Start with the fitted sheet — make sure the corners are tucked tightly.',
          'Straighten the top sheet — pull it flat and tuck under the mattress at the bottom.',
          'Fluff the pillow — shake and straighten it. Place at the head of the bed.',
          'Pull up the duvet or blanket — smooth it out evenly. No lumps!',
          'Add finishing touches — arrange any decorative pillows or stuffed animals neatly.'],
   hints:['A made bed makes your whole room look cleaner instantly!','It takes less than 3 minutes once you\'re good at it.'],
   bonus:'Make someone else\'s bed as a surprise.'},

  {id:'c5', cat:'clean', icon:'🗑️', name:'Trash Tracker',
   goal:'Empty all the bins in your home and take rubbish to the outdoor bin.',
   steps:['Count the bins — find every bin in the house (kitchen, bathrooms, bedrooms).',
          'Empty each one — take the bag or contents out carefully without spilling.',
          'Replace the liner — put a new bin bag in every bin you emptied.',
          'Take it outside — carry the bags to the outdoor rubbish bin.',
          'Wash your hands — always wash up after handling rubbish!'],
   hints:['Do this before the council collection day so nothing is missed.','Bags that are too full are hard to lift and can tear!'],
   bonus:'Rinse out any recycling bins that have become smelly.'},

  {id:'c6', cat:'clean', icon:'🧦', name:'Sock Matcher',
   goal:'Sort and match a full basket of laundry socks.',
   steps:['Tip them out — pour all the socks into a pile on a clean surface.',
          'Sort by colour — make rough colour groups first to speed things up.',
          'Find the matches — match each sock to its pair.',
          'Fold or roll — fold matched pairs together neatly.',
          'Sort by owner — put each person\'s socks in a separate pile.'],
   hints:['Turn all socks the right way out first.','Missing a match? Set it aside — the other one often appears in the next wash!'],
   bonus:'Match an entire laundry load, not just the socks.'},

  {id:'c7', cat:'clean', icon:'👗', name:'Closet Commander',
   goal:'Organize your wardrobe or clothing storage neatly.',
   steps:['Take everything out — empty your wardrobe completely.',
          'Sort into categories — keep, donate, rubbish. Be honest about what you actually wear!',
          'Group what stays — sort by type: tops, bottoms, dresses, jumpers.',
          'Hang or fold properly — hang items that wrinkle; fold knitwear and jeans.',
          'Put it back neatly — arrange by category and by colour if you like!'],
   hints:['If you haven\'t worn something in 6 months, you probably don\'t need it.','A clear-out feels amazing!'],
   bonus:'Create a simple outfit planner for the next 5 days using what you own.'},

  {id:'c8', cat:'clean', icon:'🧸', name:'Toy Tamer',
   goal:'Tidy all your toys and games back to their correct places.',
   steps:['Collect everything — gather all toys from all rooms, including under the bed!',
          'Sort by type — board games together, Lego together, stuffed animals together.',
          'Find their homes — every toy needs a place where it belongs.',
          'Check for completeness — are any games missing pieces? Set those aside.',
          'Return and organize — place everything back in its correct spot, neatly.'],
   hints:['Use labeled boxes or baskets to make it easy to find things and put them back.','One system that everyone knows works best.'],
   bonus:'Find toys you no longer play with and put them in a donation bag.'},

  {id:'c9', cat:'clean', icon:'🌀', name:'Vacuum Virtuoso',
   goal:'Vacuum the floors in at least 3 rooms.',
   steps:['Prepare the room — pick up everything off the floor so you can vacuum freely.',
          'Learn the vacuum — ask how to operate it properly before beginning.',
          'Vacuum in rows — go back and forth in overlapping rows, like mowing a lawn.',
          'Get the edges — use the attachment to vacuum along the edges and in corners.',
          'Empty the bin — check and empty the dustbin or replace the bag when done.'],
   hints:['Go slowly — rushing means missing dirt.','Pay extra attention to high-traffic areas!'],
   bonus:'Vacuum the furniture cushions too — crumbs hide there!'},

  {id:'c10', cat:'clean', icon:'🧽', name:'Wipe-Down Wonder',
   goal:'Wipe down all surfaces in the kitchen and living areas.',
   steps:['Get your cloth and spray — use an appropriate cleaning spray and a clean cloth.',
          'Start high, go low — begin with high surfaces (shelves, bench tops) and work down.',
          'Wipe in sections — work your way around the room systematically.',
          'Hit handles and buttons — light switches, door handles, and remotes need wiping too!',
          'Rinse or replace the cloth — a dirty cloth just spreads dirt around.'],
   hints:['Microfibre cloths work best — they pick up dust without pushing it around.','Change or rinse your cloth between rooms.'],
   bonus:'Clean the inside of the microwave too — run a damp cloth around after microwaving a cup of water.'},

  // ── CREATIVITY & EXPRESSION ──
  {id:'cr1', cat:'creative', icon:'🎨', name:'Crafty Creator',
   goal:'Complete a craft project from start to finish using materials you already have.',
   steps:['Decide what to make — cardboard, fabric, buttons, wool, paint — what do you have?',
          'Plan it out — sketch your idea on paper first.',
          'Gather materials — collect everything you need before starting.',
          'Make it — take your time and enjoy the process, not just the result!',
          'Display or give it away — show it off or give it as a gift.'],
   hints:['The best crafts often come from a "junk box" of toilet rolls, egg cartons, and foil!','Get creative with what you already have.'],
   bonus:'Make a second version and try to improve on your first attempt.'},

  {id:'cr2', cat:'creative', icon:'🔨', name:'DIY Maker',
   goal:'Build something useful from household materials.',
   steps:['Identify a need — what could you make that would actually be useful?',
          'Plan and design — draw your design with measurements if possible.',
          'Gather materials — cardboard, wood scraps, tape, glue — whatever you can find.',
          'Build it — assemble step by step, being patient with each part.',
          'Test it — does it work? Does it do what you designed it for?'],
   hints:['Start simple. The best designs solve one specific problem clearly.','Measure twice, cut once!'],
   bonus:'Decorate your creation and write a label explaining what it is and how you made it.'},

  {id:'cr3', cat:'creative', icon:'📔', name:'Journal Jotter',
   goal:'Write in a journal every day for 7 days.',
   steps:['Set up your journal — choose a notebook or make your own from folded paper.',
          'Write every day — even a few sentences counts! Set a time each day.',
          'Use prompts if stuck — "The best part of today was..." or "I wonder why..."',
          'Include a drawing — at least 3 entries should have a picture.',
          'Read back your entries — at the end of 7 days, read from the beginning.'],
   hints:['There\'s no wrong way to journal. No one is grading your spelling!','Be honest with yourself.'],
   bonus:'Decorate the cover of your journal to make it feel special.'},

  {id:'cr4', cat:'creative', icon:'🎬', name:'Mini Filmmaker',

const CAT_LABELS = {
  life:      '🏠 Life Skills & Chores',
  nature:    '🌿 Nature & Outdoors',
  learning:  '🧠 Learning & Curiosity',
  kitchen:   '🧑‍🍳 Kitchen & Food',
  clean:     '🧹 Clean & Tidy',
  creative:  '🎨 Creativity & Expression',
  community: '👫 Community & Friendship',
  adventure: '⚔️ Adventure & Challenges',
};
const CAT_ORDER = ['life','nature','learning','kitchen','clean','creative','community','adventure'];

let earned = (() => { try { return JSON.parse(localStorage.getItem('sf_badges') || '[]'); } catch(e) { return []; } })();
let activeFilter = 'all';
let modalBadge = null;

function save() { try { localStorage.setItem('sf_badges', JSON.stringify(earned)); } catch(e) {} }
function isEarned(id) { return earned.includes(id); }

function updateStats() {
  const n = earned.length;
  document.getElementById('earnedCount').textContent = n;
  document.getElementById('pct').textContent = Math.round(n/80*100) + '%';
  document.getElementById('pctLabel').textContent = n + ' / 80';
  document.getElementById('progressFill').style.width = (n/80*100) + '%';
  const catDone = CAT_ORDER.filter(cat => BADGES.filter(b => b.cat===cat).every(b => isEarned(b.id))).length;
  document.getElementById('catCount').textContent = catDone;
}

function renderBadges() {
  const section = document.getElementById('badgeSection');
  const cats = activeFilter === 'all' ? CAT_ORDER : [activeFilter];
  section.innerHTML = cats.map(cat => {
    const badges = BADGES.filter(b => b.cat === cat);
    return '<div class="cat-group"><div class="cat-heading">' + CAT_LABELS[cat] + '</div><div class="badge-grid">' +
      badges.map(b =>
        '<div class="badge-card ' + (isEarned(b.id)?'earned':'locked') + '" onclick="openModal(\'' + b.id + '\')">' +
        '<div class="badge-circle bc-' + b.cat + '">' + b.icon +
        (isEarned(b.id) ? '<div class="earned-star">⭐</div>' : '') +
        '</div><div class="badge-name">' + b.name + '</div></div>'
      ).join('') + '</div></div>';
  }).join('');
}

function openModal(id) {
  modalBadge = BADGES.find(b => b.id === id);
  if (!modalBadge) return;
  const b = modalBadge;
  document.getElementById('mCircle').className = 'modal-badge-circle bc-' + b.cat;
  document.getElementById('mCircle').textContent = b.icon;
  document.getElementById('mTitle').textContent = b.name;
  document.getElementById('mCat').textContent = CAT_LABELS[b.cat];
  document.getElementById('mGoal').textContent = b.goal;
  document.getElementById('mSteps').innerHTML = b.steps.map((s,i) =>
    '<li><span class="step-num">'+(i+1)+'</span> '+s+'</li>'
  ).join('');
  document.getElementById('mHints').innerHTML =
    '<div class="modal-section-title">💡 Helpful Hints</div>' +
    b.hints.map(h => '<div class="hint-item">• ' + h + '</div>').join('');
  document.getElementById('mBonus').innerHTML =
    '<div class="modal-section-title">📸 Bonus Challenge</div>' +
    '<div class="bonus-text">' + b.bonus + '</div>';
  refreshEarnBtn();
  document.getElementById('modal').classList.remove('hidden');
}

function refreshEarnBtn() {
  if (!modalBadge) return;
  const e = isEarned(modalBadge.id);
  const btn = document.getElementById('earnBtn');
  btn.className = 'earn-btn ' + (e ? 'is-earned' : 'not-earned');
  btn.textContent = e ? '✓ Earned — tap to undo' : '🏅 Mark as Earned!';
}

function toggleEarn() {
  if (!modalBadge) return;
  const id = modalBadge.id;
  if (isEarned(id)) {
    earned = earned.filter(x => x !== id);
    toast('Badge removed.');
  } else {
    earned.push(id);
    celebrate();
    toast('🎉 Badge earned: ' + modalBadge.name + '!');
  }
  save(); updateStats(); renderBadges(); refreshEarnBtn();
}

function hideModal() { document.getElementById('modal').classList.add('hidden'); modalBadge = null; }
function closeModal(e) { if (e.target === document.getElementById('modal')) hideModal(); }

function celebrate() {
  const wrap = document.getElementById('confettiWrap');
  const cols = ['#ff6b9d','#ffa94d','#ffd43b','#69db7c','#4dabf7','#cc5de8','#f06878'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetto';
    el.style.cssText = 'left:'+Math.random()*100+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>0.5?'50%':'2px')+';width:'+(6+Math.random()*10)+'px;height:'+(6+Math.random()*10)+'px;animation-delay:'+Math.random()*0.5+'s;animation-duration:'+(1.4+Math.random()*0.8)+'s';
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
}

function toast(msg) {
  const area = document.getElementById('toastArea');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  area.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

document.getElementById('catTabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeFilter = tab.dataset.cat;
  renderBadges();
});

document.addEventListener('DOMContentLoaded', function() { updateStats(); renderBadges(); });
if (document.readyState !== 'loading') { updateStats(); renderBadges(); }
</script>
