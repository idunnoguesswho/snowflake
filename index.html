<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowflake - Daily Family Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#1f2933; --muted:#667085; --line:#d8dee6; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#fff8e1 0%,#e8f4fd 50%,#f3e8ff 100%);min-height:100vh;color:var(--ink)}

.site-header{background:linear-gradient(135deg,#ff6b9d,#ffa94d,#ffd43b,#69db7c,#4dabf7,#cc5de8);background-size:300% 300%;animation:rainbow 8s ease infinite;padding:28px 20px 22px;text-align:center}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.site-title{font-family:'Baloo 2',cursive;font-size:clamp(2rem,7vw,2.8rem);color:white;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.site-title em{font-style:normal}
.site-date{color:rgba(255,255,255,.92);font-size:.95rem;margin-top:4px;font-weight:700}

.nav-wrap{max-width:780px;margin:0 auto;padding:20px 16px 50px}
.nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){ .nav-grid{grid-template-columns:repeat(3,1fr)} }

.nav-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:white;border:3px solid var(--line);border-radius:20px;padding:18px 10px;text-decoration:none;color:var(--ink);min-height:96px;box-shadow:0 4px 14px rgba(0,0,0,.05);transition:transform .15s, box-shadow .15s, border-color .15s;-webkit-tap-highlight-color:transparent}
.nav-card:active{transform:scale(.96)}
@media (hover:hover){
  .nav-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.1)}
}
.nav-icon{font-size:1.9rem;line-height:1}
.nav-label{font-weight:800;font-size:.88rem;text-align:center;line-height:1.2}

.nav-card.c-blue:hover, .nav-card.c-blue:active{border-color:#4dabf7}
.nav-card.c-pink:hover, .nav-card.c-pink:active{border-color:#ff6b9d}
.nav-card.c-amber:hover, .nav-card.c-amber:active{border-color:#f59e0b}
.nav-card.c-green:hover, .nav-card.c-green:active{border-color:#38d9a9}
.nav-card.c-purple:hover, .nav-card.c-purple:active{border-color:#a855f7}
.nav-card.c-navy:hover, .nav-card.c-navy:active{border-color:#1e3a5f}

.section-label{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.05rem;margin:22px 2px 10px;color:var(--ink)}
.section-label:first-child{margin-top:4px}

.countdown-banner{background:white;border:3px solid #ffd43b;border-radius:20px;padding:14px 20px;margin:0 auto 4px;max-width:780px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.countdown-label{font-family:'Baloo 2',cursive;font-weight:800;font-size:.95rem;color:var(--muted)}
.countdown-units{display:flex;gap:10px}
.countdown-unit{display:flex;flex-direction:column;align-items:center;min-width:44px}
.countdown-num{font-family:'Baloo 2',cursive;font-size:1.7rem;font-weight:800;color:#f59e0b;line-height:1}
.countdown-sub{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">Snowflake <em>*</em></div>
  <div class="site-date" id="header-date">Daily family hub</div>
</header>

<div class="countdown-banner" style="margin:16px 16px 0;max-width:calc(100% - 32px)">
  <div class="countdown-label">⏳ Days until<br>Aug 31</div>
  <div class="countdown-units">
    <div class="countdown-unit"><span class="countdown-num" id="cd-days">--</span><span class="countdown-sub">days</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-hours">--</span><span class="countdown-sub">hours</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-mins">--</span><span class="countdown-sub">mins</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-secs">--</span><span class="countdown-sub">secs</span></div>
  </div>
</div>

<div class="nav-wrap">

  <div class="section-label">📋 Daily</div>
  <div class="nav-grid">
    <a class="nav-card c-blue" href="dailyupdate.html"><span class="nav-icon">📅</span><span class="nav-label">Daily Update</span></a>
    <a class="nav-card c-purple" href="quotes.html"><span class="nav-icon">✨</span><span class="nav-label">Quotes</span></a>
    <a class="nav-card c-green" href="tasks.html"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></a>
  </div>

  <div class="section-label">👨‍👩‍👧‍👦 Kids</div>
  <div class="nav-grid">
    <a class="nav-card c-blue" href="oliver.html"><span class="nav-icon">🧒</span><span class="nav-label">Oliver</span></a>
    <a class="nav-card c-amber" href="logan.html"><span class="nav-icon">🌱</span><span class="nav-label">Logan</span></a>
    <a class="nav-card c-pink" href="badges.html"><span class="nav-icon">🏅</span><span class="nav-label">Badges</span></a>
    <a class="nav-card c-green" href="store.html"><span class="nav-icon">🎁</span><span class="nav-label">Store</span></a>
    <a class="nav-card c-purple" href="missions.html"><span class="nav-icon">⚡</span><span class="nav-label">Missions</span></a>
  </div>

  <div class="section-label">💼 Work & Money</div>
  <div class="nav-grid">
    <a class="nav-card c-blue" href="hustles.html"><span class="nav-icon">💼</span><span class="nav-label">Hustles</span></a>
    <a class="nav-card c-green" href="jobs.html"><span class="nav-icon">🔎</span><span class="nav-label">Jobs</span></a>
    <a class="nav-card c-amber" href="money.html"><span class="nav-icon">💰</span><span class="nav-label">Money</span></a>
    <a class="nav-card c-pink" href="menu.html"><span class="nav-icon">🍽️</span><span class="nav-label">Menu</span></a>
  </div>

  <div class="section-label">🏢 Business & Study</div>
  <div class="nav-grid">
    <a class="nav-card c-navy" href="DS/index.html"><span class="nav-icon">🖥️</span><span class="nav-label">DS Home Computing</span></a>
    <a class="nav-card c-amber" href="insulators/index.html"><span class="nav-icon">⚡</span><span class="nav-label">Insulators</span></a>
    <a class="nav-card c-pink" href="loto.html"><span class="nav-icon">🔒</span><span class="nav-label">LOTO</span></a>
    <a class="nav-card c-green" href="HSMS/index.html"><span class="nav-icon">🛡️</span><span class="nav-label">HSMS</span></a>
  </div>

</div>

<script>
  const currentDate = new Date();
  const dateOptions = { weekday: "long", month: "long", day: "numeric", year: "numeric" };
  document.getElementById("header-date").textContent = currentDate.toLocaleDateString("en-CA", dateOptions);

  function updateCountdown() {
    const now = new Date();
    const target = new Date(now.getFullYear(), 7, 31, 23, 59, 59); // Aug 31
    if (now > target) target.setFullYear(target.getFullYear() + 1);
    const diff = target - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("cd-days").textContent = d;
    document.getElementById("cd-hours").textContent = String(h).padStart(2,"0");
    document.getElementById("cd-mins").textContent = String(m).padStart(2,"0");
    document.getElementById("cd-secs").textContent = String(s).padStart(2,"0");
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
