<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowflake - Daily Family Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site-header">
  <div class="site-title">Snowflake <em>*</em></div>
  <div class="site-date" id="header-date">Daily family hub</div>
</div>

<div class="tab-bar" role="tablist" aria-label="Snowflake pages">
  <button class="tab-btn active" type="button" data-tab="dailyupdate">Daily Update</button>
  <button class="tab-btn" type="button" data-tab="quotes">Quotes</button>
  <button class="tab-btn" type="button" data-tab="tasks">Tasks</button>
  <button class="tab-btn" type="button" data-tab="oliver">🧒 Oliver</button>
  <button class="tab-btn" type="button" data-tab="logan">👦 Logan</button>
  <button class="tab-btn" type="button" data-tab="hustles">💼 Hustles</button>
  <button class="tab-btn" type="button" data-tab="jobs">Jobs</button>
  <button class="tab-btn" type="button" data-tab="money">Money</button>
  <button class="tab-btn" type="button" data-tab="menu">🍽️ Menu</button>
</div>

<div class="tab-rule"></div>

<div class="frame-wrap">
  <iframe class="tab-frame active" id="frame-dailyupdate" src="dailyupdate.html" title="Daily Update"></iframe>
  <iframe class="tab-frame" id="frame-quotes" src="quotes.html" title="Daily Quotes"></iframe>
  <iframe class="tab-frame" id="frame-tasks" src="tasks.html" title="Tasks"></iframe>
  <iframe class="tab-frame" id="frame-oliver" src="oliver.html" title="Oliver's Tasks"></iframe>
  <iframe class="tab-frame" id="frame-logan" src="logan.html" title="Logan's Tasks"></iframe>
  <iframe class="tab-frame" id="frame-hustle" src="hustles.html" title="Hustles"></iframe>
  <iframe class="tab-frame" id="frame-jobs" src="jobs.html" title="Jobs"></iframe>
  <iframe class="tab-frame" id="frame-money" src="money.html" title="Money"></iframe>
  <iframe class="tab-frame" id="frame-menu" src="menu.html" title="Weekly Menu"></iframe>
</div>

<script>
  const currentDate = new Date();
  const dateOptions = { weekday: "long", month: "long", day: "numeric", year: "numeric" };
  document.getElementById("header-date").textContent = currentDate.toLocaleDateString("en-CA", dateOptions);

  const buttons = document.querySelectorAll(".tab-btn");
  const frames = document.querySelectorAll(".tab-frame");

  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      const target = button.dataset.tab;

      buttons.forEach((item) => item.classList.toggle("active", item === button));
      frames.forEach((frame) => {
        frame.classList.toggle("active", frame.id === `frame-${target}`);
      });
    });
  });
</script>
</body>
</html>
