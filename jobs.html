<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2933;
    --muted: #667085;
    --line: #d8dee6;
    --paper: #fbfcfd;
    --panel: #ffffff;
    --blue: #2f80ed;
    --blue-dark: #1f5fb5;
    --green: #2f8f64;
    --rose: #c35465;
    --gold: #b8860b;
    --shadow: 0 14px 34px rgba(31, 41, 51, 0.10);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    background:
      linear-gradient(135deg, rgba(47, 128, 237, 0.10), transparent 32%),
      linear-gradient(315deg, rgba(47, 143, 100, 0.10), transparent 30%),
      var(--paper);
    font-family: "Nunito", system-ui, sans-serif;
  }

  button {
    border: 0;
    cursor: pointer;
    font: inherit;
  }

  .jobs-app {
    display: grid;
    gap: 18px;
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 24px;
  }

  .jobs-header,
  .chart-panel,
  .jobs-toolbar,
  .empty-state {
    background: rgba(255, 255, 255, 0.84);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .jobs-header {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    justify-content: space-between;
    padding: 22px;
  }

  .eyebrow {
    margin: 0 0 4px;
    color: var(--blue-dark);
    font-size: 0.78rem;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: "Baloo 2", cursive;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 0.95;
  }

  .header-note {
    max-width: 420px;
    margin: 0;
    color: var(--muted);
    font-weight: 800;
    text-align: right;
  }

  .chart-panel {
    display: grid;
    gap: 14px;
    padding: 18px;
  }

  .chart-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .chart-title h2 {
    margin: 0;
    font-size: 1.25rem;
    line-height: 1.2;
  }

  .chart-title p {
    margin: 4px 0 0;
    color: var(--muted);
    font-weight: 800;
  }

  .metric-buttons,
  .source-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .metric-button {
    min-height: 34px;
    padding: 7px 11px;
    color: var(--ink);
    background: #f2f5f8;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-weight: 900;
  }

  .metric-button[aria-pressed="true"] {
    color: #ffffff;
    background: var(--blue-dark);
    border-color: var(--blue-dark);
  }

  .chart-scroll {
    max-height: 460px;
    overflow: auto;
  }

  .monthly-chart {
    display: block;
    min-width: 700px;
    width: 100%;
    height: auto;
  }

  .axis-label,
  .bar-value {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 900;
  }

  .bar-value {
    fill: var(--ink);
  }

  .grid-line {
    stroke: #e8edf3;
    stroke-width: 1;
  }

  .source-legend {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 900;
  }

  .legend-item {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }

  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 999px;
  }

  .jobs-toolbar {
    display: grid;
    gap: 14px;
    padding: 16px;
  }

  .toolbar-top {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }

  .summary {
    color: var(--muted);
    font-weight: 900;
  }

  .summary strong {
    color: var(--ink);
  }

  .refresh-button {
    min-height: 40px;
    padding: 9px 14px;
    color: #ffffff;
    background: var(--green);
    border-radius: 8px;
    font-weight: 900;
  }

  .date-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .date-button {
    min-height: 38px;
    padding: 8px 12px;
    color: var(--ink);
    background: #edf4ff;
    border: 1px solid #cfe0fb;
    border-radius: 8px;
    font-weight: 900;
  }

  .date-button[aria-pressed="true"] {
    color: #ffffff;
    background: var(--blue);
    border-color: var(--blue);
  }

  .jobs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }

  .job-card {
    display: grid;
    gap: 14px;
    min-height: 100%;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 5px solid var(--blue);
    border-radius: 8px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: box-shadow 160ms ease, transform 160ms ease;
  }

  .job-card:hover {
    box-shadow: 0 18px 42px rgba(31, 41, 51, 0.14);
    transform: translateY(-1px);
  }

  .job-card:focus-visible {
    outline: 3px solid rgba(47, 128, 237, 0.32);
    outline-offset: 3px;
  }

  .job-card:nth-child(4n + 2) {
    border-left-color: var(--green);
  }

  .job-card:nth-child(4n + 3) {
    border-left-color: var(--gold);
  }

  .job-card:nth-child(4n + 4) {
    border-left-color: var(--rose);
  }

  .card-head {
    display: grid;
    gap: 6px;
  }

  .job-title {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.25;
  }

  .job-subtitle,
  .date-pill {
    color: var(--muted);
    font-weight: 800;
  }

  .date-pill {
    width: fit-content;
    padding: 5px 9px;
    background: #f2f5f8;
    border-radius: 8px;
    font-size: 0.8rem;
  }

  .toggle-hint {
    width: fit-content;
    color: var(--blue-dark);
    font-size: 0.78rem;
    font-weight: 900;
  }

  .field-list {
    display: grid;
    gap: 8px;
    margin: 0;
  }

  .field-list[hidden] {
    display: none;
  }

  .field-row {
    display: grid;
    grid-template-columns: minmax(86px, 0.34fr) minmax(0, 1fr);
    gap: 10px;
    padding-top: 8px;
    border-top: 1px solid #eef2f6;
  }

  .field-label {
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 900;
    text-transform: uppercase;
  }

  .field-value {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .field-value a {
    color: var(--blue-dark);
    font-weight: 900;
  }

  .empty-state {
    padding: 22px;
    color: var(--muted);
    font-weight: 800;
    text-align: center;
  }

  .error {
    color: #8f2637;
    background: #fff0f3;
    border-color: #ffc6d0;
  }

  @media (max-width: 720px) {
    .jobs-app {
      padding: 16px;
    }

    .jobs-header,
    .chart-top,
    .toolbar-top {
      align-items: flex-start;
      flex-direction: column;
    }

    .header-note {
      text-align: left;
    }

    .jobs-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main class="jobs-app">
  <section class="jobs-header" aria-labelledby="page-title">
    <div>
      <p class="eyebrow">Jobs tab</p>
      <h1 id="page-title">Today's Jobs</h1>
    </div>
    <p class="header-note" id="header-note">Loading current jobs from the sheet.</p>
  </section>

  <section class="chart-panel" aria-labelledby="chart-title">
    <div class="chart-top">
      <div class="chart-title">
        <p class="eyebrow">Monthly graph</p>
        <h2 id="chart-title">Source by month</h2>
        <p id="chart-note">Choose a metric to compare by source.</p>
      </div>
      <div class="metric-buttons" id="metric-buttons" aria-label="Monthly graph metric"></div>
    </div>
    <div class="chart-scroll">
      <svg class="monthly-chart" id="monthly-chart" role="img" aria-labelledby="chart-title chart-note"></svg>
    </div>
    <div class="source-legend" id="source-legend" aria-label="Source legend"></div>
  </section>

  <section class="jobs-toolbar" aria-label="Job date filters">
    <div class="toolbar-top">
      <div class="summary" id="summary">Connecting to Jobs...</div>
      <button class="refresh-button" id="refresh-button" type="button">Refresh</button>
    </div>
    <div class="date-filters" id="date-filters" aria-label="Available job dates in the past week"></div>
  </section>

  <section class="jobs-grid" id="jobs-grid" aria-live="polite"></section>
  <section class="empty-state" id="empty-state" hidden>No jobs found for this date.</section>
</main>

<script>
  const SHEET_ID = "11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY";
  const SHEET_NAME = "Jobs";
  const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}`;
  const todayKey = toDateKey(new Date());
  const preferredDateHeaders = ["logged", "date", "day", "scheduled", "start", "job date", "work date", "created", "added"];
  const titleHeaders = ["personelle", "personnel", "position", "role", "job", "job name", "title", "task", "description", "service", "scope", "project"];
  const subtitleHeaders = ["contractor", "customer", "client", "name", "company", "address", "location", "site"];
  const chartMetrics = [
    { key: "Non", labels: ["Non"] },
    { key: "NFG", labels: ["NFG"] },
    { key: "Valid", labels: ["Valid"] },
    { key: "Applied", labels: ["Applied"] },
    { key: "Callback", labels: ["Call Back", "Callback"] }
  ];
  const sourceColors = ["#2f80ed", "#2f8f64", "#b8860b", "#c35465", "#7b61ff", "#00a3a3", "#d96c2c", "#5c6670", "#9b59b6", "#1f8a70"];

  const state = {
    rows: [],
    headers: [],
    dateHeaders: [],
    selectedDate: todayKey,
    chartMetric: "Non"
  };

  const elements = {
    chart: document.getElementById("monthly-chart"),
    chartNote: document.getElementById("chart-note"),
    legend: document.getElementById("source-legend"),
    metricButtons: document.getElementById("metric-buttons"),
    filters: document.getElementById("date-filters"),
    grid: document.getElementById("jobs-grid"),
    empty: document.getElementById("empty-state"),
    summary: document.getElementById("summary"),
    headerNote: document.getElementById("header-note"),
    title: document.getElementById("page-title"),
    refresh: document.getElementById("refresh-button")
  };

  elements.refresh.addEventListener("click", loadJobs);
  loadJobs();

  async function loadJobs() {
    setLoading();

    try {
      const table = await loadSheetTable();
      if (!table?.cols?.length) throw new Error("The Jobs tab did not return any columns.");

      const normalizedHeaders = makeUniqueHeaders(table.cols.map((col, index) => (col.label || "").trim() || `Column ${index + 1}`));
      state.headers = normalizedHeaders;
      state.rows = (table.rows || [])
        .map((record, index) => toRecord(normalizedHeaders, record, index + 2))
        .filter((record) => Object.values(record.values).some(Boolean));
      state.dateHeaders = findDateHeaders(state.headers, state.rows);

      const availableDates = getPastWeekDatesWithRows();
      state.selectedDate = availableDates.includes(todayKey) ? todayKey : todayKey;
      render();
    } catch (error) {
      showError(error);
    }
  }

  function setLoading() {
    elements.summary.textContent = "Connecting to Jobs...";
    elements.headerNote.textContent = "Loading current jobs from the sheet.";
    elements.chart.innerHTML = "";
    elements.chartNote.textContent = "Choose a metric to compare by source.";
    elements.legend.innerHTML = "";
    elements.metricButtons.innerHTML = "";
    elements.filters.innerHTML = "";
    elements.grid.innerHTML = "";
    elements.empty.hidden = true;
    elements.empty.classList.remove("error");
    elements.refresh.disabled = true;
    elements.refresh.textContent = "Loading";
  }

  function loadSheetTable() {
    return new Promise((resolve, reject) => {
      const callbackName = `__jobsSheet_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script = document.createElement("script");
      const timeout = window.setTimeout(() => {
        cleanup();
        reject(new Error("Timed out loading the Jobs tab."));
      }, 15000);

      window[callbackName] = (response) => {
        cleanup();
        if (response.status && response.status !== "ok") {
          reject(new Error(response.errors?.[0]?.detailed_message || "Google Sheets could not return the Jobs tab."));
          return;
        }
        resolve(response.table);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Could not connect to Google Sheets."));
      };

      script.src = `${GVIZ_URL}&tqx=responseHandler:${callbackName}&cacheBust=${Date.now()}`;
      document.head.append(script);

      function cleanup() {
        window.clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }
    });
  }

  function render() {
    const availableDates = getPastWeekDatesWithRows();
    renderDateButtons(availableDates);
    renderMetricButtons();
    renderMonthlyChart();

    const filteredRows = state.rows.filter((row) => recordHasDate(row, state.selectedDate));
    elements.title.textContent = state.selectedDate === todayKey ? "Today's Jobs" : formatDateHeading(state.selectedDate);
    elements.headerNote.textContent = `${state.rows.length.toLocaleString()} Jobs rows loaded. Showing dates from the past week.`;
    elements.summary.innerHTML = `<strong>${filteredRows.length}</strong> job${filteredRows.length === 1 ? "" : "s"} for ${formatDateLong(state.selectedDate)}`;

    elements.grid.innerHTML = "";
    filteredRows.forEach((row) => elements.grid.append(createCard(row)));
    elements.empty.hidden = filteredRows.length > 0;
    elements.empty.textContent = availableDates.length
      ? "No jobs found for this date."
      : "No dated jobs found in the past week.";

    elements.refresh.disabled = false;
    elements.refresh.textContent = "Refresh";
  }

  function renderDateButtons(availableDates) {
    elements.filters.innerHTML = "";

    const weekDates = getPastWeekKeys();
    weekDates.forEach((dateKey) => {
      if (!availableDates.includes(dateKey) && dateKey !== todayKey) return;

      const button = document.createElement("button");
      button.className = "date-button";
      button.type = "button";
      button.textContent = dateKey === todayKey ? "Today" : formatDateShort(dateKey);
      button.setAttribute("aria-pressed", String(state.selectedDate === dateKey));
      button.disabled = !availableDates.includes(dateKey) && dateKey === todayKey;
      button.addEventListener("click", () => {
        state.selectedDate = dateKey;
        render();
      });
      elements.filters.append(button);
    });

    if (!elements.filters.children.length) {
      const note = document.createElement("span");
      note.className = "summary";
      note.textContent = "No available job dates found in the past week.";
      elements.filters.append(note);
    }
  }

  function renderMetricButtons() {
    elements.metricButtons.innerHTML = "";
    chartMetrics.forEach((metric) => {
      const button = document.createElement("button");
      button.className = "metric-button";
      button.type = "button";
      button.textContent = metric.key;
      button.setAttribute("aria-pressed", String(state.chartMetric === metric.key));
      button.addEventListener("click", () => {
        state.chartMetric = metric.key;
        renderMonthlyChart();
        renderMetricButtons();
      });
      elements.metricButtons.append(button);
    });
  }

  function renderMonthlyChart() {
    const data = getMonthlyChartData();
    elements.chart.innerHTML = "";
    elements.legend.innerHTML = "";

    if (!data.months.length) {
      elements.chart.setAttribute("viewBox", "0 0 760 90");
      appendSvgText(elements.chart, 24, 48, "No monthly data available for this metric.", "axis-label");
      elements.chartNote.textContent = "No rows could be grouped by month and source.";
      return;
    }

    const left = 92;
    const right = 54;
    const top = 18;
    const rowHeight = 34;
    const width = 860;
    const barWidth = width - left - right;
    const height = top + data.months.length * rowHeight + 18;

    elements.chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
    elements.chart.setAttribute("height", String(height));
    elements.chartNote.textContent = `${data.metricHeader} totals, stacked by Source.`;

    data.months.forEach((month, index) => {
      const y = top + index * rowHeight;
      appendSvgText(elements.chart, 0, y + 20, month, "axis-label");
      appendSvgLine(elements.chart, left, y + 28, width - right, y + 28, "grid-line");

      let cursor = left;
      data.sources.forEach((source) => {
        const value = data.values.get(`${month}|${source}`) || 0;
        if (!value) return;

        const segmentWidth = Math.max(1, value / data.max * barWidth);
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", String(cursor));
        rect.setAttribute("y", String(y + 6));
        rect.setAttribute("width", String(segmentWidth));
        rect.setAttribute("height", "18");
        rect.setAttribute("rx", "4");
        rect.setAttribute("fill", getSourceColor(source, data.sources));
        rect.append(document.createElementNS("http://www.w3.org/2000/svg", "title"));
        rect.querySelector("title").textContent = `${month} - ${source}: ${value}`;
        elements.chart.append(rect);
        cursor += segmentWidth;
      });

      appendSvgText(elements.chart, Math.min(cursor + 8, width - right + 4), y + 20, String(data.totals.get(month)), "bar-value");
    });

    data.sources.forEach((source) => {
      const item = document.createElement("span");
      item.className = "legend-item";

      const swatch = document.createElement("span");
      swatch.className = "legend-swatch";
      swatch.style.background = getSourceColor(source, data.sources);

      const label = document.createElement("span");
      label.textContent = source;

      item.append(swatch, label);
      elements.legend.append(item);
    });
  }

  function getMonthlyChartData() {
    const metric = chartMetrics.find((item) => item.key === state.chartMetric) || chartMetrics[0];
    const metricHeader = findNumericHeader(metric.labels);
    const sourceHeader = findHeaderByLabels(["Source"]);
    const monthHeader = findHeaderByLabels(["Month"]);
    const loggedHeader = findHeaderByLabels(["Logged"]);
    const values = new Map();
    const totals = new Map();
    const sources = new Set();
    const months = new Set();

    if (!metricHeader || !sourceHeader) {
      return { months: [], sources: [], values, totals, metricHeader: metric.key, max: 1 };
    }

    state.rows.forEach((row) => {
      const month = getMonthKey(row, monthHeader, loggedHeader);
      const source = row.values[sourceHeader] || "Unspecified";
      const value = parseNumber(row.values[metricHeader]);
      if (!month || !value) return;

      sources.add(source);
      months.add(month);
      values.set(`${month}|${source}`, (values.get(`${month}|${source}`) || 0) + value);
      totals.set(month, (totals.get(month) || 0) + value);
    });

    const monthList = [...months].sort().reverse();
    const sourceList = [...sources].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const max = Math.max(1, ...monthList.map((month) => totals.get(month) || 0));

    return { months: monthList, sources: sourceList, values, totals, metricHeader, max };
  }

  function findNumericHeader(labels) {
    const candidates = state.headers.filter((header) => labels.some((label) => normalizeLabel(header) === normalizeLabel(label)));
    return candidates
      .map((header) => ({
        header,
        numericCount: state.rows.reduce((count, row) => count + (parseNumber(row.values[header]) ? 1 : 0), 0)
      }))
      .sort((a, b) => b.numericCount - a.numericCount)[0]?.header || "";
  }

  function findHeaderByLabels(labels) {
    return state.headers.find((header) => labels.some((label) => normalizeLabel(header) === normalizeLabel(label))) || "";
  }

  function getMonthKey(row, monthHeader, loggedHeader) {
    const monthValue = monthHeader ? row.values[monthHeader] : "";
    const direct = monthValue.match(/\b(\d{4})-(\d{2})\b/);
    if (direct && direct[1] !== "1899") return `${direct[1]}-${direct[2]}`;

    const loggedDate = loggedHeader ? parseDateValue(row.values[loggedHeader]) : "";
    return loggedDate ? loggedDate.slice(0, 7) : "";
  }

  function getSourceColor(source, sources) {
    const index = Math.max(0, sources.indexOf(source));
    return sourceColors[index % sourceColors.length];
  }

  function appendSvgText(svg, x, y, text, className) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", "text");
    node.setAttribute("x", String(x));
    node.setAttribute("y", String(y));
    node.setAttribute("class", className);
    node.textContent = text;
    svg.append(node);
  }

  function appendSvgLine(svg, x1, y1, x2, y2, className) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", "line");
    node.setAttribute("x1", String(x1));
    node.setAttribute("y1", String(y1));
    node.setAttribute("x2", String(x2));
    node.setAttribute("y2", String(y2));
    node.setAttribute("class", className);
    svg.append(node);
  }

  function createCard(row) {
    const card = document.createElement("article");
    card.className = "job-card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-expanded", "false");

    const titleHeader = pickHeader(row, titleHeaders) || firstMeaningfulHeader(row);
    const subtitleHeader = pickHeader(row, subtitleHeaders.filter((header) => header !== titleHeader));
    const locationHeader = titleHeader !== "Location" && subtitleHeader !== "Location" ? state.headers.find((header) => header.toLowerCase() === "location" && row.values[header]) : "";
    const dateHeader = state.dateHeaders.find((header) => parseDateValue(row.values[header]) === state.selectedDate);

    const head = document.createElement("div");
    head.className = "card-head";

    const title = document.createElement("h2");
    title.className = "job-title";
    title.textContent = row.values[titleHeader] || `Job row ${row.rowNumber}`;
    head.append(title);

    if (subtitleHeader && row.values[subtitleHeader]) {
      const subtitle = document.createElement("div");
      subtitle.className = "job-subtitle";
      subtitle.textContent = locationHeader ? `${row.values[subtitleHeader]} - ${row.values[locationHeader]}` : row.values[subtitleHeader];
      head.append(subtitle);
    }

    if (dateHeader) {
      const pill = document.createElement("div");
      pill.className = "date-pill";
      pill.textContent = `${dateHeader}: ${row.values[dateHeader]}`;
      head.append(pill);
    }

    const list = document.createElement("dl");
    list.className = "field-list";
    list.hidden = true;

    fieldsForCard(row, titleHeader, subtitleHeader, dateHeader, locationHeader).forEach(([label, value]) => {
      const wrapper = document.createElement("div");
      wrapper.className = "field-row";

      const term = document.createElement("dt");
      term.className = "field-label";
      term.textContent = label;

      const detail = document.createElement("dd");
      detail.className = "field-value";
      appendValue(detail, value);

      wrapper.append(term, detail);
      list.append(wrapper);
    });

    const toggleHint = document.createElement("div");
    toggleHint.className = "toggle-hint";
    toggleHint.textContent = list.children.length ? "Show details" : "No extra details";

    const toggleDetails = () => {
      if (!list.children.length) return;
      const isOpen = card.getAttribute("aria-expanded") === "true";
      card.setAttribute("aria-expanded", String(!isOpen));
      list.hidden = isOpen;
      toggleHint.textContent = isOpen ? "Show details" : "Hide details";
    };

    card.addEventListener("click", (event) => {
      if (event.target.closest("a")) return;
      toggleDetails();
    });

    card.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleDetails();
    });

    card.append(head, toggleHint, list);
    return card;
  }

  function fieldsForCard(row, titleHeader, subtitleHeader, dateHeader, locationHeader) {
    const skipped = new Set([titleHeader, subtitleHeader, dateHeader, locationHeader].filter(Boolean));
    const important = ["call", "shift", "valid", "source", "status", "time", "start time", "end time", "phone", "email", "notes", "amount", "total", "priority"];
    const ordered = [
      ...state.headers.filter((header) => important.some((keyword) => header.toLowerCase().includes(keyword))),
      ...state.headers
    ];

    const seen = new Set();
    return ordered
      .filter((header) => {
        if (seen.has(header) || skipped.has(header) || !row.values[header]) return false;
        seen.add(header);
        return true;
      })
      .slice(0, 8)
      .map((header) => [header, row.values[header]]);
  }

  function appendValue(target, value) {
    const trimmed = value.trim();
    const urlMatch = trimmed.match(/^https?:\/\/\S+$/i);
    const emailMatch = trimmed.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);

    if (urlMatch) {
      const link = document.createElement("a");
      link.href = trimmed;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.textContent = "Open link";
      target.append(link);
      return;
    }

    if (emailMatch) {
      const link = document.createElement("a");
      link.href = `mailto:${trimmed}`;
      link.textContent = trimmed;
      target.append(link);
      return;
    }

    target.textContent = trimmed;
  }

  function toRecord(headers, row, rowNumber) {
    const values = {};
    headers.forEach((header, index) => {
      values[header] = formatCell(row.c?.[index]);
    });
    return { rowNumber, values };
  }

  function formatCell(cell) {
    if (!cell) return "";
    const value = cell.f ?? cell.v ?? "";
    return String(value).trim();
  }

  function makeUniqueHeaders(headers) {
    const counts = new Map();
    return headers.map((header) => {
      const count = counts.get(header) || 0;
      counts.set(header, count + 1);
      return count ? `${header} ${count + 1}` : header;
    });
  }

  function findDateHeaders(headers, rows) {
    const byName = headers.filter((header) => preferredDateHeaders.some((keyword) => header.toLowerCase().includes(keyword)));
    const byValues = headers.filter((header) => rows.slice(0, 50).some((row) => parseDateValue(row.values[header])));
    return [...new Set([...byName, ...byValues])];
  }

  function recordHasDate(row, dateKey) {
    return state.dateHeaders.some((header) => parseDateValue(row.values[header]) === dateKey);
  }

  function getPastWeekDatesWithRows() {
    const allowed = new Set(getPastWeekKeys());
    const dates = new Set();
    state.rows.forEach((row) => {
      state.dateHeaders.forEach((header) => {
        const dateKey = parseDateValue(row.values[header]);
        if (allowed.has(dateKey)) dates.add(dateKey);
      });
    });
    return [...dates].sort().reverse();
  }

  function getPastWeekKeys() {
    return Array.from({ length: 7 }, (_, index) => {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() - index);
      return toDateKey(date);
    });
  }

  function pickHeader(row, candidates) {
    return state.headers.find((header) => {
      const lower = header.toLowerCase();
      return row.values[header] && candidates.some((candidate) => lower === candidate || lower.includes(candidate));
    });
  }

  function firstMeaningfulHeader(row) {
    return state.headers.find((header) => row.values[header] && !state.dateHeaders.includes(header));
  }

  function parseNumber(value) {
    const number = Number(String(value || "").replace(/,/g, "").trim());
    return Number.isFinite(number) ? number : 0;
  }

  function normalizeLabel(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/\s+\d+$/, "")
      .replace(/[^a-z0-9]+/g, "");
  }

  function parseDateValue(value) {
    if (!value) return "";
    const trimmed = value.trim();
    const iso = trimmed.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (iso) return toDateKey(new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3])));

    const slash = trimmed.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/);
    if (slash) {
      const year = Number(slash[3].length === 2 ? `20${slash[3]}` : slash[3]);
      const first = Number(slash[1]);
      const second = Number(slash[2]);
      const month = first > 12 ? second : first;
      const day = first > 12 ? first : second;
      return toDateKey(new Date(year, month - 1, day));
    }

    if (/[a-z]/i.test(trimmed) && /\d/.test(trimmed)) {
      const parsed = new Date(trimmed);
      return Number.isNaN(parsed.getTime()) ? "" : toDateKey(parsed);
    }

    return "";
  }

  function toDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function formatDateShort(dateKey) {
    return new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" }).format(new Date(`${dateKey}T12:00:00`));
  }

  function formatDateLong(dateKey) {
    return new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date(`${dateKey}T12:00:00`));
  }

  function formatDateHeading(dateKey) {
    return `${formatDateShort(dateKey)} Jobs`;
  }

  function showError(error) {
    elements.summary.textContent = "Could not load the Jobs tab.";
    elements.headerNote.textContent = "Check that the sheet is shared for viewing or published enough for CSV access.";
    elements.grid.innerHTML = "";
    elements.filters.innerHTML = "";
    elements.empty.hidden = false;
    elements.empty.classList.add("error");
    elements.empty.textContent = error.message;
    elements.refresh.disabled = false;
    elements.refresh.textContent = "Retry";
  }

</script>
</body>
