<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Agence du Savoir — Logan</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f1c35;
  --navy-mid: #1a2e50;
  --navy-light: #243c6b;
  --gold: #e8a91a;
  --gold-light: #f5cc60;
  --green: #4aaa55;
  --green-light: #6bcb77;
  --cream: #fef9ee;
  --cream-dark: #f5edd8;
  --red: #e05252;
  --text: #1f2933;
  --muted: #6b7280;
  --white: #ffffff;
  --shadow: 0 4px 16px rgba(0,0,0,.15);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.agency-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  padding: 20px 16px 24px;
  text-align: center;
  position: relative;
  border-bottom: 3px solid var(--gold);
}
.agency-badge {
  font-size: 40px;
  margin-bottom: 6px;
  display: block;
}
.agency-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: clamp(1.3rem, 5vw, 2rem);
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 1px;
  line-height: 1.2;
}
.agency-sub {
  font-size: 13px;
  color: rgba(255,255,255,.65);
  margin-top: 4px;
}
.agent-card {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(232,169,26,.3);
  border-radius: 30px;
  padding: 8px 16px;
  margin-top: 12px;
  color: white;
  font-size: 13px;
  font-weight: 700;
}
.agent-card span { font-size: 18px; }

/* ── Progress Bar ── */
.progress-section {
  background: var(--navy-mid);
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.progress-label {
  display: flex;
  justify-content: space-between;
  color: rgba(255,255,255,.7);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.progress-track {
  height: 8px;
  background: rgba(255,255,255,.1);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  border-radius: 4px;
  transition: width .6s ease;
}

/* ── Subject tabs ── */
.subject-tabs {
  display: flex;
  background: var(--navy-mid);
  padding: 0 12px;
  overflow-x: auto;
  border-bottom: 2px solid rgba(255,255,255,.08);
  gap: 4px;
}
.s-tab {
  flex-shrink: 0;
  padding: 12px 16px;
  background: none;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: rgba(255,255,255,.5);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all .2s;
  white-space: nowrap;
}
.s-tab:hover { color: rgba(255,255,255,.85); }
.s-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── Case Grid ── */
.cases-wrap {
  padding: 16px 14px 40px;
  max-width: 760px;
  margin: 0 auto;
}
.section-heading {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  margin: 20px 0 10px;
  padding-left: 2px;
}
.case-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ── Case Card ── */
.case-card {
  background: var(--navy-mid);
  border: 2px solid rgba(232,169,26,.2);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .2s;
  overflow: hidden;
  position: relative;
}
.case-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow); }
.case-card.completed { border-color: var(--green); }
.case-card.locked { opacity: .55; cursor: default; }
.case-card.locked:hover { transform: none; border-color: rgba(232,169,26,.2); }

.cc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px 10px;
}
.cc-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.cc-icon.fla { background: rgba(91,155,213,.15); }
.cc-icon.ss  { background: rgba(74,170,85,.15); }
.cc-meta { flex: 1; min-width: 0; }
.cc-code {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.cc-code.fla { color: #5b9bd5; }
.cc-code.ss  { color: var(--green); }
.cc-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: white;
  line-height: 1.3;
}
.cc-status {
  font-size: 18px;
  flex-shrink: 0;
}
.cc-body {
  padding: 0 16px 14px;
}
.cc-desc {
  font-size: 12px;
  color: rgba(255,255,255,.6);
  line-height: 1.55;
}
.cc-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.cc-pill {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.6);
}
.cc-pill.fla { background: rgba(91,155,213,.15); color: #5b9bd5; }
.cc-pill.ss  { background: rgba(74,170,85,.15);  color: var(--green-light); }
.completed-badge {
  display: none;
  font-size: 10px;
  font-weight: 800;
  color: var(--green);
  background: rgba(74,170,85,.12);
  padding: 3px 10px;
  border-radius: 20px;
}
.case-card.completed .completed-badge { display: inline; }

/* ── Modal Overlay ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 200;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-overlay.open { display: block; }

.modal-box {
  background: var(--cream);
  max-width: 680px;
  margin: 20px auto 40px;
  border-radius: var(--radius);
  overflow: hidden;
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ── Dossier Header ── */
.dossier-header {
  background: var(--navy);
  padding: 18px 20px 16px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.dossier-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.dossier-meta { flex: 1; }
.dossier-code {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.dossier-code.fla { color: #5b9bd5; }
.dossier-code.ss  { color: var(--green-light); }
.dossier-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: clamp(1rem, 4vw, 1.4rem);
  font-weight: 800;
  color: white;
  line-height: 1.25;
}
.dossier-close {
  background: rgba(255,255,255,.1);
  border: none;
  color: white;
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.dossier-close:hover { background: rgba(255,255,255,.2); }

/* ── Phase Indicator ── */
.phase-bar {
  background: var(--navy-mid);
  display: flex;
  align-items: center;
  padding: 10px 20px;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.phase-step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.4);
}
.phase-step.active { color: var(--gold); }
.phase-step.done   { color: var(--green); }
.phase-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  flex-shrink: 0;
}
.phase-step.active .phase-dot { background: var(--gold); color: var(--navy); }
.phase-step.done   .phase-dot { background: var(--green); color: white; font-size: 11px; }
.phase-line {
  flex: 1;
  height: 2px;
  background: rgba(255,255,255,.1);
}
.phase-line.done { background: var(--green); }

/* ── Reading Phase ── */
.reading-phase { display: none; }
.reading-phase.active { display: block; }

.dossier-stamp {
  background: var(--cream-dark);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 2px dashed #d4c4a0;
}
.stamp-text {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #8b5e3c;
}
.stamp-time {
  margin-left: auto;
  font-size: 11px;
  color: #8b5e3c;
  font-weight: 700;
}

.reading-body {
  padding: 20px 22px;
  background: var(--cream);
  font-size: 14px;
  line-height: 1.75;
  color: #2d2016;
}
.reading-body h3 {
  font-family: 'Baloo 2', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #0f1c35;
  margin: 18px 0 6px;
  border-left: 3px solid var(--gold);
  padding-left: 10px;
}
.reading-body h3:first-child { margin-top: 0; }
.reading-body p { margin-bottom: 10px; }
.reading-body ul { padding-left: 20px; margin-bottom: 10px; }
.reading-body ul li { margin-bottom: 5px; }
.reading-body strong { color: #0f1c35; }
.vocab-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 14px 0;
}
.vocab-chip {
  background: var(--navy);
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
}

.reading-cta {
  padding: 16px 20px;
  background: var(--cream-dark);
  border-top: 2px dashed #d4c4a0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.reading-cta p {
  font-size: 13px;
  color: #5c4025;
  font-weight: 700;
}
.btn-primary {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  color: var(--gold);
  border: 2px solid var(--gold);
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 14px;
  padding: 10px 22px;
  border-radius: 30px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--gold); color: var(--navy); }

/* ── Worksheet Phase ── */
.worksheet-phase { display: none; }
.worksheet-phase.active { display: block; }

.ws-header {
  background: var(--cream-dark);
  padding: 14px 20px;
  border-bottom: 2px dashed #d4c4a0;
}
.ws-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 2px;
}
.ws-sub {
  font-size: 12px;
  color: #8b5e3c;
}

.ws-body {
  padding: 20px 22px;
  background: var(--cream);
}

.question-block {
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px dashed #d4c4a0;
}
.question-block:last-child { border-bottom: none; margin-bottom: 0; }

.q-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.q-label.mc  { color: #5b6ad5; }
.q-label.fib { color: #b05a1a; }

.q-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.55;
  margin-bottom: 12px;
}

/* Multiple Choice */
.mc-options { display: flex; flex-direction: column; gap: 8px; }
.mc-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  border: 2px solid #e5e0d4;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all .15s;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  text-align: left;
  font-family: 'Nunito', sans-serif;
  width: 100%;
}
.mc-option:hover { border-color: var(--navy); background: #f5f0e8; }
.mc-option.selected { border-color: var(--navy); background: #eef0f8; }
.mc-option.correct  { border-color: var(--green); background: #f0fdf4; color: #1a5c25; }
.mc-option.wrong    { border-color: var(--red); background: #fff5f5; color: #7a1c1c; }
.mc-option.reveal   { border-color: var(--green); background: #f0fdf4; color: #1a5c25; opacity: .7; }
.option-letter {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  flex-shrink: 0;
  transition: all .15s;
}
.mc-option.correct  .option-letter { background: var(--green); color: white; }
.mc-option.wrong    .option-letter { background: var(--red); color: white; }
.mc-option.reveal   .option-letter { background: var(--green); color: white; }

/* Fill in the Blank */
.fib-wrap { position: relative; }
.fib-input {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #d4c4a0;
  border-radius: 10px;
  background: white;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  outline: none;
  transition: border-color .15s;
}
.fib-input:focus { border-color: var(--navy); }
.fib-input.correct { border-color: var(--green); background: #f0fdf4; }
.fib-input.wrong   { border-color: var(--red); background: #fff5f5; }
.fib-check {
  background: var(--navy);
  color: var(--gold);
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 12px;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 8px;
  transition: background .15s;
}
.fib-check:hover { background: var(--navy-light); }

.q-feedback {
  display: none;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 8px;
  margin-top: 8px;
  line-height: 1.5;
}
.q-feedback.correct { display: block; background: #f0fdf4; color: #1a5c25; border-left: 3px solid var(--green); }
.q-feedback.wrong   { display: block; background: #fff5f5; color: #7a1c1c; border-left: 3px solid var(--red); }

/* Score / Submit */
.ws-submit-row {
  padding: 16px 20px;
  background: var(--cream-dark);
  border-top: 2px dashed #d4c4a0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.ws-score-text {
  font-size: 13px;
  color: #5c4025;
  font-weight: 700;
}
.btn-submit {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  color: var(--gold);
  border: 2px solid var(--gold);
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 14px;
  padding: 10px 22px;
  border-radius: 30px;
  cursor: pointer;
  transition: all .15s;
}
.btn-submit:hover { background: var(--gold); color: var(--navy); }

/* ── Completion Screen ── */
.completion-screen {
  display: none;
  padding: 30px 20px;
  background: var(--cream);
  text-align: center;
}
.completion-screen.active { display: block; }
.comp-badge {
  font-size: 64px;
  display: block;
  margin-bottom: 12px;
  animation: badgePop .4s cubic-bezier(.17,.67,.4,1.8);
}
@keyframes badgePop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.comp-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 4px;
}
.comp-score {
  font-size: 15px;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 10px;
}
.comp-msg {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  max-width: 380px;
  margin: 0 auto 20px;
}
.btn-close-comp {
  background: linear-gradient(135deg, var(--green), #2a8a35);
  color: white;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 15px;
  padding: 12px 28px;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(74,170,85,.35);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy);
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--gold);
  z-index: 999;
  transition: transform .3s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: rgba(255,255,255,.4);
}
.empty-state .es-icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }

/* ── Responsive ── */
@media (max-width: 500px) {
  .modal-box { margin: 0; border-radius: 16px 16px 0 0; min-height: 100vh; }
  .modal-overlay { align-items: flex-end; display: flex; flex-direction: column; justify-content: flex-end; }
  .modal-overlay.open { display: flex; }
  .reading-cta { flex-direction: column; align-items: stretch; }
  .reading-cta .btn-primary { width: 100%; text-align: center; }
  .ws-submit-row { flex-direction: column; }
  .btn-submit { width: 100%; text-align: center; }
  .case-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── Agency Header ── -->
<header class="agency-header">
  <span class="agency-badge">🔍</span>
  <div class="agency-title">L'Agence du Savoir</div>
  <div class="agency-sub">Grade 4 · French Immersion · Alberta</div>
  <div class="agent-card"><span>🕵️</span> Agent Logan · Mission : Récupérer la Bibliothèque Perdue</div>
</header>

<!-- ── Progress ── -->
<div class="progress-section">
  <div class="progress-label">
    <span id="prog-label">Dossiers complétés</span>
    <span id="prog-count">0 / 8</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<!-- ── Subject Tabs ── -->
<div class="subject-tabs">
  <button class="s-tab active" onclick="showSubject('all')">📁 Tous les Dossiers</button>
  <button class="s-tab" onclick="showSubject('fla')">📖 Français (FLA)</button>
  <button class="s-tab" onclick="showSubject('ss')">🍁 Sciences Humaines (SS)</button>
</div>

<!-- ── Cases ── -->
<div class="cases-wrap">
  <div class="section-heading" id="fla-heading">📖 Dossiers — Arts de la Langue Française</div>
  <div class="case-grid" id="fla-grid"></div>
  <div class="section-heading" id="ss-heading">🍁 Dossiers — Sciences Humaines</div>
  <div class="case-grid" id="ss-grid"></div>
</div>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modal-box">
    <!-- Injected by JS -->
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   DATA — Cases
══════════════════════════════════════════════════════════ */
const CASES = [
  {
    id: 'fla-001',
    subject: 'fla',
    code: '4FLA.2.2',
    icon: '📜',
    title: 'Le Livre Codé',
    subtitle: 'Stratégies de lecture',
    desc: 'Une lettre mystérieuse a été trouvée à l\'école. Maîtrise les cinq stratégies de lecture pour la décoder !',
    reading: {
      title: 'Dossier #FLA-001 — Le Livre Codé',
      intro: 'Une vieille bibliothèque a été scellée par un mystérieux cadenas. L\'unique indice : un livre dont chaque page utilise des stratégies secrètes. Pour l\'ouvrir, tu dois les maîtriser.',
      sections: [
        {

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let progress = JSON.parse(localStorage.getItem('lads_progress') || '{}');
let currentCase = null;
let currentPhase = 'reading'; // 'reading' | 'worksheet'
let answers = {};

function saveProgress() {
  localStorage.setItem('lads_progress', JSON.stringify(progress));
}

/* ══════════════════════════════════════════════════════════
   RENDER CARDS
══════════════════════════════════════════════════════════ */
function renderCases(filter = 'all') {
  const flaGrid = document.getElementById('fla-grid');
  const ssGrid  = document.getElementById('ss-grid');
  flaGrid.innerHTML = '';
  ssGrid.innerHTML  = '';

  const flaH = document.getElementById('fla-heading');
  const ssH  = document.getElementById('ss-heading');
  flaH.style.display = (filter === 'ss') ? 'none' : '';
  ssH.style.display  = (filter === 'fla') ? 'none' : '';

  CASES.forEach(c => {
    if (filter !== 'all' && c.subject !== filter) return;
    const done = progress[c.id]?.completed;
    const card = document.createElement('div');
    card.className = `case-card${done ? ' completed' : ''}`;
    card.onclick = () => openCase(c.id);
    card.innerHTML = `
      <div class="cc-header">
        <div class="cc-icon ${c.subject}">${c.icon}</div>
        <div class="cc-meta">
          <div class="cc-code ${c.subject}">${c.code}</div>
          <div class="cc-title">${c.title}</div>
        </div>
        <div class="cc-status">${done ? '✅' : '🔒'}</div>
      </div>
      <div class="cc-body">
        <div class="cc-desc">${c.desc}</div>
        <div class="cc-meta-row">
          <span class="cc-pill ${c.subject}">${c.subject === 'fla' ? '📖 Français' : '🍁 Sciences Humaines'}</span>
          <span class="cc-pill">⏱ 15 min</span>
          <span class="completed-badge">✓ Complété</span>
        </div>
      </div>`;
    (c.subject === 'fla' ? flaGrid : ssGrid).appendChild(card);
  });

  updateProgress();
}

function updateProgress() {
  const done = CASES.filter(c => progress[c.id]?.completed).length;
  const total = CASES.length;
  document.getElementById('prog-count').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = `${Math.round(done/total*100)}%`;
  document.getElementById('prog-label').textContent =
    done === total ? '🎉 Mission accomplie !' : 'Dossiers complétés';
}

function showSubject(sub) {
  document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderCases(sub);
}

/* ══════════════════════════════════════════════════════════
   OPEN CASE
══════════════════════════════════════════════════════════ */
function openCase(id) {
  currentCase = CASES.find(c => c.id === id);
  currentPhase = 'reading';
  answers = {};
  document.getElementById('modal-box').innerHTML = buildModal(currentCase);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  currentCase = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

/* ══════════════════════════════════════════════════════════
   BUILD MODAL HTML
══════════════════════════════════════════════════════════ */
function buildModal(c) {
  const done = progress[c.id]?.completed;
  return `
    <div class="dossier-header">
      <div class="dossier-icon">${c.icon}</div>
      <div class="dossier-meta">
        <div class="dossier-code ${c.subject}">${c.code} · ${c.subject === 'fla' ? 'Arts de la Langue Française' : 'Sciences Humaines'}</div>
        <div class="dossier-title">${c.reading.title}</div>
      </div>
      <button class="dossier-close" onclick="closeModal()">✕</button>
    </div>

    <div class="phase-bar">
      <div class="phase-step ${currentPhase === 'reading' ? 'active' : (currentPhase === 'worksheet' || done ? 'done' : '')}" id="ph-1">
        <div class="phase-dot">${currentPhase !== 'reading' ? '✓' : '1'}</div>
        <span>Lecture</span>
      </div>
      <div class="phase-line ${currentPhase !== 'reading' ? 'done' : ''}"></div>
      <div class="phase-step ${currentPhase === 'worksheet' ? 'active' : (done ? 'done' : '')}" id="ph-2">
        <div class="phase-dot">${done ? '✓' : '2'}</div>
        <span>Fiche de travail</span>
      </div>
    </div>

    <div class="reading-phase active" id="reading-phase">
      <div class="dossier-stamp">
        <span>🗂️</span>
        <span class="stamp-text">Dossier Confidentiel — Agent Logan</span>
        <span class="stamp-time">⏱ 8 min de lecture</span>
      </div>
      <div class="reading-body">
        <p><em>${c.reading.intro}</em></p>
        ${c.reading.sections.map(s => `<h3>${s.heading}</h3>${s.content}`).join('')}
        <div class="vocab-row">${c.reading.vocab.map(v => `<span class="vocab-chip">${v}</span>`).join('')}</div>
      </div>
      <div class="reading-cta">
        <p>📋 Prêt(e) pour la fiche de travail ?</p>
        <button class="btn-primary" onclick="startWorksheet()">Commencer la fiche →</button>
      </div>
    </div>

    <div class="worksheet-phase" id="worksheet-phase">
      <div class="ws-header">
        <div class="ws-title">📋 Fiche de Travail — ${c.subtitle}</div>
        <div class="ws-sub">⏱ 7 min · Réponds à toutes les questions pour compléter le dossier</div>
      </div>
      <div class="ws-body" id="ws-questions">
        ${buildQuestions(c)}
      </div>
      <div class="ws-submit-row">
        <span class="ws-score-text" id="ws-score-text">Réponds à toutes les questions puis vérifie.</span>
        <button class="btn-submit" onclick="checkAll()">Vérifier les réponses ✓</button>
      </div>
    </div>

    <div class="completion-screen" id="completion-screen">
      <span class="comp-badge">🏅</span>
      <div class="comp-title">Dossier Complété !</div>
      <div class="comp-score" id="comp-score-text"></div>
      <div class="comp-msg">Excellent travail, agent Logan ! Ce dossier est maintenant classé dans tes archives. Continue vers le prochain pour récupérer la bibliothèque du savoir.</div>
      <button class="btn-close-comp" onclick="closeModal(); renderCases();">Retour aux Dossiers</button>
    </div>
  `;
}

function buildQuestions(c) {
  return c.questions.map((q, i) => {
    if (q.type === 'mc') {
      const opts = q.options.map((o, j) => `
        <button class="mc-option" onclick="selectMC(${i}, ${j})" id="opt-${i}-${j}">
          <span class="option-letter">${String.fromCharCode(65+j)}</span>
          ${o}
        </button>`).join('');
      return `
        <div class="question-block" id="q-block-${i}">
          <div class="q-label mc">Choix Multiple · Q${i+1}</div>
          <div class="q-text">${q.text}</div>
          <div class="mc-options">${opts}</div>
          <div class="q-feedback" id="fb-${i}"></div>
        </div>`;
    } else {
      return `
        <div class="question-block" id="q-block-${i}">
          <div class="q-label fib">Remplis le Blanc · Q${i+1}</div>
          <div class="q-text">${q.text}</div>
          <div class="fib-wrap">
            <input class="fib-input" type="text" id="fib-${i}" placeholder="Tape ta réponse ici…" oninput="fibInput(${i})" autocomplete="off" autocorrect="off" spellcheck="false">
          </div>
          <div class="q-feedback" id="fb-${i}"></div>
        </div>`;
    }
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   INTERACTIONS
══════════════════════════════════════════════════════════ */
function startWorksheet() {
  currentPhase = 'worksheet';
  document.getElementById('reading-phase').classList.remove('active');
  document.getElementById('worksheet-phase').classList.add('active');

  // Update phase bar
  const ph1 = document.getElementById('ph-1');
  const ph2 = document.getElementById('ph-2');
  const line = document.querySelector('.phase-line');
  ph1.classList.remove('active'); ph1.classList.add('done');
  ph1.querySelector('.phase-dot').textContent = '✓';
  ph2.classList.add('active');
  line.classList.add('done');

  document.getElementById('modal-box').scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('modal').scrollTo({ top: 0, behavior: 'smooth' });
}

function selectMC(qIdx, optIdx) {
  const q = currentCase.questions[qIdx];
  if (answers[qIdx] !== undefined) return; // already answered
  // Just store selection for batch check, OR we can do immediate feedback
  // Do immediate feedback
  answers[qIdx] = optIdx;

  const correct = optIdx === q.answer;
  for (let j = 0; j < q.options.length; j++) {
    const btn = document.getElementById(`opt-${qIdx}-${j}`);
    if (j === optIdx) {
      btn.classList.add(correct ? 'correct' : 'wrong');
    } else if (j === q.answer && !correct) {
      btn.classList.add('reveal');
    }
  }

  const fb = document.getElementById(`fb-${qIdx}`);
  fb.className = `q-feedback ${correct ? 'correct' : 'wrong'}`;
  fb.textContent = correct
    ? '✓ Bonne réponse !'
    : `✗ La bonne réponse est : « ${q.options[q.answer]} »`;
}

function fibInput(qIdx) {
  // clear previous state when user types again
  const input = document.getElementById(`fib-${qIdx}`);
  input.classList.remove('correct', 'wrong');
  document.getElementById(`fb-${qIdx}`).className = 'q-feedback';
}

function checkFib(qIdx) {
  const q = currentCase.questions[qIdx];
  const input = document.getElementById(`fib-${qIdx}`);
  const val = input.value.trim().toLowerCase();
  const ans = q.answer.toLowerCase();
  // Accept partial match for common variations (e.g., "5" for "cinq", accents)
  const normalize = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const correct = normalize(val) === normalize(ans)
    || val === ans
    || (ans === 'cinq' && val === '5')
    || (ans === 'fort mcmurray' && normalize(val).includes('fort'));

  answers[qIdx] = val;
  input.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById(`fb-${qIdx}`);
  fb.className = `q-feedback ${correct ? 'correct' : 'wrong'}`;
  fb.textContent = correct
    ? '✓ Bonne réponse !'
    : `✗ La bonne réponse est : « ${q.answer} »`;
}

function checkAll() {
  const c = currentCase;
  let correct = 0;
  let total = c.questions.length;
  let allAnswered = true;

  c.questions.forEach((q, i) => {
    if (q.type === 'mc') {
      if (answers[i] === undefined) {
        allAnswered = false;
        document.getElementById(`q-block-${i}`).style.outline = '2px solid #e05252';
      } else {
        document.getElementById(`q-block-${i}`).style.outline = '';
        if (answers[i] === q.answer) correct++;
      }
    } else {
      const input = document.getElementById(`fib-${i}`);
      const val = input.value.trim();
      if (!val) {
        allAnswered = false;
        document.getElementById(`q-block-${i}`).style.outline = '2px solid #e05252';
      } else {
        document.getElementById(`q-block-${i}`).style.outline = '';
        checkFib(i);
        const normalize = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        const ans = q.answer.toLowerCase();
        const norm = normalize(val);
        if (normalize(val) === normalize(ans) || val.toLowerCase() === ans ||
            (ans === 'cinq' && val === '5') ||
            (ans === 'fort mcmurray' && norm.includes('fort'))) {
          correct++;
        }
        answers[i] = val;
      }
    }
  });

  if (!allAnswered) {
    showToast('⚠️ Réponds à toutes les questions d\'abord !');
    return;
  }

  // Show score
  const scoreText = document.getElementById('ws-score-text');
  scoreText.textContent = `Score : ${correct} / ${total}`;

  // Mark complete
  progress[c.id] = { completed: true, score: correct, total };
  saveProgress();

  // Show completion
  setTimeout(() => {
    document.getElementById('worksheet-phase').classList.remove('active');
    const comp = document.getElementById('completion-screen');
    comp.classList.add('active');
    const pct = Math.round(correct/total*100);
    document.getElementById('comp-score-text').textContent =
      `${correct} / ${total} correctes (${pct}%) — ${pct >= 80 ? '⭐ Excellent !' : pct >= 60 ? '👍 Bon travail !' : '📚 Continue à pratiquer !'}`;
    document.getElementById('modal').scrollTo({ top: 0, behavior: 'smooth' });
  }, 500);
}

/* ══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
renderCases();
