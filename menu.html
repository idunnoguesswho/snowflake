<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowflake Menu</title>
  <style>
    :root{--bg:#f6fbff;--card:#fff;--ink:#1f2937;--muted:#64748b;--accent:#7dd3fc;--accent-dark:#0369a1;--border:#dbeafe;--shadow:0 8px 24px rgba(15,23,42,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#e0f2fe,var(--bg) 45%);color:var(--ink);min-height:100vh;padding:1rem} main{max-width:900px;margin:0 auto} header{text-align:center;margin:1rem 0 1.25rem} h1{margin:0;font-size:clamp(2rem,7vw,3.2rem);color:var(--accent-dark)} .subtitle{color:var(--muted);margin-top:.4rem}.cards{display:grid;gap:1rem}.recipe-card{border:1px solid var(--border);background:var(--card);border-radius:1.25rem;overflow:hidden;box-shadow:var(--shadow)}.card-button{width:100%;border:0;background:transparent;padding:1.1rem;text-align:left;display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:center;cursor:pointer;color:inherit}.date{display:block;font-weight:700;color:var(--accent-dark);font-size:.92rem;margin-bottom:.25rem}.recipe-name{display:block;font-size:1.35rem;font-weight:800;line-height:1.15}.chevron{font-size:1.5rem;color:var(--accent-dark);transition:transform .2s ease}.recipe-card.open .chevron{transform:rotate(90deg)}.details{display:none;border-top:1px solid var(--border);padding:0 1.1rem 1.1rem;color:#334155;line-height:1.5}.recipe-card.open .details{display:block}.details h2{font-size:1rem;margin:1rem 0 .35rem;color:var(--accent-dark)}ul,ol{margin-top:.25rem;padding-left:1.35rem}.empty{display:none;background:#fff;border:1px dashed var(--border);color:var(--muted);text-align:center;padding:2rem;border-radius:1.25rem}.home-link{display:inline-block;margin-top:1.25rem;color:var(--accent-dark);font-weight:700;text-decoration:none}.debug{font-size:.85rem;color:var(--muted);text-align:center;margin:.5rem 0 1rem}
  </style>
</head>
<body>
<main>
<header><h1>Menu</h1><div class="subtitle">Tap a card to see ingredients and instructions.</div><div id="debug" class="debug"></div></header>
<section id="cards" class="cards" aria-live="polite"></section>
<div id="empty" class="empty">No upcoming meals are listed. Add <strong>?showPast=1</strong> to the page URL to view archived meals.</div>
<a class="home-link" href="./">← Back to Snowflake</a>
</main>
<script>
const menuItems=[
{date:"2026-06-07",displayDate:"Sunday, June 7, 2026",name:"Chicken Caesar Wraps",ingredients:["Rotisserie chicken","Tortillas","Salad kit","Cheese","Fruit for serving"],instructions:["Pull chicken apart.","Toss salad.","Fill wraps with chicken, salad, and cheese.","Serve with fruit."]},
{date:"2026-06-08",displayDate:"Monday, June 8, 2026",name:"Taco Rice Bowls",ingredients:["Ground beef","Rice","Taco seasoning","Tomatoes","Cheese","Avocado"],instructions:["Cook rice.","Brown beef.","Add taco seasoning.","Build bowls with toppings."]},
{date:"2026-06-09",displayDate:"Tuesday, June 9, 2026",name:"Creamy Chicken Pasta",ingredients:["Chicken thighs","Pasta","Pasta sauce","Sour cream","Frozen vegetables"],instructions:["Cook pasta.","Cook chicken.","Stir sauce with sour cream.","Add frozen vegetables and heat through."]},
{date:"2026-06-10",displayDate:"Wednesday, June 10, 2026",name:"Snack Plate Dinner",ingredients:["Cheese","Crackers","Fruit","Nuts","Veggies","Yogurt","Bear Paws"],instructions:["Set out snack plate foods.","Use up open fruit, vegetables, cheese, yogurt, and snacks.","Keep it easy for a low-prep dinner night."]},
{date:"2026-06-11",displayDate:"Thursday, June 11, 2026",name:"Leftovers & Salad Night",ingredients:["Remaining salad","Fruit","Wraps","Pasta","Snacks"],instructions:["Pull out remaining food from the week.","Finish salad, wraps, pasta, fruit, and snacks.","Clear space before the next grocery trip."]}
];
function todayLocalDateString(){const now=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Edmonton',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function listMarkup(items,ordered=false){const tag=ordered?'ol':'ul';return `<${tag}>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</${tag}>`;}
function renderMenu(){
 const cards=document.getElementById('cards'), empty=document.getElementById('empty'), debug=document.getElementById('debug');
 const today=todayLocalDateString();
 const showPast=new URLSearchParams(location.search).get('showPast')==='1';
 const sorted=[...menuItems].sort((a,b)=>a.date.localeCompare(b.date));
 const visible=showPast?sorted:sorted.filter(item=>item.date>=today);
 debug.textContent=`Today: ${today} • Showing ${visible.length} meal${visible.length===1?'':'s'}`;
 if(!visible.length){empty.style.display='block';cards.innerHTML='';return;}
 empty.style.display='none';
 cards.innerHTML=visible.map((item,index)=>`<article class="recipe-card"><button class="card-button" type="button" aria-expanded="false" aria-controls="recipe-${index}"><span><span class="date">${esc(item.displayDate)}</span><span class="recipe-name">${esc(item.name)}</span></span><span class="chevron" aria-hidden="true">›</span></button><div id="recipe-${index}" class="details"><h2>Ingredients</h2>${listMarkup(item.ingredients)}<h2>Instructions</h2>${listMarkup(item.instructions,true)}</div></article>`).join('');
 document.querySelectorAll('.recipe-card').forEach(card=>{const button=card.querySelector('button');button.addEventListener('click',()=>{const isOpen=card.classList.toggle('open');button.setAttribute('aria-expanded',String(isOpen));});});
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',renderMenu);}else{renderMenu();}
</script>
</body>
</html>
