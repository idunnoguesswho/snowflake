<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <div class="page-title">🍽️ Weekly Menu <em>*</em></div>
</div>

<div class="filter-bar">
  <span class="filter-label">Type:</span>
  <button class="chip active" data-type="all"       onclick="setType('all')">All</button>
  <button class="chip"        data-type="breakfast" onclick="setType('breakfast')">🌅 Breakfast</button>
  <button class="chip"        data-type="lunch"     onclick="setType('lunch')">🥗 Lunch</button>
  <button class="chip"        data-type="supper"    onclick="setType('supper')">🍽️ Supper</button>
  <button class="chip"        data-type="snack"     onclick="setType('snack')">🍎 Snack</button>
</div>

<div class="status" id="status">Loading menu from sheet…</div>

<div id="menuContainer"></div>

<script>
const SHEET_ID   = '11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY';
const SHEET_NAME = 'Menu';

let ALL_ROWS  = [];  // parsed meal objects
let typeFilter = 'all';

const TODAY = (() => {
  const d = new Date();
  return d.toISOString().slice(0, 10);
})();

/* ── CSV ── */
function parseCSV(raw) {
  const rows = []; let i = 0, n = raw.length;
  while (i < n) {
    const row = [];
    while (i < n && raw[i] !== '\n' && raw[i] !== '\r') {
      if (raw[i] === '"') {
        let c = ''; i++;
        while (i < n) {
          if (raw[i] === '"' && raw[i+1] === '"') { c += '"'; i += 2; }
          else if (raw[i] === '"') { i++; break; }
          else c += raw[i++];
        }
        row.push(c.trim()); if (raw[i] === ',') i++;
      } else {
        let c = '';
        while (i < n && raw[i] !== ',' && raw[i] !== '\n' && raw[i] !== '\r') c += raw[i++];
        row.push(c.trim()); if (raw[i] === ',') i++;
      }
    }
    while (raw[i] === '\n' || raw[i] === '\r') i++;
    if (row.some(c => c)) rows.push(row);
  }
  return rows;
}

/* ── Fetch ── */
async function loadMenu() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const txt = await r.text();
  if (!txt.trim() || txt.trimStart().startsWith('<')) throw new Error('Sheet not public or tab not found');
  return parseCSV(txt);
}

/* ── Parse rows → meal objects ── */
function buildMeals(rows) {
  if (rows.length < 2) return [];
  const h = rows[0].map(x => x.toLowerCase().trim());
  const col = kw => h.findIndex(c => c.includes(kw));

  const iDate  = col('date');
  const iType  = col('meal type') !== -1 ? col('meal type') : col('type');
  const iName  = col('recipe')    !== -1 ? col('recipe')    : (col('name') !== -1 ? col('name') : 2);
  const iIngr  = col('ingredient') !== -1 ? col('ingredient') : 3;
  const iInstr = col('instruction') !== -1 ? col('instruction') : 4;
  const iNotes = col('note') !== -1 ? col('note') : 5;

  const get = (r, i) => (i >= 0 && i < r.length ? r[i] : '').trim();

  return rows.slice(1)
    .map(r => ({
      date:         get(r, iDate),
      mealType:     get(r, iType),
      recipeName:   get(r, iName),
      ingredients:  get(r, iIngr),
      instructions: get(r, iInstr),
      notes:        get(r, iNotes),
    }))
    .filter(m => m.date && m.recipeName)
    .filter(m => m.date >= TODAY)                    // hide past dates
    .sort((a, b) => {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return mealOrder(a.mealType) - mealOrder(b.mealType);
    });
}

const MEAL_ORDER = { breakfast: 0, lunch: 1, 'kids lunch': 1, 'man lunch': 1, 'wife lunch': 1, supper: 2, dinner: 2, snack: 3 };
function mealOrder(t) {
  return MEAL_ORDER[(t || '').toLowerCase()] ?? 4;
}

function mealTypeKey(t) {
  const s = (t || '').toLowerCase();
  if (s.includes('breakfast')) return 'breakfast';
  if (s.includes('lunch'))     return 'lunch';
  if (s.includes('supper') || s.includes('dinner')) return 'supper';
  if (s.includes('snack'))     return 'snack';
  return 'other';
}

const MEAL_EMOJI = { breakfast: '🌅', lunch: '🥗', supper: '🍽️', dinner: '🍽️', snack: '🍎', other: '🍴' };

/* ── Render ── */
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
}

function render() {
  const container = document.getElementById('menuContainer');
  const filtered  = typeFilter === 'all'
    ? ALL_ROWS
    : ALL_ROWS.filter(m => mealTypeKey(m.mealType) === typeFilter);

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">🍽️ No menu items for this view.</div>';
    return;
  }

  // Group by date
  const byDate = {};
  filtered.forEach(m => {
    if (!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });

  container.innerHTML = Object.entries(byDate).map(([date, meals], gi) => {
    const isToday = date === TODAY;
    const label   = isToday ? 'Today' : (date === nextDay(TODAY) ? 'Tomorrow' : '');
    const heading = formatDate(date);
    const cards   = meals.map((m, i) => {
      const key = mealTypeKey(m.mealType);
      const em  = MEAL_EMOJI[key] || MEAL_EMOJI.other;
      return `<div class="meal-card card-${key}" style="animation-delay:${(gi * .1) + (i * .06)}s">
        <div class="meal-type-tag mt-${key}">${em} ${esc(m.mealType)}</div>
        <div class="meal-name">${esc(m.recipeName)}</div>
        ${m.ingredients  ? `<div class="meal-section">Ingredients</div><div class="meal-text">${esc(m.ingredients).replace(/;/g,'·')}</div>` : ''}
        ${m.instructions ? `<div class="meal-section">Instructions</div><div class="meal-text">${esc(m.instructions)}</div>` : ''}
        ${m.notes        ? `<div class="meal-notes">💡 ${esc(m.notes)}</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="date-group">
      <div class="date-heading">
        📅 ${heading}
        ${label ? `<span class="date-badge ${isToday ? 'today' : ''}">${label}</span>` : ''}
      </div>
      <div class="meal-grid">${cards}</div>
    </div>`;
  }).join('');
}

function nextDay(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

/* ── Filters ── */
function setType(t) {
  typeFilter = t;
  document.querySelectorAll('.chip[data-type]').forEach(b => b.classList.toggle('active', b.dataset.type === t));
  render();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Init ── */
(async () => {
  try {
    const rows = await loadMenu();
    ALL_ROWS = buildMeals(rows);
    const dateCount = new Set(ALL_ROWS.map(m => m.date)).size;
    document.getElementById('status').textContent =
      `${ALL_ROWS.length} meals across ${dateCount} day${dateCount !== 1 ? 's' : ''} · past dates hidden`;
    render();
  } catch(e) {
    document.getElementById('status').textContent = 'Could not load menu — check sheet connection.';
    document.getElementById('menuContainer').innerHTML = '<div class="empty">⚠️ Error loading menu data.</div>';
  }
})();
</script>
</body>
</html>
