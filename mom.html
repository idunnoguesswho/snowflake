<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom's Tasks | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-name">Mom</div>
  <div class="hero-sub">Today's Tasks · June 4, 2026</div>
  <div class="hero-badge">🧑‍💼 5 tasks assigned</div>
</div>

<div class="progress-bar-wrap">
  <div class="section-label" style="padding-bottom:6px">Progress</div>
  <div class="progress-label">
    <span id="prog-text">0 of 5 done</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="section-label">📋 Today's Quest List</div>

<div class="task-list" id="taskList"></div>

<div class="toast-wrap" id="toasts"></div>

<script>
const TASKS = [
  {
    id: 6,
    title: "Dentist Appointments",
    category: "Admin",
    estTime: "",
    desc: "Book annual checkup appointments for Oliver and Logan before school ends June 27.",
    dateAssigned: "2026-06-04"
  },
  {
    id: 19,
    title: "NCSO 02 — Health & Safety Program Basics",
    category: "NCSO Study",
    estTime: "15 min",
    desc: "Name the core pieces of a construction health and safety program: policy, roles, hazard control, training, inspections, investigations, emergency response, records, and review.",
    dateAssigned: "2026-06-04"
  },
  {
    id: 23,
    title: "NCSO 06 — Hazard Identification Methods",
    category: "NCSO Study",
    estTime: "15 min",
    desc: "Compare formal inspections, FLHA/JHA, worker observations, incident trends, and pre-job planning as ways to find hazards before work starts.",
    dateAssigned: "2026-06-04"
  },
  {
    id: 25,
    title: "NCSO 08 — Hierarchy of Controls",
    category: "NCSO Study",
    estTime: "15 min",
    desc: "Put controls in order: elimination, substitution, engineering, administrative, PPE. Give one example for falls, silica/dust, and moving equipment.",
    dateAssigned: "2026-06-04"
  },
  {
    id: 32,
    title: "NCSO 15 — WHMIS and SDS",
    category: "NCSO Study",
    estTime: "15 min",
    desc: "Review WHMIS pictograms, labels, and SDS sections. Pick one product and find hazards, PPE, first aid, storage, and spill response.",
    dateAssigned: "2026-06-04"
  }
];

const KEY = 'sf_mom_tasks_2026-06-04';
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}

function save() { localStorage.setItem(KEY, JSON.stringify(done)); }

function updateProgress() {
  const n = Object.keys(done).length;
  const pct = Math.round(n / TASKS.length * 100);
  document.getElementById('prog-text').textContent = `${n} of ${TASKS.length} done`;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width  = pct + '%';
}

function render() {
  document.getElementById('taskList').innerHTML = TASKS.map((t, i) => {
    const isDone = !!done[t.id];
    return `<div class="task-card${isDone ? ' done' : ''}" style="animation-delay:${i * .06}s">
      <div class="task-top">
        <div class="task-title">${t.title}</div>
      </div>
      <div class="task-tags">
        <span class="tag tag-cat">📌 ${t.category}</span>
        ${t.estTime ? `<span class="tag tag-time">⏱ ${t.estTime}</span>` : ''}
        <span class="tag ${isDone ? 'tag-done' : 'tag-open'}">${isDone ? '✓ Done' : '○ Open'}</span>
      </div>
      <div class="task-desc">${t.desc}</div>
      <div class="task-foot">
        <span class="date-hint">📅 Assigned ${t.dateAssigned}</span>
        <button class="complete-btn${isDone ? ' done-btn' : ''}"
          onclick="${isDone ? '' : `complete(${t.id})`}">
          ${isDone ? '✓ Done' : '+ Complete'}
        </button>
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function complete(id) {
  done[id] = true;
  save(); render();
  toast('🎉 Task complete! Great work, Mom!');
}

function toast(msg) {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  c.appendChild(el); setTimeout(() => el.remove(), 3000);
}

render();
</script>
</body>
</html>
