<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet-app">
  <header class="page-header">
    <div>
      <h1 class="page-title">Money</h1>
      <div class="tiny-label">BillLog tab</div>
    </div>
    <div class="header-actions">
      <button class="secondary-button" id="filter-toggle" type="button" aria-expanded="false" aria-controls="control-panel">Show Filters</button>
      <div class="status" id="status" aria-live="polite">Ready</div>
    </div>
  </header>

  <section class="control-panel" id="control-panel" aria-label="Sheet controls" hidden>
    <div class="source-row">
      <label class="field">
        BillLog sheet URL
        <input id="source-input" type="text" spellcheck="false" autocomplete="off" placeholder="money.json, a Google Sheet ID/edit URL, or a published CSV URL">
      </label>
      <label class="field">
        GID
        <input id="gid-input" type="text" inputmode="numeric" placeholder="0">
      </label>
      <label class="field">
        &nbsp;
        <button class="primary-button" id="load-button" type="button">Load BillLog</button>
      </label>
    </div>

    <div class="tool-row">
      <label class="field">
        Search all columns
        <input id="search-input" type="search" placeholder="Type to filter rows">
      </label>
      <label class="field">
        Sort by
        <select id="sort-select"></select>
      </label>
      <label class="field">
        &nbsp;
        <button class="secondary-button" id="reset-button" type="button">Reset Filters</button>
      </label>
    </div>

    <div class="filter-grid" id="filter-grid" aria-label="Column filters"></div>
  </section>

  <section class="data-panel" aria-label="Sheet rows">
    <div class="summary-bar">
      <div class="summary-text" id="summary">BillLog is loading.</div>
      <button class="secondary-button" id="copy-button" type="button">Copy Filtered CSV</button>
    </div>
    <div class="category-summary" aria-label="Money due by category">
      <div class="category-total">
        <div>
          <div class="tiny-label">Money due by category</div>
          <strong id="category-total">$0.00</strong>
        </div>
        <div class="summary-text" id="category-count">No categories yet</div>
      </div>
      <div class="category-bars" id="category-bars"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty" id="table-empty">Load BillLog to begin.</div>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </section>
</main>

<script>
  const DEFAULT_SHEET_URL = "money.json";
  const DEFAULT_SHEET_GID = "1103141659";
  const LIVE_SHEET_URL = "https://docs.google.com/spreadsheets/d/11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY/edit?gid=1103141659#gid=1103141659";
  const STORAGE_KEY = "snowflake-money-viewer";
  const DEFAULT_SOURCE_VERSION = 2;
  const SAMPLE_ROWS = [
    ["Date", "Bill", "Category", "Amount", "Due Date", "Status"],
    ["2026-06-01", "Telus", "Utilities", "100.00", "2026-06-16", "Planned"],
    ["2026-06-02", "Gas", "Transportation", "100.00", "2026-06-16", "Planned"],
    ["2026-06-03", "No Frills", "Food", "100.00", "2026-06-16", "Planned"]
  ];

  const sourceInput = document.getElementById("source-input");
  const gidInput = document.getElementById("gid-input");
  const loadButton = document.getElementById("load-button");
  const searchInput = document.getElementById("search-input");
  const sortSelect = document.getElementById("sort-select");
  const filterToggle = document.getElementById("filter-toggle");
  const controlPanel = document.getElementById("control-panel");
  const resetButton = document.getElementById("reset-button");
  const copyButton = document.getElementById("copy-button");
  const filterGrid = document.getElementById("filter-grid");
  const statusEl = document.getElementById("status");
  const summaryEl = document.getElementById("summary");
  const tableHead = document.getElementById("table-head");
  const tableBody = document.getElementById("table-body");
  const tableEmpty = document.getElementById("table-empty");
  const cardGrid = document.getElementById("card-grid");
  const categoryTotal = document.getElementById("category-total");
  const categoryCount = document.getElementById("category-count");
  const categoryBars = document.getElementById("category-bars");

  let headers = [];
  let rows = [];
  let filters = {};
  let filteredRows = [];
  let displayHeaders = [];
  let categoryColorMap = new Map();
  let activeCategoryFilter = "";

  const CAT_PALETTE = ["#4d96ff","#ff6b6b","#6bcb77","#ffd166","#c9b8ff","#f4a261","#2a9d8f","#e76f51","#7ec8e3","#b56576"];

  function hexLight(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgb(${Math.round(r+(255-r)*.62)},${Math.round(g+(255-g)*.62)},${Math.round(b+(255-b)*.62)})`;
  }

  function toggleCategoryFilter(cat) {
    activeCategoryFilter = activeCategoryFilter === cat ? "" : cat;
    renderCategorySummary();
    applyFilters();
    renderCards();
    summaryEl.textContent = `${filteredRows.length} of ${rows.length} rows with due values shown`;
  }

  function savedSettings() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      source: sourceInput.value.trim(),
      gid: gidInput.value.trim(),
      filtersOpen: !controlPanel.hidden,
      sourceVersion: DEFAULT_SOURCE_VERSION
    }));
  }

  function setFiltersOpen(open) {
    controlPanel.hidden = !open;
    filterToggle.setAttribute("aria-expanded", String(open));
    filterToggle.textContent = open ? "Hide Filters" : "Show Filters";
    saveSettings();
  }

  function defaultSource() {
    return DEFAULT_SHEET_URL;
  }

  function defaultGid() {
    return DEFAULT_SHEET_GID;
  }

  function csvUrlFromInput(source, gid) {
    if (/^https?:\/\//i.test(source)) {
      if (source.includes("/edit")) {
        const id = source.match(/\/spreadsheets\/d\/([^/]+)/)?.[1];
        if (id) return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv${gid ? `&gid=${encodeURIComponent(gid)}` : ""}`;
      }
      return source;
    }

    return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(source)}/export?format=csv${gid ? `&gid=${encodeURIComponent(gid)}` : ""}`;
  }

  function googleSheetParts(source, gid) {
    const match = source.match(/\/spreadsheets\/d\/([^/]+)/);
    const id = match ? match[1] : (/^https?:\/\//i.test(source) ? "" : source);
    const gidMatch = source.match(/[?&#]gid=([^&#]+)/);
    return {
      id: id.trim(),
      gid: (gid || (gidMatch && gidMatch[1]) || DEFAULT_SHEET_GID).trim()
    };
  }

  function isGoogleSheetSource(source) {
    return source.includes("docs.google.com/spreadsheets/");
  }

  function isJsonSource(source) {
    return /\.json(\?.*)?$/i.test(source.trim());
  }

  async function loadJsonRows(source) {
    const response = await fetch(source, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();

    // Accept either [headerRow, ...dataRows] (array-of-arrays) or an array of
    // objects (each object's keys become the headers).
    if (Array.isArray(data) && data.length && Array.isArray(data[0])) {
      return data;
    }
    if (Array.isArray(data) && data.length && typeof data[0] === "object") {
      const head = Object.keys(data[0]);
      const body = data.map((record) => head.map((key) => record[key] ?? ""));
      return [head, ...body];
    }
    throw new Error("Unrecognized JSON shape");
  }

  function loadGoogleSheetRows(source, gid) {
    const parts = googleSheetParts(source, gid);
    if (!parts.id) return Promise.reject(new Error("Missing Google Sheet ID"));

    return new Promise((resolve, reject) => {
      const callbackName = `moneySheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script = document.createElement("script");
      const timeout = window.setTimeout(() => {
        cleanup();
        reject(new Error("Google Sheet did not respond"));
      }, 12000);

      function cleanup() {
        window.clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = (payload) => {
        cleanup();
        if (!payload || payload.status === "error") {
          reject(new Error((payload && payload.errors && payload.errors[0] && payload.errors[0].detailed_message) || "Google Sheet returned an error"));
          return;
        }

        const table = payload.table || {};
        const head = (table.cols || []).map((col, index) => col.label || col.id || `Column ${index + 1}`);
        const body = (table.rows || []).map((row) => (row.c || []).map((cell) => {
          if (!cell) return "";
          return cell.f != null ? String(cell.f) : String(cell.v == null ? "" : cell.v);
        }));
        resolve([head, ...body]);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Could not load Google Sheet"));
      };
      script.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(parts.id)}/gviz/tq?gid=${encodeURIComponent(parts.gid)}&tqx=responseHandler:${callbackName}`;
      document.head.append(script);
    });
  }

  function parseCSV(text) {
    const parsed = [];
    let row = [];
    let cell = "";
    let quoted = false;

    for (let index = 0; index < text.length; index += 1) {
      const char = text[index];
      const next = text[index + 1];

      if (char === '"' && quoted && next === '"') {
        cell += '"';
        index += 1;
      } else if (char === '"') {
        quoted = !quoted;
      } else if (char === "," && !quoted) {
        row.push(cell);
        cell = "";
      } else if ((char === "\n" || char === "\r") && !quoted) {
        if (char === "\r" && next === "\n") index += 1;
        row.push(cell);
        if (row.some((value) => value.trim())) parsed.push(row);
        row = [];
        cell = "";
      } else {
        cell += char;
      }
    }

    row.push(cell);
    if (row.some((value) => value.trim())) parsed.push(row);
    return parsed;
  }

  function normalizeRows(rawRows) {
    const [head = [], ...body] = rawRows;
    headers = head.map((header, index) => header.trim() || `Column ${index + 1}`);
    rows = body.map((row) => {
      const record = {};
      headers.forEach((header, index) => {
        record[header] = (row[index] || "").trim();
      });
      return record;
    });
    displayHeaders = visibleHeaders();
  }

  function findHeader(...candidates) {
    const normalized = headers.map((header) => header.toLowerCase().replace(/[^a-z0-9]/g, ""));
    for (const candidate of candidates) {
      const target = candidate.toLowerCase().replace(/[^a-z0-9]/g, "");
      const index = normalized.findIndex((header) => header === target);
      if (index >= 0) return headers[index];
    }
    for (const candidate of candidates) {
      const target = candidate.toLowerCase().replace(/[^a-z0-9]/g, "");
      const index = normalized.findIndex((header) => header.includes(target));
      if (index >= 0) return headers[index];
    }
    return "";
  }

  function visibleHeaders() {
    const due = dueHeader();
    const dueIndex = due ? headers.indexOf(due) : -1;
    return dueIndex >= 0 ? headers.slice(0, dueIndex + 1) : [...headers];
  }

  function dueHeader() {
    return findHeader("Due Date", "Date Due", "Due On", "Payment Date");
  }

  function moneyValue(value) {
    const numeric = String(value || "").replace(/[^0-9.-]/g, "");
    const amount = Number(numeric);
    return Number.isFinite(amount) ? amount : 0;
  }

  function moneyFormat(value) {
    return new Intl.NumberFormat("en-CA", {
      style: "currency",
      currency: "CAD"
    }).format(value);
  }

  function parseDueDate(value) {
    const text = String(value || "").trim();
    if (!text) return null;

    const isoMatch = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (isoMatch) {
      return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));
    }

    const slashMatch = text.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
    if (slashMatch) {
      const first = Number(slashMatch[1]);
      const second = Number(slashMatch[2]);
      const rawYear = Number(slashMatch[3]);
      const year = rawYear < 100 ? 2000 + rawYear : rawYear;
      return new Date(year, first > 12 ? second - 1 : first - 1, first > 12 ? first : second);
    }

    const parsed = new Date(text);
    return Number.isNaN(parsed.getTime()) ? null : new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  }

  function dueClass(value) {
    const dueDate = parseDueDate(value);
    if (!dueDate) return "";

    const today = new Date();
    const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const daysUntilDue = Math.floor((dueDate - startOfToday) / 86400000);

    if (daysUntilDue < 0) return "due-overdue";
    if (daysUntilDue <= 14) return "due-soon";
    return "due-later";
  }

  async function loadSheet() {
    const source = sourceInput.value.trim();
    const gid = gidInput.value.trim();
    if (!source) {
      normalizeRows(SAMPLE_ROWS);
      statusEl.textContent = "Showing sample data";
      statusEl.className = "status";
      buildControls();
      render();
      return;
    }

    loadButton.disabled = true;
    statusEl.textContent = "Loading...";
    statusEl.className = "status";

    try {
      const rawRows = isJsonSource(source)
        ? await loadJsonRows(source)
        : isGoogleSheetSource(source)
          ? await loadGoogleSheetRows(source, gid)
          : await loadCsvRows(source, gid);
      if (rawRows.length < 2) throw new Error("No data rows found");

      normalizeRows(rawRows);
      saveSettings();
      statusEl.textContent = "Connected";
      statusEl.className = "status ok";
      buildControls();
      render();
    } catch (error) {
      normalizeRows(SAMPLE_ROWS);
      statusEl.textContent = `Sheet unavailable: ${error.message}. Showing sample data.`;
      statusEl.className = "status error";
      buildControls();
      render();
    } finally {
      loadButton.disabled = false;
    }
  }

  async function loadCsvRows(source, gid) {
    const response = await fetch(csvUrlFromInput(source, gid), { cache: "no-store", redirect: "follow" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return parseCSV(await response.text());
  }

  function buildControls() {
    filters = {};
    filterGrid.innerHTML = "";
    sortSelect.innerHTML = '<option value="">Original order</option>';

    displayHeaders = visibleHeaders();
    displayHeaders.forEach((header) => {
      const option = document.createElement("option");
      option.value = header;
      option.textContent = header;
      sortSelect.append(option);

      const uniqueValues = [...new Set(rows.map((row) => row[header]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      if (!uniqueValues.length || uniqueValues.length > 80) return;

      const label = document.createElement("label");
      label.className = "field";
      label.textContent = header;

      const select = document.createElement("select");
      select.dataset.header = header;
      select.innerHTML = '<option value="">All</option>';
      uniqueValues.forEach((value) => {
        const item = document.createElement("option");
        item.value = value;
        item.textContent = value;
        select.append(item);
      });
      select.addEventListener("change", () => {
        filters[header] = select.value;
        render();
      });

      label.append(select);
      filterGrid.append(label);
    });
  }

  function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();
    const due = dueHeader();
    const categoryHeader = findHeader("Category", "Type");
    filteredRows = rows.filter((row) => {
      const hasDueValue = !due || Boolean(String(row[due] || "").trim());
      const matchesSearch = !query || displayHeaders.some((header) => row[header].toLowerCase().includes(query));
      const matchesFilters = Object.entries(filters).every(([header, value]) => !value || row[header] === value);
      const matchesCategory = !activeCategoryFilter || (categoryHeader && row[categoryHeader] === activeCategoryFilter);
      return hasDueValue && matchesSearch && matchesFilters && matchesCategory;
    });

    const sortHeader = sortSelect.value;
    if (sortHeader) {
      filteredRows.sort((a, b) => a[sortHeader].localeCompare(b[sortHeader], undefined, { numeric: true, sensitivity: "base" }));
    }
  }

  function render() {
    applyFilters();
    renderCategorySummary();
    renderTable();
    renderCards();
    summaryEl.textContent = `${filteredRows.length} of ${rows.length} rows with due values shown`;
  }

  function renderCategorySummary() {
    const categoryHeader = findHeader("Category", "Type");
    const amountHeader = findHeader("Amount", "Total", "Cost", "Payment");
    const statusHeader = findHeader("Status");

    // Build per-category paid/due totals using ALL rows (not just filtered)
    const catMap = new Map();
    rows.forEach((row) => {
      const cat = (categoryHeader && row[categoryHeader]) || "Uncategorized";
      const amount = moneyValue(amountHeader && row[amountHeader]);
      if (!amount) return;
      if (!catMap.has(cat)) catMap.set(cat, { paid: 0, due: 0 });
      const entry = catMap.get(cat);
      const status = (statusHeader && row[statusHeader] || "").toLowerCase();
      if (status === "paid") entry.paid += amount;
      else entry.due += amount;
    });

    const entries = [...catMap.entries()].sort((a, b) => (b[1].paid + b[1].due) - (a[1].paid + a[1].due));
    const grandDue = entries.reduce((s, [, v]) => s + v.due, 0);
    const grandPaid = entries.reduce((s, [, v]) => s + v.paid, 0);
    const grandTotal = grandDue + grandPaid;
    const maxTotal = entries[0] ? (entries[0][1].paid + entries[0][1].due) : 0;

    // Assign unique hex colors
    categoryColorMap = new Map(entries.map(([cat], i) => [cat, CAT_PALETTE[i % CAT_PALETTE.length]]));

    categoryTotal.textContent = moneyFormat(grandTotal);
    categoryCount.textContent = entries.length
      ? `${entries.length} categor${entries.length === 1 ? "y" : "ies"}`
      : "No categories yet";
    categoryBars.innerHTML = "";

    if (!entries.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = amountHeader ? "No amounts in the current rows." : "No amount column found.";
      categoryBars.append(empty);
      return;
    }

    // Column header row
    const hdr = document.createElement("div");
    hdr.style.cssText = "display:grid;grid-template-columns:140px 1fr 72px 72px 72px;gap:6px;align-items:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#999;padding:0 8px 6px;";
    hdr.innerHTML = "<span></span><span></span><span style='text-align:right'>Due</span><span style='text-align:right'>Paid</span><span style='text-align:right'>Total</span>";
    categoryBars.append(hdr);

    entries.forEach(([cat, vals]) => {
      const col = categoryColorMap.get(cat);
      const colLight = hexLight(col);
      const total = vals.paid + vals.due;
      const paidPct = total ? (vals.paid / maxTotal * 100) : 0;
      const duePct  = total ? (vals.due  / maxTotal * 100) : 0;
      const isActive = activeCategoryFilter === cat;

      const row = document.createElement("div");
      row.style.cssText = `display:grid;grid-template-columns:140px 1fr 72px 72px 72px;gap:6px;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s;border:2px solid ${isActive ? col : 'transparent'};background:${isActive ? col+'11' : 'transparent'}`;
      row.onclick = () => toggleCategoryFilter(cat);

      const nameEl = document.createElement("div");
      nameEl.style.cssText = `font-size:12px;font-weight:700;color:${col};overflow:hidden;text-overflow:ellipsis;white-space:nowrap`;
      nameEl.title = cat;
      nameEl.textContent = cat;

      const barWrap = document.createElement("div");
      barWrap.style.cssText = "height:10px;border-radius:5px;overflow:hidden;background:#f0f0f0;display:flex;";
      const barPaid = document.createElement("div");
      barPaid.style.cssText = `height:100%;width:${paidPct.toFixed(1)}%;background:${col};flex-shrink:0`;
      barPaid.title = `Paid: ${moneyFormat(vals.paid)}`;
      const barDue = document.createElement("div");
      barDue.style.cssText = `height:100%;width:${duePct.toFixed(1)}%;background:${colLight};flex-shrink:0`;
      barDue.title = `Due: ${moneyFormat(vals.due)}`;
      barWrap.append(barPaid, barDue);

      const dueEl  = document.createElement("div");
      dueEl.style.cssText  = "font-size:11px;font-weight:700;text-align:right;color:#555";
      dueEl.textContent  = vals.due  ? moneyFormat(vals.due)  : "—";
      const paidEl = document.createElement("div");
      paidEl.style.cssText = "font-size:11px;font-weight:700;text-align:right;color:#555";
      paidEl.textContent = vals.paid ? moneyFormat(vals.paid) : "—";
      const totEl  = document.createElement("div");
      totEl.style.cssText  = `font-size:11px;font-weight:900;text-align:right;color:${col}`;
      totEl.textContent  = moneyFormat(total);

      row.append(nameEl, barWrap, dueEl, paidEl, totEl);
      categoryBars.append(row);
    });

    // Grand totals footer
    const footer = document.createElement("div");
    footer.style.cssText = "display:grid;grid-template-columns:140px 1fr 72px 72px 72px;gap:6px;align-items:center;padding:6px 8px 2px;border-top:1px solid #eee;margin-top:4px;";
    footer.innerHTML = `<span style="font-size:11px;font-weight:900;color:#333">Total</span><span></span><span style="font-size:11px;font-weight:900;text-align:right;color:#555">${moneyFormat(grandDue)}</span><span style="font-size:11px;font-weight:900;text-align:right;color:#555">${moneyFormat(grandPaid)}</span><span style="font-size:11px;font-weight:900;text-align:right;color:#333">${moneyFormat(grandTotal)}</span>`;
    categoryBars.append(footer);
  }

  function renderTable() {
    tableHead.innerHTML = "";
    tableBody.innerHTML = "";
    tableEmpty.style.display = filteredRows.length ? "none" : "block";

    const headRow = document.createElement("tr");
    displayHeaders.forEach((header) => {
      const th = document.createElement("th");
      th.textContent = header;
      headRow.append(th);
    });
    tableHead.append(headRow);

    filteredRows.forEach((row) => {
      const tr = document.createElement("tr");
      displayHeaders.forEach((header) => {
        const td = document.createElement("td");
        td.textContent = row[header];
        tr.append(td);
      });
      tableBody.append(tr);
    });
  }

  function renderCards() {
    cardGrid.innerHTML = "";
    if (!filteredRows.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No matching rows.";
      cardGrid.append(empty);
      return;
    }

    filteredRows.forEach((row, index) => {
      const billHeader = findHeader("Bill");
      const categoryHeader = findHeader("Category", "Type");
      const amountHeader = findHeader("Due", "Amount Due", "Due Amount", "Amount", "Total", "Cost", "Payment");
      const dueDateHeader = findHeader("Due Date", "Date Due", "Due On", "Payment Date");
      const card = document.createElement("article");
      card.className = `row-card ${dueClass(dueDateHeader && row[dueDateHeader])}`.trim();
      const category = (categoryHeader && row[categoryHeader]) || "Uncategorized";
      card.style.borderBottomColor = categoryColorMap.get(category) || "var(--border)";

      const title = document.createElement("h2");
      title.textContent = (billHeader && row[billHeader]) || `Bill ${index + 1}`;
      card.append(title);

      const meta = document.createElement("div");
      meta.className = "bill-card-meta";

      [
        ["Category", categoryHeader, categoryHeader && row[categoryHeader]],
        ["Amount", amountHeader, amountHeader && moneyFormat(moneyValue(row[amountHeader]))],
        ["Due Date", dueDateHeader, dueDateHeader && row[dueDateHeader]]
      ].forEach(([labelText, header, value]) => {
        if (!header || !value) return;
        const field = document.createElement("div");
        field.className = "card-field";
        const strong = document.createElement("strong");
        strong.textContent = labelText;
        const span = document.createElement("span");
        span.textContent = value;
        field.append(strong, span);
        meta.append(field);
      });

      card.append(meta);
      cardGrid.append(card);
    });
  }

  function toCSV(valueRows) {
    const escapeCell = (value) => {
      const text = String(value || "");
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    };

    return [
      displayHeaders.map(escapeCell).join(","),
      ...valueRows.map((row) => displayHeaders.map((header) => escapeCell(row[header])).join(","))
    ].join("\n");
  }

  async function copyFilteredCSV() {
    if (!filteredRows.length) return;
    await navigator.clipboard.writeText(toCSV(filteredRows));
    statusEl.textContent = "Filtered CSV copied";
    statusEl.className = "status ok";
  }

  function resetFilters() {
    searchInput.value = "";
    sortSelect.value = "";
    filters = {};
    activeCategoryFilter = "";
    filterGrid.querySelectorAll("select").forEach((select) => {
      select.value = "";
    });
    render();
  }

  function init() {
    const saved = savedSettings();
    const isStale = (saved.sourceVersion || 0) < DEFAULT_SOURCE_VERSION;
    sourceInput.value = (!isStale && saved.source) || defaultSource();
    gidInput.value = (!isStale && saved.gid) || defaultGid();
    setFiltersOpen(Boolean(saved.filtersOpen));

    filterToggle.addEventListener("click", () => setFiltersOpen(controlPanel.hidden));
    loadButton.addEventListener("click", loadSheet);
    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);
    resetButton.addEventListener("click", resetFilters);
    copyButton.addEventListener("click", copyFilteredCSV);

    loadSheet();
  }

  init();
</script>
</body>
</html>
