<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver's Tasks | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:   #7ec8e3;
    --accent2:  #4aa8cc;
    --bg:       #fff8ee;
    --card:     #ffffff;
    --text:     #2d2a4a;
    --muted:    #8a87a5;
    --border:   #ede8f5;
    --shadow:   0 4px 20px rgba(45,42,74,.09);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Nunito", sans-serif; background: var(--bg); color: var(--text); overflow-y: auto; }

  .hero {
    background: linear-gradient(135deg, #7ec8e3 0%, #4aa8cc 100%);
    padding: 24px 20px 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '🧒';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 4rem;
    opacity: .25;
  }
  .hero-name {
    font-family: "Baloo 2", cursive;
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
    color: var(--text);
  }
  .hero-sub {
    font-size: .82rem;
    font-weight: 700;
    color: var(--text);
    opacity: .75;
  }
  .hero-badge {
    display: inline-block;
    margin-top: 10px;
    background: rgba(255,255,255,.35);
    border: 1.5px solid rgba(255,255,255,.55);
    border-radius: 50px;
    padding: 4px 14px;
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .4px;
    color: var(--text);
  }

  .section-label {
    font-size: .7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    padding: 18px 18px 10px;
  }

  .task-list { padding: 0 16px 32px; display: flex; flex-direction: column; gap: 12px; }

  .task-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    border-left: 5px solid var(--accent);
    transition: transform .18s, box-shadow .18s;
    animation: pop .28s ease both;
  }
  .task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,42,74,.13); }
  .task-card.done { opacity: .55; border-left-color: var(--muted); }
  .task-card.done .task-title { text-decoration: line-through; color: var(--muted); }

  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }

  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .task-title { font-weight: 800; font-size: .95rem; line-height: 1.3; flex: 1; }

  .task-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: .65rem; padding: 2px 8px; border-radius: 99px; font-weight: 800; }
  .tag-cat   { background: #7ec8e344; color: #1a607a; border: 1px solid #7ec8e3; }
  .tag-time  { background: #ffd16633; color: #7a5500; border: 1px solid #ffd166; }
  .tag-open  { background: #ffd16633; color: #7a5500; border: 1px solid #ffd166; }
  .tag-done  { background: #6bcb7733; color: #2a6b35; border: 1px solid #6bcb77; }

  .task-desc { font-size: .8rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .task-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1.5px solid var(--border); }
  .date-hint { font-size: .68rem; color: var(--muted); font-weight: 600; }

  .complete-btn {
    padding: 5px 14px; border-radius: 50px;
    border: 1.5px solid var(--accent2);
    background: transparent; color: var(--accent2);
    font-family: "Nunito", sans-serif; font-size: .75rem; font-weight: 800;
    cursor: pointer; transition: all .18s;
  }
  .complete-btn:hover { background: var(--accent2); color: #fff; }
  .done-btn { border-color: var(--muted) !important; color: var(--muted) !important; cursor: default !important; }
  .done-btn:hover { background: transparent !important; }

  .progress-bar-wrap { padding: 0 16px 6px; }
  .progress-label { font-size: .72rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .progress-track { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill  { height: 100%; background: linear-gradient(90deg, #7ec8e3, #4aa8cc); border-radius: 99px; transition: width .5s ease; }

  .toast-wrap { position: fixed; bottom: 16px; right: 16px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: .84rem; font-weight: 700; box-shadow: 0 4px 18px rgba(0,0,0,.25); animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-name">Oliver</div>
  <div class="hero-sub" id="hero-sub">Today's Tasks · June 6, 2026</div>
  <div class="hero-badge" id="hero-badge">🧒 Loading…</div>
</div>

<div class="progress-bar-wrap">
  <div class="section-label" style="padding-bottom:6px">Progress</div>
  <div class="progress-label">
    <span id="prog-text">— of — done</span>
    <span id="prog-pct">—%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="section-label">📋 Open Tasks</div>

<div class="task-list" id="taskList"><div style="padding:20px;text-align:center;color:var(--muted);font-weight:700;">Loading from sheet…</div></div>

<div class="toast-wrap" id="toasts"></div>

<script>
const SHEET_ID  = '11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY';
const SHEET_GID = '553696854';
const PERSON    = 'Oliver';
const TODAY_KEY = new Date().toISOString().slice(0,10);
const STORE_KEY = `sf_oliver_done_${TODAY_KEY}`;

let TASKS = [];
let done  = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) {}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(done)); }

/* ── CSV parser ── */
function parseCSV(raw) {
  const rows = []; let i = 0, n = raw.length;
  while (i < n) {
    const row = [];
    while (i < n && raw[i] !== '\n' && raw[i] !== '\r') {
      if (raw[i] === '"') {
        let c = ''; i++;
        while (i < n) {
          if (raw[i] === '"' && raw[i+1] === '"') { c += '"'; i += 2; }
          else if (raw[i] === '"') { i++; break; }
          else c += raw[i++];
        }
        row.push(c.trim()); if (raw[i] === ',') i++;
      } else {
        let c = '';
        while (i < n && raw[i] !== ',' && raw[i] !== '\n' && raw[i] !== '\r') c += raw[i++];
        row.push(c.trim()); if (raw[i] === ',') i++;
      }
    }
    while (raw[i] === '\n' || raw[i] === '\r') i++;
    if (row.some(c => c)) rows.push(row);
  }
  return rows;
}

/* ── Fetch sheet ── */
async function loadSheet() {
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
  try {
    const r = await fetch(csvUrl, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const txt = await r.text();
    if (!txt.trim()) throw new Error('Empty');
    return parseCSV(txt);
  } catch {
    return await loadGviz();
  }
}

function loadGviz() {
  return new Promise((resolve, reject) => {
    const cb = `_sf_cb_${Date.now()}`;
    const s = document.createElement('script');
    const t = setTimeout(() => { s.remove(); delete window[cb]; reject(new Error('timeout')); }, 12000);
    window[cb] = p => {
      clearTimeout(t); s.remove(); delete window[cb];
      if (!p || p.status === 'error') { reject(new Error('gviz error')); return; }
      const hdrs = (p.table.cols||[]).map((c,i) => c.label || `Col${i}`);
      const rows = (p.table.rows||[]).map(r => (r.c||[]).map(cell => cell ? (cell.f != null ? String(cell.f) : String(cell.v ?? '')) : ''));
      resolve([hdrs, ...rows]);
    };
    s.onerror = () => { clearTimeout(t); s.remove(); reject(new Error('script error')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=responseHandler:${cb}`;
    document.head.append(s);
  });
}

/* ── Build task list ── */
const YES = new Set(['yes','true','1','true','✓','✅']);
function isOpen(row, iDone, iCompleted) {
  const done  = (row[iDone]     || '').toLowerCase().trim();
  const comp  = (row[iCompleted]|| '').trim();
  if (YES.has(done)) return false;
  if (comp && /\d{4}/.test(comp)) return false;
  return true;
}

function buildTasks(rows) {
  if (rows.length < 2) return [];
  const h = rows[0].map(x => x.toLowerCase().trim());
  // Cols: ID, Date Added, Responsible, Category/Side Quest, Est Time, Task Name, Description, YouTube Link, Worksheet, Date assigned, Date Completed, IsDone, Points
  const col = kw => h.findIndex(c => c.includes(kw));
  const iResp  = col('responsible') !== -1 ? col('responsible') : 2;
  const iCat   = col('side quest')  !== -1 ? col('side quest')  : (col('category') !== -1 ? col('category') : 3);
  const iEst   = col('est')         !== -1 ? col('est')         : 4;
  const iTitle = col('task name')   !== -1 ? col('task name')   : 5;
  const iDesc  = col('description') !== -1 ? col('description') : 6;
  const iDate  = col('date assigned')      !== -1 ? col('date assigned')  : 9;
  const iComp  = col('date completed')     !== -1 ? col('date completed') : 10;
  const iDone  = col('isdone')             !== -1 ? col('isdone')         : 11;
  const iPts   = col('points')             !== -1 ? col('points')         : 12;

  const today  = new Date().toISOString().slice(0, 10);
  const get    = (r, i) => (i >= 0 && i < r.length ? r[i] : '').trim();

  return rows.slice(1)
    .filter(r => get(r, iResp) === PERSON && isOpen(r, iDone, iComp))
    .map((r, idx) => ({
      id:       get(r, 0) || String(idx),
      title:    get(r, iTitle),
      category: get(r, iCat),
      estTime:  get(r, iEst),
      desc:     get(r, iDesc),
      dateAssigned: get(r, iDate),
      pts:      parseInt(get(r, iPts)) || 0,
      priority: get(r, iDate) ? (get(r, iDate) <= today ? 1 : 2) : 3
    }))
    .filter(t => t.title)
    .sort((a, b) => a.priority - b.priority || (a.dateAssigned || '').localeCompare(b.dateAssigned || ''));
}

/* ── Render ── */
function updateProgress() {
  const total = TASKS.length;
  const n     = Object.keys(done).length;
  const pct   = total ? Math.round(n / total * 100) : 0;
  document.getElementById('prog-text').textContent = `${n} of ${total} done`;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('hero-badge').textContent = `🧒 ${total} tasks assigned`;
}

function render() {
  const list = document.getElementById('taskList');
  if (!TASKS.length) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);font-weight:700;">🎉 No open tasks!</div>';
    updateProgress(); return;
  }
  list.innerHTML = TASKS.map((t, i) => {
    const isDone = !!done[t.id];
    const dateLabel = t.dateAssigned ? `📅 ${t.dateAssigned}` : '';
    return `<div class="task-card${isDone ? ' done' : ''}" style="animation-delay:${i * .04}s">
      <div class="task-top"><div class="task-title">${esc(t.title)}</div></div>
      <div class="task-tags">
        ${t.category ? `<span class="tag tag-cat">📌 ${esc(t.category)}</span>` : ''}
        ${t.estTime  ? `<span class="tag tag-time">⏱ ${esc(t.estTime)}</span>` : ''}
        <span class="tag ${isDone ? 'tag-done' : 'tag-open'}">${isDone ? '✓ Done' : '○ Open'}</span>
      </div>
      ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
      <div class="task-foot">
        <span class="date-hint">${dateLabel}</span>
        <button class="complete-btn${isDone ? ' done-btn' : ''}"
          onclick="${isDone ? '' : `complete(${JSON.stringify(t.id)})`}">
          ${isDone ? '✓ Done' : '+ Complete'}
        </button>
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function complete(id) {
  done[id] = true;
  save(); render();
  toast('⭐ Awesome work, Oliver!');
}

function toast(msg) {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  c.appendChild(el); setTimeout(() => el.remove(), 3000);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Init ── */
(async () => {
  try {
    const rows = await loadSheet();
    TASKS = buildTasks(rows);
    render();
  } catch(e) {
    document.getElementById('taskList').innerHTML =
      `<div style="padding:20px;text-align:center;color:var(--muted);font-weight:700;">Could not load sheet — check connection.</div>`;
    document.getElementById('hero-badge').textContent = '🧒 Offline';
  }
})();
</script>
</body>
</html>
