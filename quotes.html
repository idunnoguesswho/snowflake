<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quotes</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <div class="page-title">Daily Quotes <em>*</em></div>
  <div class="page-subtitle" id="page-date"></div>
</div>

<div id="quotes-container">
  <div class="section" style="text-align:center;padding:2rem;color:var(--muted);">Loading quotes…</div>
</div>

<div class="sources" id="sources-footer" style="display:none;">
  <strong>Source</strong>
  <a href="https://docs.google.com/spreadsheets/d/11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY/edit?gid=575264347" target="_blank">Daily Quotes — Google Sheet</a>
</div>

<script>
const SHEET_ID = "11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY";
const SHEET_GID = "575264347";
const SECTION_CLASSES = ["s-stoic", "s-aa", "s-bible", "s-word", "s-history", "s-brit"];

function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function formatDisplayDate(isoDate) {
  const d = new Date(isoDate + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

function normalizeDate(cellValue, cellFormatted) {
  // gviz returns dates as "Date(year,month0,day)" in cell.v, or formatted string in cell.f
  if (cellValue && typeof cellValue === "string" && cellValue.startsWith("Date(")) {
    const parts = cellValue.replace("Date(", "").replace(")", "").split(",").map(Number);
    const pad = n => String(n).padStart(2, "0");
    return `${parts[0]}-${pad(parts[1] + 1)}-${pad(parts[2])}`;
  }
  // Try formatted string like "6/12/2026" or "2026-06-12"
  if (cellFormatted) {
    const iso = cellFormatted.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (iso) return cellFormatted.trim();
    const slash = cellFormatted.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (slash) {
      const pad = n => String(n).padStart(2, "0");
      return `${slash[3]}-${pad(slash[1])}-${pad(slash[2])}`;
    }
  }
  if (cellValue && typeof cellValue === "string") return cellValue.trim().substring(0, 10);
  return "";
}

function loadSheetRows() {
  return new Promise((resolve, reject) => {
    const cb = `quotesCallback_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("Timed out")); }, 12000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }

    window[cb] = (payload) => {
      cleanup();
      if (!payload || payload.status === "error") {
        const msg = payload && payload.errors && payload.errors[0] && payload.errors[0].detailed_message;
        reject(new Error(msg || "Sheet returned an error"));
        return;
      }
      const cols = (payload.table.cols || []).map(c => (c.label || c.id || "").trim().toLowerCase());
      const rows = (payload.table.rows || []).map(r =>
        (r.c || []).map(cell => cell ? { v: cell.v == null ? "" : String(cell.v), f: cell.f != null ? String(cell.f) : null } : { v: "", f: null })
      );
      resolve({ cols, rows });
    };

    script.onerror = () => { cleanup(); reject(new Error("Could not load sheet")); };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=responseHandler:${cb}`;
    document.head.append(script);
  });
}

function renderQuotes(quotes) {
  const container = document.getElementById("quotes-container");
  if (!quotes.length) {
    container.innerHTML = '<div class="section" style="text-align:center;padding:2rem;color:var(--muted);">No quotes found for today.</div>';
    return;
  }
  container.innerHTML = quotes.map((q, i) => {
    const cls = SECTION_CLASSES[i % SECTION_CLASSES.length];
    return `<div class="section ${cls}">
      <div class="section-label">${escHtml(q.source)}</div>
      <div class="section-body">${q.description}</div>
    </div>`;
  }).join("\n");
  document.getElementById("sources-footer").style.display = "";
}

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function showError(msg) {
  document.getElementById("quotes-container").innerHTML =
    `<div class="section" style="text-align:center;padding:2rem;color:var(--muted);">${msg}</div>`;
}

async function init() {
  const today = todayISO();
  document.getElementById("page-date").textContent = formatDisplayDate(today);
  document.title = "Daily Quotes — " + formatDisplayDate(today);

  try {
    const { cols, rows } = await loadSheetRows();
    const dateIdx = cols.indexOf("date");
    const sourceIdx = cols.indexOf("source");
    const descIdx = cols.indexOf("description");

    if (dateIdx < 0 || sourceIdx < 0 || descIdx < 0) {
      throw new Error(`Expected columns Date, Source, Description — found: ${cols.join(", ")}`);
    }

    const todayQuotes = rows
      .filter(row => normalizeDate(row[dateIdx].v, row[dateIdx].f) === today)
      .map(row => ({
        source: (row[sourceIdx].f || row[sourceIdx].v || "").trim(),
        description: (row[descIdx].f || row[descIdx].v || "").trim()
      }))
      .filter(q => q.description);

    renderQuotes(todayQuotes);
  } catch (err) {
    showError("Could not load quotes: " + err.message);
  }
}

init();
</script>
</body>
</html>
