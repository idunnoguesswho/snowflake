<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quotes</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ── Spinner / error ──────────────────────────────────────────── */
.loading-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 3rem 1rem; gap: 14px; color: var(--muted);
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--line, #d8dee6);
  border-top-color: var(--lavender, #c9b8ff);
  border-radius: 50%; animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; padding: 2.5rem 1rem;
  color: var(--rose, #c35465); text-align: center;
}
.error-icon { font-size: 2rem; }
.error-msg  { font-size: .9rem; font-weight: 700; max-width: 360px; line-height: 1.55; }
.retry-btn  {
  margin-top: 6px; padding: 8px 20px; border-radius: 50px; border: 0;
  background: var(--lavender, #c9b8ff); color: #3d2f7f;
  font-family: inherit; font-size: .85rem; font-weight: 800; cursor: pointer;
}
.retry-btn:hover { opacity: .85; }

/* ── Date nav row ─────────────────────────────────────────────── */
.date-nav {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; flex-wrap: wrap;
}
.nav-btn {
  background: none; border: 2px solid var(--line, #d8dee6);
  border-radius: 50%; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; cursor: pointer; color: var(--ink, #1f2933);
  transition: background .15s, border-color .15s;
  flex-shrink: 0;
}
.nav-btn:hover { background: var(--lavender, #c9b8ff); border-color: var(--lavender, #c9b8ff); color: #3d2f7f; }
.nav-btn:disabled { opacity: .3; cursor: default; }
.nav-btn#refresh-btn { font-size: 1.05rem; }
.nav-btn#refresh-btn.spinning { animation: spin .75s linear infinite; }

.refresh-status {
  text-align: center; font-size: .75rem; font-weight: 700;
  color: var(--muted, #667085); min-height: 16px; margin: 2px 0 0;
  opacity: 0; transition: opacity .3s;
}
.refresh-status.show { opacity: 1; }
.refresh-status.error { color: var(--rose, #c35465); }

/* ── Calendar ─────────────────────────────────────────────────── */
.cal-toggle {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer;
  font-family: 'Baloo 2', cursive; font-size: .9rem; font-weight: 700;
  color: var(--muted, #667085); padding: 6px 0; margin: 0 0 8px;
  width: 100%;
}
.cal-toggle .cal-arrow { font-size: .7rem; transition: transform .2s; }
.cal-toggle.open .cal-arrow { transform: rotate(90deg); }

.cal-wrap {
  background: var(--card, #fff);
  border-radius: 18px;
  padding: 16px 18px 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.06);
}
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-month-label {
  font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800;
  color: var(--ink, #1f2933);
}
.cal-nav {
  background: none; border: none; cursor: pointer;
  font-size: 1rem; color: var(--muted, #667085); padding: 4px 8px;
  border-radius: 8px; transition: background .15s;
}
.cal-nav:hover { background: var(--bg, #f8fafc); color: var(--ink, #1f2933); }

.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-dow {
  text-align: center; font-size: .72rem; font-weight: 800;
  color: var(--muted, #667085); padding: 4px 0; letter-spacing: .03em;
}
.cal-day {
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 2px 4px; border-radius: 10px; cursor: pointer;
  transition: background .15s; position: relative; min-height: 38px;
}
.cal-day:hover:not(.cal-day--empty):not(.cal-day--future) {
  background: #f0ecff;
}
.cal-day--empty { visibility: hidden; cursor: default; }
.cal-day--future { opacity: .3; cursor: default; pointer-events: none; }
.cal-day--today {
  background: var(--lavender, #c9b8ff);
}
.cal-day--today .cal-day-num { color: #3d2f7f; }
.cal-day--selected:not(.cal-day--today) {
  background: #e8e3ff; border: 2px solid var(--lavender, #c9b8ff);
}
.cal-day-num {
  font-size: .82rem; font-weight: 700; color: var(--ink, #1f2933); line-height: 1;
}
.cal-day--today .cal-day-num { font-weight: 900; }
.cal-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #7B68EE; margin-top: 3px;
  display: block;
}

/* ── Quote sections ───────────────────────────────────────────── */
.section {
  background: var(--card, #fff); border-radius: 20px;
  padding: 22px 26px; margin-bottom: 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,.06);
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
.section-label {
  font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 800;
  margin-bottom: 10px; line-height: 1.2;
}
.section-body {
  font-size: .95rem; line-height: 1.75;
  color: var(--ink, #1f2933); white-space: pre-wrap;
}

.s-stoic   { border-top: 4px solid #2D2A4A; }
.s-stoic   .section-label { color: #2D2A4A; }
.s-aa      { border-top: 4px solid #A8EDCA; }
.s-aa      .section-label { color: #148F77; }
.s-bible   { border-top: 4px solid #6BCB77; }
.s-bible   .section-label { color: #1E8449; }
.s-word    { border-top: 4px solid #7EC8E3; }
.s-word    .section-label { color: #2E86C1; }
.s-history { border-top: 4px solid #FFB347; }
.s-history .section-label { color: #D35400; }
.s-brit    { border-top: 4px solid #C9B8FF; }
.s-brit    .section-label { color: #7B68EE; }
.s-rca     { border-top: 4px solid #FF6B6B; }
.s-rca     .section-label { color: #c0392b; }
.s-prayer  { border-top: 4px solid #FFD166; }
.s-prayer  .section-label { color: #b8860b; }
.s-default { border-top: 4px solid var(--lavender, #c9b8ff); }
.s-default .section-label { color: #7B68EE; }

.no-quotes {
  text-align: center; padding: 2.5rem 1rem;
  color: var(--muted); font-weight: 700; font-size: .95rem;
}

.sources {
  margin-top: 28px; padding: 14px 18px;
  background: #F8F5FF; border-radius: 14px;
  font-size: .8rem; color: var(--muted, #667085); font-weight: 600;
}
.sources strong {
  color: var(--ink, #1f2933); display: block; margin-bottom: 6px;
  font-family: 'Baloo 2', cursive; font-size: .9rem;
}
.sources a { color: #7B68EE; text-decoration: none; }
.sources a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">Daily Quotes <em>*</em></div>
  <div class="date-nav">
    <button class="nav-btn" id="prev-day" title="Previous day">&#8592;</button>
    <div class="page-subtitle" id="page-date"></div>
    <button class="nav-btn" id="next-day" title="Next day">&#8594;</button>
    <button id="refreshQuotes">↻</button>

<script>
async function loadQuotes() {
  const res = await fetch(`quotes.json?cacheBust=${Date.now()}`);
  const quotes = await res.json();

  const today = new Date().toLocaleDateString("en-CA", {
    timeZone: "America/Edmonton"
  });

  const todaysQuotes = quotes.filter(q => q.date === today);

  if (!todaysQuotes.length) {
    document.querySelector("#quoteBox").innerHTML =
      "Today’s quotes are not in quotes.json yet. Run the GitHub Action refresh.";
    return;
  }

  document.querySelector("#quoteBox").innerHTML = todaysQuotes
    .map(q => `<h3>${q.source}</h3><p>${q.text}</p>`)
    .join("");
}

document.querySelector("#refreshQuotes").addEventListener("click", loadQuotes);

loadQuotes();
</script> </div>
  <div class="refresh-status" id="refresh-status"></div>
</div>

<div class="cal-wrap" id="cal-wrap" style="display:none">
  <div class="cal-header">
    <button class="cal-nav" id="cal-prev">&#8592;</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button class="cal-nav" id="cal-next">&#8594;</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div id="quotes-container">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <span>Loading quotes…</span>
  </div>
</div>

<div class="sources" id="sources-footer" style="display:none">
  <strong>Source</strong>
  <a href="https://docs.google.com/spreadsheets/d/1VVWZBG3fXLWBFCnRDLo76kUQrNyPcBBdY6mCiiwJr50/edit"
     target="_blank" rel="noopener">Daily Quotes — Google Sheet</a>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────────
const SHEET_ID  = "1VVWZBG3fXLWBFCnRDLo76kUQrNyPcBBdY6mCiiwJr50";
const SHEET_GID = "0";

const SOURCE_CLASSES = [
  [/stoic|marcus|aurelius|meditat/i,                      "s-stoic"],
  [/\baa\b|alcoholics|big.?book|daily.?reflect/i,         "s-aa"],
  [/bible|scripture|verse|proverb|psalm|john|peter|corinth|roman|ephes|jeremiah|isaiah|samuel|luke/i, "s-bible"],
  [/word.?of.?the.?day|webster|dictionary|vocab/i,        "s-word"],
  [/histor|on.?this.?day/i,                               "s-history"],
  [/britannica|fact|trivia/i,                             "s-brit"],
  [/rca|recovery.?coach|al.?anon|alanon|alateen/i,        "s-rca"],
  [/prayer|morning|serenity|gratitude/i,                  "s-prayer"],
];
function sourceClass(src) {
  for (const [re, cls] of SOURCE_CLASSES) { if (re.test(src)) return cls; }
  return "s-default";
}

// ── Date helpers ───────────────────────────────────────────────────────────────
const MONTHS = {january:"01",february:"02",march:"03",april:"04",may:"05",june:"06",
                july:"07",august:"08",september:"09",october:"10",november:"11",december:"12"};
const MONTH_NAMES = ["January","February","March","April","May","June",
                     "July","August","September","October","November","December"];
const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,"0"); }
function isoFromParts(y,m,d) { return `${y}-${pad(m)}-${pad(d)}`; }
function formatDisplay(iso) {
  return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function normalizeDate(v) {
  if (!v) return "";
  const s = String(v).trim();
  const iso = s.match(/^(\d{4}-\d{2}-\d{2})/); if (iso) return iso[1];
  const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mdy) return `${mdy[3]}-${pad(mdy[1])}-${pad(mdy[2])}`;
  const mlong = s.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
  if (mlong) { const mo=MONTHS[mlong[1].toLowerCase()]; if(mo) return `${mlong[3]}-${mo}-${pad(mlong[2])}`; }
  return s.substring(0,10);
}
function addDays(iso, n) {
  const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// ── State ──────────────────────────────────────────────────────────────────────
let allQuotes = {};   // { "2026-06-15": [{source,description}, ...] }
let calViewYear, calViewMonth;  // calendar display month
let selectedDate = "";

// ── Data loading ───────────────────────────────────────────────────────────────
function loadAllFromGviz() {
  return new Promise((resolve, reject) => {
    const cb = `_qcb${Math.random().toString(36).slice(2)}`;
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("Timed out")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = payload => {
      cleanup();
      if (!payload || payload.status === "error") {
        reject(new Error(payload?.errors?.[0]?.detailed_message || "Sheet error")); return;
      }
      const cols = (payload.table.cols||[]).map(c=>(c.label||c.id||"").trim().toLowerCase());
      const di = cols.findIndex(c=>c.includes("date"));
      const si = cols.findIndex(c=>c.includes("source"));
      const xi = cols.findIndex(c=>c.includes("description"));
      if (di<0||si<0||xi<0) { reject(new Error("Missing columns: "+cols.join(", "))); return; }
      const map = {};
      (payload.table.rows||[]).forEach(r => {
        const row = (r.c||[]).map(cell=>cell?String(cell.f??cell.v??"").trim():"");
        const date = normalizeDate(row[di]);
        if (!date) return;
        if (!map[date]) map[date] = [];
        const desc = row[xi];
        if (desc) map[date].push({ source: row[si], description: desc });
      });
      resolve(map);
    };
    script.onerror = () => { cleanup(); reject(new Error("Script load failed")); };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=responseHandler:${cb}`;
    document.head.append(script);
  });
}

// ── Calendar ───────────────────────────────────────────────────────────────────
function renderCalendar() {
  const y = calViewYear, m = calViewMonth; // 1-based month
  const today = todayISO();
  document.getElementById("cal-month-label").textContent = `${MONTH_NAMES[m-1]} ${y}`;

  const firstDay = new Date(y, m-1, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(y, m, 0).getDate();

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");

  for (let i=0; i<firstDay; i++) html += `<div class="cal-day cal-day--empty"></div>`;

  for (let d=1; d<=daysInMonth; d++) {
    const iso = isoFromParts(y,m,d);
    const isToday = iso === today;
    const isSel = iso === selectedDate;
    const isFuture = iso > today;
    const hasDots = !isFuture && allQuotes[iso] && allQuotes[iso].length > 0;
    let cls = "cal-day";
    if (isFuture) cls += " cal-day--future";
    if (isToday)  cls += " cal-day--today";
    if (isSel && !isToday) cls += " cal-day--selected";
    const dot = hasDots ? `<span class="cal-dot"></span>` : `<span style="margin-top:3px;height:5px;display:block"></span>`;
    html += `<div class="${cls}" data-iso="${iso}">${isToday||isSel||hasDots?`<span class="cal-day-num">${d}</span>`:`<span class="cal-day-num">${d}</span>`}${dot}</div>`;
  }

  document.getElementById("cal-grid").innerHTML = html;

  // Prev/next month disable logic
  // Don't go before the earliest data date
  const dates = Object.keys(allQuotes).sort();
  const earliest = dates[0] || today;
  const earliestDate = new Date(earliest+"T12:00:00");
  const prevDisabled = (y === earliestDate.getFullYear() && m <= earliestDate.getMonth()+1);
  document.getElementById("cal-prev").disabled = prevDisabled;
  document.getElementById("cal-next").disabled = (y === new Date().getFullYear() && m >= new Date().getMonth()+1);

  // Click handler
  document.getElementById("cal-grid").querySelectorAll(".cal-day:not(.cal-day--empty):not(.cal-day--future)").forEach(el => {
    el.addEventListener("click", () => goToDate(el.dataset.iso));
  });
}

// ── Navigation ─────────────────────────────────────────────────────────────────
function goToDate(iso) {
  selectedDate = iso;
  const d = new Date(iso+"T12:00:00");
  calViewYear  = d.getFullYear();
  calViewMonth = d.getMonth()+1;
  renderCalendar();
  renderQuotesForDate(iso);
  // Update URL hash without reloading
  history.replaceState(null,"","#"+iso);
  // Scroll to top of quotes
  document.getElementById("quotes-container").scrollIntoView({behavior:"smooth",block:"start"});
}

// ── Render quotes ──────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderQuotesForDate(iso) {
  document.getElementById("page-date").textContent = formatDisplay(iso);
  document.title = "Daily Quotes — " + formatDisplay(iso);

  const today = todayISO();
  document.getElementById("next-day").disabled = iso >= today;

  const quotes = allQuotes[iso] || [];
  const container = document.getElementById("quotes-container");

  if (!quotes.length) {
    container.innerHTML = `<div class="no-quotes">No quotes in the sheet for ${escHtml(formatDisplay(iso))}.</div>`;
    document.getElementById("sources-footer").style.display = "none";
    return;
  }

  container.innerHTML = quotes.map((q,i) => `
    <div class="section ${sourceClass(q.source)}" style="animation-delay:${i*0.05}s">
      <div class="section-label">${escHtml(q.source)}</div>
      <div class="section-body">${escHtml(q.description)}</div>
    </div>`).join("");
  document.getElementById("sources-footer").style.display = "";
}

function renderError(msg) {
  document.getElementById("quotes-container").innerHTML = `
    <div class="error-wrap">
      <div class="error-icon">⚠️</div>
      <div class="error-msg">${escHtml(msg)}</div>
      <button class="retry-btn" onclick="init()">Try again</button>
    </div>`;
}

// ── Init ───────────────────────────────────────────────────────────────────────
async function init() {
  const today = todayISO();

  // Determine starting date from URL hash or default to today
  const hashDate = location.hash.replace("#","").match(/^\d{4}-\d{2}-\d{2}$/) ? location.hash.replace("#","") : null;
  selectedDate = hashDate && hashDate <= today ? hashDate : today;

  document.getElementById("page-date").textContent = formatDisplay(selectedDate);
  document.getElementById("next-day").disabled = selectedDate >= today;

  // Load all data
  try {
    allQuotes = await loadAllFromGviz();
  } catch(e) {
    renderError("Could not load quotes from the sheet: " + e.message);
    return;
  }

  // Build calendar view centered on selected date
  const sd = new Date(selectedDate+"T12:00:00");
  calViewYear  = sd.getFullYear();
  calViewMonth = sd.getMonth()+1;

  // Show calendar
  document.getElementById("cal-wrap").style.display = "";
  renderCalendar();

  // Show quotes for selected date
  renderQuotesForDate(selectedDate);
}

// ── Wire up controls ───────────────────────────────────────────────────────────
document.getElementById("prev-day").addEventListener("click", () => {
  const prev = addDays(selectedDate, -1);
  const dates = Object.keys(allQuotes).sort();
  if (dates.length && prev < dates[0]) return;
  goToDate(prev);
});

document.getElementById("next-day").addEventListener("click", () => {
  const next = addDays(selectedDate, 1);
  if (next > todayISO()) return;
  goToDate(next);
});

document.getElementById("refresh-btn").addEventListener("click", async () => {
  const btn = document.getElementById("refresh-btn");
  const status = document.getElementById("refresh-status");
  if (btn.disabled) return;

  btn.disabled = true;
  btn.classList.add("spinning");
  status.className = "refresh-status";
  status.textContent = "";

  try {
    allQuotes = await loadAllFromGviz();
    renderCalendar();
    renderQuotesForDate(selectedDate);
    const now = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    status.textContent = `Updated for ${formatDisplay(selectedDate)} · ${now}`;
    status.classList.add("show");
  } catch (e) {
    status.textContent = "Couldn't refresh: " + e.message;
    status.classList.add("show", "error");
  } finally {
    btn.disabled = false;
    btn.classList.remove("spinning");
    setTimeout(() => status.classList.remove("show"), 4000);
  }
});

document.getElementById("cal-prev").addEventListener("click", () => {
  calViewMonth--;
  if (calViewMonth < 1) { calViewMonth = 12; calViewYear--; }
  renderCalendar();
});

document.getElementById("cal-next").addEventListener("click", () => {
  calViewMonth++;
  if (calViewMonth > 12) { calViewMonth = 1; calViewYear++; }
  renderCalendar();
});

// Load config if not already present
if (!window.SNOWFLAKE_CONFIG) {
  const cfg = document.createElement("script");
  cfg.src = "snowflake-config.js";
  cfg.onload = cfg.onerror = init;
  document.head.append(cfg);
} else {
  init();
}
</script>
</body>
</html>
