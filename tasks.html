<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky:      #7ec8e3;
    --sun:      #ffd166;
    --grass:    #6bcb77;
    --coral:    #ff6b6b;
    --lavender: #c9b8ff;
    --bg:       #fff8ee;
    --card:     #ffffff;
    --text:     #2d2a4a;
    --muted:    #8a87a5;
    --border:   #ede8f5;
    --shadow:   0 4px 20px rgba(45,42,74,.09);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Nunito", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-y: auto;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: "Baloo 2", cursive;
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sync-btn {
    padding: 7px 16px;
    border-radius: 50px;
    background: var(--grass);
    color: #fff;
    font-family: "Nunito", sans-serif;
    font-size: .8rem;
    font-weight: 800;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity .2s, transform .1s;
  }
  .sync-btn:hover { opacity: .88; transform: scale(1.03); }
  .sync-icon { display: inline-block; }
  .sync-btn.spinning .sync-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Leaderboard ── */
  .leaderboard-section { padding: 0 16px 16px; }
  .section-label {
    font-size: .7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .leaderboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
  }

  .player-card {
    background: var(--card);
    border-radius: 18px;
    padding: 16px 14px 14px;
    box-shadow: var(--shadow);
    text-align: center;
    position: relative;
    border: 2px solid transparent;
    transition: transform .2s, box-shadow .2s;
    overflow: hidden;
  }
  .player-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    border-radius: 16px 16px 0 0;
  }
  .player-card.rank-1::before { background: linear-gradient(90deg, #ffd166, #ffb347); }
  .player-card.rank-2::before { background: linear-gradient(90deg, #c0c0c0, #a8a8a8); }
  .player-card.rank-3::before { background: linear-gradient(90deg, #cd7f32, #b8860b); }
  .player-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(45,42,74,.15); }

  .rank-emoji { position: absolute; top: 11px; right: 12px; font-size: 1.1rem; }

  .player-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 8px;
    border: 3px solid var(--border);
  }
  .player-name {
    font-family: "Baloo 2", cursive;
    font-size: .95rem;
    font-weight: 800;
    margin-bottom: 1px;
  }
  .player-level {
    font-size: .65rem;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 10px;
  }
  .pts-big {
    font-family: "Baloo 2", cursive;
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 2px;
  }
  .pts-label { font-size: .65rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }

  .xp-track { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 3px; }
  .xp-fill  { height: 100%; border-radius: 99px; transition: width .6s ease; }
  .xp-hint  { font-size: .62rem; color: var(--muted); text-align: right; font-weight: 700; }

  .mini-stats { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1.5px solid var(--border); }
  .mini-stat  { text-align: center; }
  .mini-val   { font-size: .9rem; font-weight: 900; }
  .mini-lbl   { font-size: .58rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    gap: 7px;
    padding: 0 16px 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-chip {
    padding: 5px 14px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-family: "Nunito", sans-serif;
    font-size: .75rem;
    font-weight: 800;
    cursor: pointer;
    transition: all .18s;
  }
  .filter-chip:hover, .filter-chip.active {
    background: var(--grass);
    border-color: var(--grass);
    color: #fff;
  }
  .search-box {
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: "Nunito", sans-serif;
    font-size: .8rem;
    font-weight: 600;
    outline: none;
    width: 180px;
    transition: border-color .2s;
  }
  .search-box:focus { border-color: var(--grass); }
  .search-box::placeholder { color: var(--muted); }

  /* ── Task grid ── */
  .task-section { padding: 0 16px 24px; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  .task-card {
    background: var(--card);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
    border-left: 5px solid var(--grass);
    cursor: pointer;
    transition: transform .18s, box-shadow .18s;
    animation: pop .25s ease;
  }
  .task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,42,74,.13); }
  .task-card.done { opacity: .5; border-left-color: var(--muted); }
  .task-card.done .task-title { text-decoration: line-through; color: var(--muted); }

  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }

  .task-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .task-title { font-weight: 800; font-size: .9rem; line-height: 1.3; flex: 1; padding-right: 8px; }

  .pts-pill {
    background: var(--sun);
    color: #6b4e00;
    font-size: .7rem;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .task-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: .65rem;
    padding: 2px 7px;
    border-radius: 99px;
    font-weight: 800;
  }
  .tag-person { background: #c9b8ff55; color: #4a3880; border: 1px solid #c9b8ff; }
  .tag-topic  { background: #7ec8e344; color: #1a607a; border: 1px solid #7ec8e3; }
  .tag-done   { background: #6bcb7733; color: #2a6b35; border: 1px solid #6bcb77; }
  .tag-open   { background: #ffd16633; color: #7a5500; border: 1px solid #ffd166; }

  .task-desc { font-size: .78rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }

  .task-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 9px; border-top: 1.5px solid var(--border); }
  .date-hint { font-size: .68rem; color: var(--muted); font-weight: 600; }

  .complete-btn {
    padding: 5px 12px;
    border-radius: 50px;
    border: 1.5px solid var(--grass);
    background: transparent;
    color: #2a6b35;
    font-family: "Nunito", sans-serif;
    font-size: .72rem;
    font-weight: 800;
    cursor: pointer;
    transition: all .18s;
  }
  .complete-btn:hover { background: var(--grass); color: #fff; }
  .done-btn { border-color: var(--muted) !important; color: var(--muted) !important; cursor: default !important; }
  .done-btn:hover { background: transparent !important; }

  /* ── Empty / loading ── */
  .status-bar {
    font-size: .78rem;
    color: var(--muted);
    font-weight: 600;
    padding: 0 18px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); grid-column: 1/-1; }
  .empty .e-icon { font-size: 2.4rem; margin-bottom: 8px; }
  .empty h3 { font-size: .95rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }

  /* ── Activity ── */
  .activity-section { padding: 0 16px 24px; }
  .activity-list { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .activity-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1.5px solid var(--border);
    font-size: .82rem;
    animation: pop .25s ease;
  }
  .activity-row:last-child { border-bottom: none; }
  .a-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grass); flex-shrink: 0; }
  .a-text { flex: 1; color: var(--muted); }
  .a-text strong { color: var(--text); }
  .a-pts { color: #7a5500; font-weight: 900; font-size: .8rem; background: var(--sun); padding: 1px 8px; border-radius: 99px; }

  /* ── Toast ── */
  .toast-wrap { position: fixed; bottom: 16px; right: 16px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--text);
    color: #fff;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: .84rem;
    font-weight: 700;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
    animation: slideUp .25s ease, fadeOff .3s ease 2.7s forwards;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeOff { to { opacity: 0; transform: translateY(10px); } }

  /* ── Confetti ── */
  .cf { position: fixed; border-radius: 2px; pointer-events: none; z-index: 999; animation: cffall 1.1s ease forwards; }
  @keyframes cffall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(220px) rotate(630deg)} }

  /* ── Error ── */
  .err-box { background: #fff0f0; border: 1.5px solid var(--coral); border-radius: 12px; padding: 13px 16px; margin: 0 16px 14px; font-size: .82rem; color: #8b2222; line-height: 1.6; display: none; }
  .err-box.on { display: block; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">🌟 Quest Board</div>
  <button class="sync-btn" id="syncBtn" onclick="sync()">
    <span class="sync-icon">↻</span> Sync Sheet
  </button>
</div>

<div class="err-box" id="errBox"></div>
<div class="status-bar" id="statusBar">Loading tasks from Google Sheet…</div>

<!-- Leaderboard -->
<div class="leaderboard-section">
  <div class="section-label">🏆 Points Leaderboard</div>
  <div class="leaderboard" id="leaderboard"></div>
</div>

<!-- Filters -->
<div class="filter-bar" id="filterBar">
  <button class="filter-chip active" data-f="all"  onclick="setFilter('all',this)">All</button>
  <button class="filter-chip"        data-f="open" onclick="setFilter('open',this)">Open</button>
  <button class="filter-chip"        data-f="done" onclick="setFilter('done',this)">Done</button>
  <input class="search-box" id="searchBox" placeholder="🔍 Search…" oninput="renderTasks()" />
</div>

<!-- Tasks -->
<div class="task-section">
  <div class="task-grid" id="taskGrid"></div>
</div>

<!-- Activity -->
<div class="activity-section" id="activitySection" style="display:none">
  <div class="section-label">⚡ Recent Completions</div>
  <div class="activity-list" id="activityList"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="snowflake-config.js"></script>
<script>
/* ── Config ── */
const CFG       = window.SNOWFLAKE_CONFIG || {};
const SHEET_ID  = CFG.sheetId  || '11A5NsScePEbtN9dujN3tILb_Q2TU5tsf6I0MbT11kDY';
const SHEET_GID = CFG.sheetGid || '553696854';
const LV_PTS    = 50;   // pts per level up

const AVATARS = { mom:'🧑‍💼', oliver:'🧒', logan:'👦', family:'👨‍👩‍👦', default:'🌟' };
const COLORS  = { mom:'#ff6b6b', oliver:'#7ec8e3', logan:'#6bcb77', family:'#c9b8ff', default:'#ffd166' };
const RANKS   = ['🥇','🥈','🥉','🎖️'];
const CONFETTI_CLR = ['#ffd166','#6bcb77','#7ec8e3','#c9b8ff','#ff6b6b','#ffb347'];

/* ── State ── */
let G = {
  tasks: [], players: {}, activity: [], completions: {},
  filter: 'all'
};

try {
  const sv = JSON.parse(localStorage.getItem('sf_quest')||'{}');
  if (sv.completions) G.completions = sv.completions;
  if (sv.activity)    G.activity    = sv.activity;
} catch(e){}

function save() {
  localStorage.setItem('sf_quest', JSON.stringify({ completions: G.completions, activity: G.activity }));
}

/* ── CSV ── */
function parseCSV(raw) {
  const rows=[]; let i=0, n=raw.length;
  while(i<n) {
    const row=[];
    while(i<n && raw[i]!=='\n' && raw[i]!=='\r') {
      if(raw[i]==='"') {
        let c=''; i++;
        while(i<n){ if(raw[i]==='"'&&raw[i+1]==='"'){c+='"';i+=2;} else if(raw[i]==='"'){i++;break;} else c+=raw[i++]; }
        row.push(c.trim()); if(raw[i]===',')i++;
      } else {
        let c='';
        while(i<n&&raw[i]!==','&&raw[i]!=='\n'&&raw[i]!=='\r')c+=raw[i++];
        row.push(c.trim()); if(raw[i]===',')i++;
      }
    }
    while(raw[i]==='\n'||raw[i]==='\r')i++;
    if(row.some(c=>c))rows.push(row);
  }
  return rows;
}

/* ── Map sheet columns ── */
// Exact column names from this sheet:
// ID, Date Added, Responsible, Category, Est Time,
// Task Name EN, Task Name FR, Description EN, Description FR,
// Date assigned, Date Completed, IsDone, Points
function autoMap(headers) {
  const h = headers.map(x => x.toLowerCase().trim());
  // Find last match wins for specificity; first-match for ambiguous
  const first = kws => { for(const k of kws){ const i=h.findIndex(c=>c.includes(k)); if(i>=0)return i; } return -1; };
  // Prefer exact or more-specific match
  const exact = kws => { for(const k of kws){ const i=h.findIndex(c=>c===k); if(i>=0)return i; } return -1; };

  // Title: prefer "task name en" over plain "task name"
  const titleIdx = exact(['task name en']) !== -1 ? exact(['task name en'])
                 : exact(['task name'])    !== -1 ? exact(['task name'])
                 : first(['task name','task','title','action','item']);

  // Title FR: "task name fr"
  const titleFRIdx = exact(['task name fr']) !== -1 ? exact(['task name fr'])
                   : h.findIndex(c => c.includes('task') && c.includes('fr'));

  // Description: prefer EN
  const descIdx = exact(['description en']) !== -1 ? exact(['description en'])
                : first(['desc','detail','note','body','info','comment']);

  // IsDone boolean column (Yes/No)
  const isDoneIdx = exact(['isdone']) !== -1 ? exact(['isdone'])
                  : h.findIndex(c => c === 'done' || c === 'is done' || c === 'isdone');

  // Date completed (actual date string)
  const completedIdx = exact(['date completed']) !== -1 ? exact(['date completed'])
                     : h.findIndex(c => c.includes('complet') && c.includes('date'));

  // Date added: prefer "date added" over other date cols
  const dateAddedIdx = exact(['date added']) !== -1 ? exact(['date added'])
                     : h.findIndex(c => c.includes('date') && c.includes('add'));

  return {
    title:         titleIdx,
    titleFR:       titleFRIdx,
    responsible:   first(['responsible','assign','owner','player','person','who','user','member']),
    topic:         first(['category','topic','cat','type','tag','area','group','label']),
    description:   descIdx,
    completedDate: completedIdx !== -1 ? completedIdx : first(['complet','finished','closed']),
    isDone:        isDoneIdx,
    dateAdded:     dateAddedIdx !== -1 ? dateAddedIdx : first(['date added','date','added','created']),
    points:        first(['points','point','pts','xp','score','value','reward']),
    estTime:       first(['est time','est.','time','duration','minutes'])
  };
}

/* ── Build tasks & players ── */
function buildFromRows(rows) {
  if(rows.length < 2) return;
  const hdrs   = rows[0];
  const map    = autoMap(hdrs);
  const dataRows = rows.slice(1);

  const YES_KW = ['yes','true','1','done','complete','completed','finished','closed','✓','✅'];

  G.tasks = dataRows.map((row, i) => {
    const get = idx => (idx >= 0 && idx < row.length ? (row[idx]||'') : '').trim();

    // Title (EN preferred)
    const title = get(map.title >= 0 ? map.title : 5);
    if(!title) return null;

    const titleFR       = get(map.titleFR);
    const person        = get(map.responsible >= 0 ? map.responsible : 2);
    const topic         = get(map.topic >= 0 ? map.topic : 3);
    const desc          = get(map.description >= 0 ? map.description : 7);
    const dateAdd       = get(map.dateAdded >= 0 ? map.dateAdded : 1);
    const estTime       = get(map.estTime);
    const rawPts        = get(map.points);
    const pts           = Math.max(0, parseInt(rawPts) || 0);  // honour 0-pt tasks

    // Determine done: check IsDone (boolean) first, then Date Completed (date string)
    const rawIsDone     = get(map.isDone);
    const rawCompleted  = get(map.completedDate);
    const boolDone      = !!rawIsDone && YES_KW.some(k => rawIsDone.toLowerCase() === k);
    const dateDone      = !!rawCompleted && /\d{4}/.test(rawCompleted);
    const sheetDone     = boolDone || dateDone;

    const key = `r${i}_${title.slice(0,14).replace(/\W/g,'_')}`;
    const localDone = !!G.completions[key];

    return {
      key, title, titleFR, person, topic, desc, pts, dateAdd, estTime,
      completedDate: rawCompleted || (boolDone ? rawIsDone : ''),
      sheetDone,
      isDone: sheetDone || localDone
    };
  }).filter(Boolean);

  buildPlayers();
}

function buildPlayers() {
  const P = {};
  const en = n => { if(!P[n]) P[n]={name:n, pts:0, done:0, total:0}; };

  G.tasks.forEach(t => {
    if(!t.person) return;
    en(t.person); P[t.person].total++;
    if(t.sheetDone) { P[t.person].pts += t.pts; P[t.person].done++; }
  });

  // local completions
  Object.entries(G.completions).forEach(([key, info]) => {
    en(info.person);
    const task = G.tasks.find(t=>t.key===key);
    if(!task||!task.sheetDone) { P[info.person].pts += info.pts; P[info.person].done++; }
  });

  G.players = P;
}

/* ── Render leaderboard ── */
function renderLB() {
  const el = document.getElementById('leaderboard');
  const players = Object.values(G.players).sort((a,b)=>b.pts-a.pts);

  if(!players.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">👥</div><h3>No players yet</h3><p>Sync your sheet to load data</p></div>`;
    return;
  }

  el.innerHTML = players.map((p,i) => {
    const key  = p.name.toLowerCase();
    const av   = AVATARS[key] || AVATARS.default;
    const col  = COLORS[key]  || COLORS.default;
    const lv   = Math.floor(p.pts / LV_PTS) + 1;
    const pct  = (p.pts % LV_PTS) / LV_PTS * 100;
    const left = Math.max(0, p.total - p.done);
    return `<div class="player-card rank-${Math.min(i+1,3)}" style="animation:pop .3s ${i*.07}s both">
      <div class="rank-emoji">${RANKS[i]||'🎖️'}</div>
      <div class="player-avatar" style="background:${col}22;border-color:${col}66">${av}</div>
      <div class="player-name">${x(p.name)}</div>
      <div class="player-level">Level ${lv}</div>
      <div class="pts-big" style="color:${col}">${p.pts}</div>
      <div class="pts-label">Quest Points</div>
      <div class="xp-track"><div class="xp-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="xp-hint">${p.pts % LV_PTS}/${LV_PTS} → Lv ${lv+1}</div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-val">${p.done}</div><div class="mini-lbl">Done</div></div>
        <div class="mini-stat"><div class="mini-val">${p.total}</div><div class="mini-lbl">Total</div></div>
        <div class="mini-stat"><div class="mini-val">${left}</div><div class="mini-lbl">Left</div></div>
      </div>
    </div>`;
  }).join('');
}

/* ── Render tasks ── */
function setFilter(f, btn) {
  G.filter = f;
  document.querySelectorAll('#filterBar .filter-chip[data-f]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#filterBar .pf').forEach(b=>b.remove());
  if(btn) btn.classList.add('active');

  // Add per-person chips
  const srch = document.getElementById('searchBox');
  const people = [...new Set(G.tasks.map(t=>t.person).filter(Boolean))];
  people.forEach(p => {
    const btn2 = document.createElement('button');
    btn2.className = 'filter-chip pf';
    btn2.dataset.f = 'p_'+p;
    btn2.textContent = p;
    btn2.onclick = function(){ setFilter('p_'+p, this); };
    document.getElementById('filterBar').insertBefore(btn2, srch);
  });

  document.querySelectorAll('#filterBar .filter-chip').forEach(b=>{
    b.classList.toggle('active', (b.dataset.f||'')===(G.filter||'all'));
  });
  renderTasks();
}

function renderTasks() {
  const grid = document.getElementById('taskGrid');
  const q = (document.getElementById('searchBox')?.value||'').toLowerCase();
  const f = G.filter;

  let tasks = G.tasks.filter(t => {
    if(f==='open' && t.isDone)  return false;
    if(f==='done' && !t.isDone) return false;
    if(f.startsWith('p_') && t.person !== f.slice(2)) return false;
    if(q && !t.title.toLowerCase().includes(q) && !t.person.toLowerCase().includes(q) && !(t.topic||'').toLowerCase().includes(q)) return false;
    return true;
  });

  if(!tasks.length) {
    grid.innerHTML = `<div class="empty"><div class="e-icon">${q?'🔍':'🎉'}</div><h3>${q?'No matches':'All caught up!'}</h3><p>${q?'Try a different word':'No tasks in this view'}</p></div>`;
    return;
  }

  grid.innerHTML = tasks.map(t => {
    const col = COLORS[(t.person||'').toLowerCase()] || COLORS.default;
    const ptsLabel = t.pts > 0 ? `⭐ ${t.pts}pt` : '—';
    return `<div class="task-card ${t.isDone?'done':''}" style="border-left-color:${col}" onclick="openCard('${x(t.key)}')">
      <div class="task-top">
        <div class="task-title">${x(t.title)}</div>
        <div class="pts-pill">${ptsLabel}</div>
      </div>
      ${t.titleFR ? `<div style="font-size:.72rem;color:var(--muted);margin:-4px 0 6px;font-style:italic">${x(t.titleFR)}</div>` : ''}
      <div class="task-tags">
        ${t.person  ? `<span class="tag tag-person">👤 ${x(t.person)}</span>` : ''}
        ${t.topic   ? `<span class="tag tag-topic">📌 ${x(t.topic)}</span>`  : ''}
        ${t.estTime ? `<span class="tag" style="background:#fff0dc;color:#7a5500;border:1px solid #ffd166">⏱ ${x(t.estTime)}</span>` : ''}
        <span class="tag ${t.isDone?'tag-done':'tag-open'}">${t.isDone?'✓ Done':'○ Open'}</span>
      </div>
      ${t.desc ? `<div class="task-desc">${x(t.desc)}</div>` : ''}
      <div class="task-foot">
        <span class="date-hint">${t.dateAdd ? '📅 '+x(t.dateAdd) : ''}</span>
        <button class="complete-btn${t.isDone?' done-btn':''}" onclick="event.stopPropagation();${t.isDone?'':` doComplete('${x(t.key)}')`}">
          ${t.isDone ? '✓ Done' : '+ Complete'}
        </button>
      </div>
    </div>`;
  }).join('');
}

/* ── Complete ── */
function doComplete(key) {
  const t = G.tasks.find(t=>t.key===key);
  if(!t||t.isDone) return;
  t.isDone = true;
  G.completions[key] = { person: t.person||'Family', pts: t.pts };
  G.activity.push({ person: t.person||'Family', title: t.title, pts: t.pts });
  save(); buildPlayers(); renderLB(); renderTasks(); renderActivity();
  toast(`🎉 ${t.pts} pt${t.pts!==1?'s':''} for ${t.person||'the family'}!`);
  burst();
}

function openCard(key) {
  const t = G.tasks.find(t=>t.key===key);
  if(!t) return;
  if(!t.isDone) doComplete(key);
}

/* ── Activity feed ── */
function renderActivity() {
  const sec = document.getElementById('activitySection');
  const el  = document.getElementById('activityList');
  if(!G.activity.length) { sec.style.display='none'; return; }
  sec.style.display = 'block';
  el.innerHTML = [...G.activity].reverse().slice(0,10).map(a=>
    `<div class="activity-row"><div class="a-dot"></div><div class="a-text"><strong>${x(a.person)}</strong> completed "${x(a.title)}"</div><div class="a-pts">+${a.pts}pt</div></div>`
  ).join('');
}

/* ── Sync ── */
async function sync() {
  const btn = document.getElementById('syncBtn');
  btn.classList.add('spinning');
  setErr('');
  setStatus('Syncing with Google Sheet…');

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv${SHEET_GID?'&gid='+SHEET_GID:''}`;
  try {
    const r = await fetch(url, { redirect:'follow' });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const txt = await r.text();
    if(!txt.trim()) throw new Error('Empty response');
    const rows = parseCSV(txt);
    if(rows.length < 2) throw new Error('No data rows found in sheet');

    buildFromRows(rows);
    renderLB();
    setFilter(G.filter, null);
    renderActivity();
    const done = G.tasks.filter(t=>t.sheetDone).length;
    const totalPts = Object.values(G.players).reduce((s,p)=>s+p.pts,0);
    setStatus(`${G.tasks.length} tasks · ${done} completed · ${totalPts} total points earned`);
    toast(`✅ Loaded ${G.tasks.length} tasks`);
  } catch(e) {
    setErr(`<strong>Could not reach the sheet.</strong> Make sure it's shared as "Anyone with the link → Viewer".<br><small>Error: ${e.message}</small>`);
    setStatus('Sync failed — see error above');
    // show fallback players if we have local completions
    buildPlayers(); renderLB(); renderTasks();
  }
  btn.classList.remove('spinning');
}

/* ── Helpers ── */
function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }
function setErr(html) { const el=document.getElementById('errBox'); el.innerHTML=html; el.classList.toggle('on',!!html); }
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg) {
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  c.appendChild(el); setTimeout(()=>el.remove(),3200);
}

function burst() {
  for(let i=0;i<25;i++){
    const el=document.createElement('div');
    el.className='cf';
    el.style.cssText=`left:${15+Math.random()*70}vw;top:${5+Math.random()*45}vh;background:${CONFETTI_CLR[~~(Math.random()*CONFETTI_CLR.length)]};animation-delay:${Math.random()*.4}s;animation-duration:${.75+Math.random()*.7}s;width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'3px'}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1600);
  }
}

/* ── Init ── */
renderLB();
renderTasks();
renderActivity();
sync();
</script>
</body>
</html>
