<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks | Snowflake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <div class="page-title">🌟 Quest Board</div>
  <a href="store.html" class="sync-btn" style="background:#a855f7;text-decoration:none">🎁 Store</a>
  <button class="sync-btn" style="background:#38d9a9" onclick="openAddTask()">+ Add Task</button>
  <button class="sync-btn" style="background:#4dabf7" onclick="exportJson()" title="Download tasks.json">⬇ Export</button>
  <button class="sync-btn" style="background:#f59f00" onclick="document.getElementById('importJsonInput').click()" title="Upload a JSON file of tasks to add">⬆ Import</button>
  <input type="file" id="importJsonInput" accept="application/json,.json" style="display:none" onchange="importJsonTasks(this.files[0])">
  <button class="sync-btn" id="syncBtn" onclick="sync()">
    <span class="sync-icon">↻</span> Sync Sheet
  </button>
</div>

<div class="err-box" id="errBox"></div>
<div class="status-bar" id="statusBar">Loading tasks from Google Sheet…</div>

<!-- Leaderboard -->
<div class="leaderboard-section">
  <div class="section-label">🏆 Points Leaderboard</div>
  <div class="leaderboard" id="leaderboard"></div>
  <div class="section-label category-label">Category Breakdown</div>
  <div class="category-breakdown" id="categoryBreakdown"></div>
  <div class="section-label category-label" id="todayCategoryLabel" style="display:none">⚡ Today's Points by Category</div>
  <div class="today-category" id="todayCategory"></div>
</div>

<!-- Filters -->
<div class="filter-bar" id="filterBar">
  <button class="filter-chip active" data-status="all"  onclick="setStatusFilter('all')">All</button>
  <button class="filter-chip"        data-status="open" onclick="setStatusFilter('open')">Open</button>
  <button class="filter-chip"        data-status="assigned" onclick="setStatusFilter('assigned')">Assigned</button>
  <button class="filter-chip"        data-status="done" onclick="setStatusFilter('done')">Done</button>
  <input class="search-box" id="searchBox" placeholder="🔍 Search…" oninput="renderTasks()" />
</div>

<!-- Tasks -->
<div class="task-section">
  <div class="task-grid" id="taskGrid"></div>
</div>

<!-- Activity -->
<div class="activity-section" id="activitySection" style="display:none">
  <div class="section-label">⚡ Recent Completions</div>
  <div class="activity-list" id="activityList"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<!-- Add Task Modal -->
<div class="worksheet-modal" id="addTaskModal" hidden>
  <div class="worksheet-backdrop" onclick="closeAddTask()"></div>
  <section class="worksheet-sheet" style="max-width:480px;padding:24px" role="dialog" aria-modal="true">
    <div style="font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;margin-bottom:16px">+ Add Task</div>
    <form id="addTaskForm" onsubmit="submitAddTask(event)">
      <div style="display:grid;gap:10px">
        <label style="font-weight:700;font-size:.85rem">Task Title *
          <input name="title" required placeholder="e.g. Clean the kitchen" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
        </label>
        <div style="font-weight:700;font-size:.85rem">Person(s) — pick one or more
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
            <label style="display:flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid #d8dee6;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:#fff"><input type="checkbox" name="person" value="Mom" style="margin:0"> Mom</label>
            <label style="display:flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid #d8dee6;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:#fff"><input type="checkbox" name="person" value="Dad" style="margin:0"> Dad</label>
            <label style="display:flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid #d8dee6;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:#fff"><input type="checkbox" name="person" value="Oliver" style="margin:0"> Oliver</label>
            <label style="display:flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid #d8dee6;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:#fff"><input type="checkbox" name="person" value="Logan" style="margin:0"> Logan</label>
            <label style="display:flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid #d8dee6;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:#fff"><input type="checkbox" name="person" value="Family" style="margin:0"> Family</label>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid #d8dee6;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;background:#fffbeb;width:fit-content">
          <input type="checkbox" name="assignToday" value="yes" style="margin:0;width:16px;height:16px"> 📌 Assign to today
        </label>
        <div style="display:grid;grid-template-columns:1fr;gap:10px">
          <label style="font-weight:700;font-size:.85rem">Category
            <select name="topic" onchange="toggleCategoryOther(this.value)" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff">
              <option value="Art">Art</option>
              <option value="Language">Language</option>
              <option value="Math">Math</option>
              <option value="Science">Science</option>
              <option value="Side Quest">Side Quest</option>
              <option value="Social Studies">Social Studies</option>
              <option value="Wellness">Wellness</option>
              <option value="__other__">+ Other…</option>
            </select>
          </label>
        </div>
        <label id="categoryOtherWrap" style="font-weight:700;font-size:.85rem;display:none">New category name
          <input name="topicOther" id="categoryOther" placeholder="Type a new category" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label style="font-weight:700;font-size:.85rem">Est. Time (min)
            <input name="estTime" id="estTimeInput" type="number" min="0" placeholder="15" oninput="autoCalcPoints(this.value)" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
          </label>
          <label style="font-weight:700;font-size:.85rem">Points
            <input name="points" id="pointsInput" type="number" min="0" value="0" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
            <span style="display:block;margin-top:3px;font-size:.72rem;font-weight:400;color:var(--muted)">Auto: 2 pts / 5 min — edit if needed</span>
          </label>
        </div>
        <label style="font-weight:700;font-size:.85rem">Description
          <textarea name="description" rows="3" placeholder="Steps or notes…" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit;resize:vertical"></textarea>
        </label>
        <label style="font-weight:700;font-size:.85rem">Question(s)
          <textarea name="questions" rows="3" placeholder="Q1: …&#10;Answer: …" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit;resize:vertical"></textarea>
        </label>
        <label style="font-weight:700;font-size:.85rem">Answer(s)
          <textarea name="answers" rows="2" placeholder="Answer key, if kept separate…" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit;resize:vertical"></textarea>
        </label>
        <label style="font-weight:700;font-size:.85rem">Worksheet (optional)
          <input name="worksheet" placeholder="Link, or worksheet notes" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
        </label>
        <label style="font-weight:700;font-size:.85rem">Link (optional)
          <input name="link" placeholder="https://…" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid #d8dee6;border-radius:10px;font-size:.95rem;font-family:inherit">
        </label>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="submit" class="sync-btn" style="background:#38d9a9;flex:1">Save Task</button>
        <button type="button" class="sync-btn" style="background:#adb5bd" onclick="closeAddTask()">Cancel</button>
      </div>
    </form>
  </section>
</div>

<div class="worksheet-modal" id="worksheetModal" hidden>
  <div class="worksheet-backdrop" onclick="closeWorksheet()"></div>
  <section class="worksheet-sheet" id="worksheetSheet" aria-labelledby="worksheetTitle" role="dialog" aria-modal="true">
    <div class="worksheet-actions">
      <button class="sheet-action" type="button" onclick="printWorksheet()">Print PDF</button>
      <button class="sheet-action secondary" type="button" onclick="closeWorksheet()">Close</button>
    </div>
    <div class="worksheet-content" id="worksheetContent"></div>
  </section>
</div>

<script src="snowflake-config.js"></script>
<script>
/* ── Config ── */
const CFG       = window.SNOWFLAKE_CONFIG || {};
const SHEET_ID  = CFG.sheetId  || '1GZv91Npf9i0y6AtCQcjYUyiYrDq3aqQ3zSNE2QGAxfE';
const SHEET_GID = CFG.sheetGid || '0';
const LV_PTS    = 50;   // pts per level up

const AVATARS = { mom:'🧑‍💼', dad:'🧑‍🔧', oliver:'🧒', logan:'👦', family:'👨‍👩‍👦', default:'🌟' };
const COLORS  = { mom:'#336699', dad:'#2a9d8f', oliver:'#d94b4b', logan:'#7b4bd9', family:'#c9b8ff', default:'#ffd166' };
const CATEGORY_COLORS = ['#ffd166','#6bcb77','#7ec8e3','#c9b8ff','#ff6b6b','#f4a261','#2a9d8f','#b56576','#4d96ff','#8ac926'];
const RANKS   = ['🥇','🥈','🥉','🎖️'];
const CONFETTI_CLR = ['#ffd166','#6bcb77','#7ec8e3','#c9b8ff','#ff6b6b','#ffb347'];

/* ── State ── */
let G = {
  tasks: [], players: {}, activity: [], completions: {}, assignments: {},
  filters: { status: 'all', person: '', category: '' },
  pendingCompleteKey: new URLSearchParams(location.search).get('complete') || ''
};

try {
  const sv = JSON.parse(localStorage.getItem('sf_quest')||'{}');
  if (sv.completions) G.completions = sv.completions;
  if (sv.assignments) G.assignments = sv.assignments;
  if (sv.activity)    G.activity    = sv.activity;
} catch(e){}

function save() {
  localStorage.setItem('sf_quest', JSON.stringify({ completions: G.completions, assignments: G.assignments, activity: G.activity }));
}

function personColor(name) {
  return COLORS[(name||'').toLowerCase()] || COLORS.default;
}

function categoryColor(name) {
  const key = (name || 'Uncategorized').toLowerCase();
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
  return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}

function jsString(value) {
  return JSON.stringify(String(value || ''));
}

function sheetEndpoint() {
  return String(CFG.appsScriptUrl || '').trim();
}

function todayIsoDate() {
  return new Date().toISOString().slice(0, 10);
}

function extractUrls(text) {
  const matches = String(text || '').match(/https?:\/\/[^\s<>"')]+/g) || [];
  return matches.map(url => ({ label: url.replace(/^https?:\/\//, ''), url }));
}

function normalizeUrl(value) {
  const text = String(value || '').trim();
  if(!text) return '';
  if(/^https?:\/\//i.test(text)) return text;
  if(/^(?:\.{0,2}\/)?[\w.-]+\/[\w./%-]+$/i.test(text)) return text;
  if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(text)) return `https://${text}`;
  return '';
}

function taskLinks(row, map, desc) {
  const links = [];
  const addLink = (label, value) => {
    const url = normalizeUrl(value);
    if(url) links.push({ label, url });
  };
  addLink('Video', map.youtubeLink >= 0 ? row[map.youtubeLink] : '');
  addLink('Worksheet', map.worksheet >= 0 ? row[map.worksheet] : '');
  if(map.links >= 0 && map.links < row.length) {
    String(row[map.links] || '').split(/[\n,;]/).forEach(item => {
      const url = normalizeUrl(item);
      if(url) links.push({ label: item.trim().replace(/^https?:\/\//i, ''), url });
    });
  }
  extractUrls(desc).forEach(link => links.push(link));
  const seen = new Set();
  return links.filter(link => {
    if(seen.has(link.url)) return false;
    seen.add(link.url);
    return true;
  });
}

/* ── CSV ── */
function parseCSV(raw) {
  const rows=[]; let i=0, n=raw.length;
  while(i<n) {
    const row=[];
    while(i<n && raw[i]!=='\n' && raw[i]!=='\r') {
      if(raw[i]==='"') {
        let c=''; i++;
        while(i<n){ if(raw[i]==='"'&&raw[i+1]==='"'){c+='"';i+=2;} else if(raw[i]==='"'){i++;break;} else c+=raw[i++]; }
        row.push(c.trim()); if(raw[i]===',')i++;
      } else {
        let c='';
        while(i<n&&raw[i]!==','&&raw[i]!=='\n'&&raw[i]!=='\r')c+=raw[i++];
        row.push(c.trim()); if(raw[i]===',')i++;
      }
    }
    while(raw[i]==='\n'||raw[i]==='\r')i++;
    if(row.some(c=>c))rows.push(row);
  }
  return rows;
}

function loadRowsWithGviz() {
  if (!SHEET_ID) return Promise.reject(new Error('Missing Google Sheet ID'));

  return new Promise((resolve, reject) => {
    const callbackName = `tasksSheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement('script');
    const timeout = window.setTimeout(() => {
      cleanup();
      reject(new Error('Google Sheet did not respond'));
    }, 12000);

    function cleanup() {
      window.clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = payload => {
      cleanup();
      if (!payload || payload.status === 'error') {
        const message = payload?.errors?.[0]?.detailed_message || 'Google Sheet returned an error';
        reject(new Error(message));
        return;
      }

      const table = payload.table || {};
      const headers = (table.cols || []).map((col, index) => col.label || col.id || `Column ${index + 1}`);
      const rows = (table.rows || []).map(row => (row.c || []).map(cell => {
        if (!cell) return '';
        return cell.f != null ? String(cell.f) : String(cell.v == null ? '' : cell.v);
      }));
      resolve([headers, ...rows]);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('Could not load Google Sheet'));
    };

    script.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?gid=${encodeURIComponent(SHEET_GID)}&tqx=responseHandler:${callbackName}`;
    document.head.append(script);
  });
}

async function loadRowsFromSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv${SHEET_GID?'&gid='+SHEET_GID:''}`;
  try {
    const r = await fetch(url, { cache:'no-store', redirect:'follow' });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const txt = await r.text();
    if(!txt.trim()) throw new Error('Empty response');
    return parseCSV(txt);
  } catch(fetchError) {
    try {
      return await loadRowsWithGviz();
    } catch(gvizError) {
      throw new Error(`${fetchError.message}; fallback: ${gvizError.message}`);
    }
  }
}

/* ── Map sheet columns ── */
// Exact column names from this sheet:
// ID, Date Added, Responsible, Category, Est Time,
// Task Name EN, Task Name FR, Description EN, Description FR,
// Date assigned, Date Completed, IsDone, Points
function autoMap(headers) {
  const h = headers.map(x => x.toLowerCase().trim());
  // Find last match wins for specificity; first-match for ambiguous
  const first = kws => { for(const k of kws){ const i=h.findIndex(c=>c.includes(k)); if(i>=0)return i; } return -1; };
  // Prefer exact or more-specific match
  const exact = kws => { for(const k of kws){ const i=h.findIndex(c=>c===k); if(i>=0)return i; } return -1; };

  // Title: prefer "task name en" over plain "task name"
  const titleIdx = exact(['task name en']) !== -1 ? exact(['task name en'])
                 : exact(['task name'])    !== -1 ? exact(['task name'])
                 : first(['task name','task','title','action','item']);

  // Title FR: "task name fr"
  const titleFRIdx = exact(['task name fr']) !== -1 ? exact(['task name fr'])
                   : h.findIndex(c => c.includes('task') && c.includes('fr'));

  // Description: prefer EN
  const descIdx = exact(['description en']) !== -1 ? exact(['description en'])
                : first(['desc','detail','note','body','info','comment']);

  // IsDone boolean column (Yes/No)
  const isDoneIdx = exact(['isdone']) !== -1 ? exact(['isdone'])
                  : h.findIndex(c => c === 'done' || c === 'is done' || c === 'isdone');

  // Date completed (actual date string)
  const completedIdx = exact(['date completed']) !== -1 ? exact(['date completed'])
                     : h.findIndex(c => c.includes('complet') && c.includes('date'));

  // Date added: prefer "date added" over other date cols
  const dateAddedIdx = exact(['date added']) !== -1 ? exact(['date added'])
                     : h.findIndex(c => c.includes('date') && c.includes('add'));
  const dateAssignedIdx = exact(['date assigned']) !== -1 ? exact(['date assigned'])
                        : h.findIndex(c => c.includes('date') && c.includes('assign'));

  return {
    title:         titleIdx,
    titleFR:       titleFRIdx,
    responsible:   first(['responsible','assign','owner','player','person','who','user','member']),
    topic:         first(['category','topic','cat','type','tag','area','group','label']),
    description:   descIdx,
    completedDate: completedIdx !== -1 ? completedIdx : first(['complet','finished','closed']),
    isDone:        isDoneIdx,
    dateAdded:     dateAddedIdx !== -1 ? dateAddedIdx : first(['date added','date','added','created']),
    dateAssigned:  dateAssignedIdx,
    points:        first(['points','point','pts','xp','score','value','reward']),
    estTime:       first(['est time','est.','time','duration','minutes']),
    youtubeLink:   exact(['youtube link']) !== -1 ? exact(['youtube link']) : first(['youtube']),
    worksheet:     exact(['worksheet']) !== -1 ? exact(['worksheet']) : first(['worksheet','work sheet']),
    questions:     exact(['questions']) !== -1 ? exact(['questions']) : first(['questions','question']),
    answers:       exact(['answers']) !== -1 ? exact(['answers']) : first(['answers','answer']),
    links:         first(['website','web site','url','resource'])
  };
}

/* ── Build tasks & players ── */
function buildFromRows(rows) {
  if(rows.length < 2) return;
  const hdrs   = rows[0];
  const map    = autoMap(hdrs);
  const dataRows = rows.slice(1);

  const YES_KW = ['yes','true','1','done','complete','completed','finished','closed','✓','✅'];

  G.tasks = dataRows.map((row, i) => {
    const get = idx => (idx >= 0 && idx < row.length ? (row[idx]||'') : '').trim();

    // Title (EN preferred)
    const title = get(map.title >= 0 ? map.title : 5);
    if(!title) return null;

    const titleFR       = get(map.titleFR);
    const person        = get(map.responsible >= 0 ? map.responsible : 2);
    const topic         = get(map.topic >= 0 ? map.topic : 3);
    const desc          = get(map.description >= 0 ? map.description : 7);
    const dateAdd       = get(map.dateAdded >= 0 ? map.dateAdded : 1);
    const dateAssigned  = get(map.dateAssigned);
    const estTime       = get(map.estTime);
    const rawPts        = get(map.points);
    const pts           = Math.max(0, parseInt(rawPts) || 0);  // honour 0-pt tasks
    const links         = taskLinks(row, map, desc);
    const questions     = get(map.questions);
    const answers       = get(map.answers);
    const worksheetText = get(map.worksheet);

    // Determine done: check IsDone (boolean) first, then Date Completed (date string)
    const rawIsDone     = get(map.isDone);
    const rawCompleted  = get(map.completedDate);
    const boolDone      = !!rawIsDone && YES_KW.some(k => rawIsDone.toLowerCase() === k);
    const dateDone      = !!rawCompleted && /\d{4}/.test(rawCompleted);
    const sheetDone     = boolDone || dateDone;

    const key = `r${i}_${title.slice(0,14).replace(/\W/g,'_')}`;
    const localDone = !!G.completions[key];
    const assignedDate = G.assignments[key] || dateAssigned;

    return {
      key, rowNumber: i + 2, title, titleFR, person, topic, desc, pts, dateAdd, dateAssigned: assignedDate, estTime, links,
      questions, answers, worksheetText,
      completedDate: rawCompleted || (boolDone ? rawIsDone : ''),
      sheetDone,
      isDone: sheetDone || localDone,
      isAssigned: !!assignedDate && !sheetDone && !localDone
    };
  }).filter(Boolean);

  buildPlayers();
}

function buildPlayers() {
  const P = {};
  const en = n => { if(!P[n]) P[n]={name:n, pts:0, done:0, total:0, cats:{}}; };

  G.tasks.forEach(t => {
    if(!t.person) return;
    en(t.person); P[t.person].total++;
    if(t.sheetDone) {
      P[t.person].pts += t.pts; P[t.person].done++;
      const cat = t.topic || 'Uncategorized';
      P[t.person].cats[cat] = (P[t.person].cats[cat] || 0) + t.pts;
    }
  });

  // local completions
  Object.entries(G.completions).forEach(([key, info]) => {
    en(info.person);
    const task = G.tasks.find(t=>t.key===key);
    if(!task||!task.sheetDone) {
      P[info.person].pts += info.pts; P[info.person].done++;
      const cat = info.topic || 'Uncategorized';
      P[info.person].cats[cat] = (P[info.person].cats[cat] || 0) + info.pts;
    }
  });

  G.players = P;
}

function catChart(p) {
  const cats = Object.entries(p.cats || {}).sort((a,b) => b[1]-a[1]);
  if(!cats.length || p.pts === 0) return '';
  const segs = cats.map(([name, pts]) => {
    const pct = (pts / p.pts * 100).toFixed(1);
    const col = categoryColor(name);
    return `<div class="cat-seg" style="width:${pct}%;background:${col}" title="${x(name)}: ${pts}pt"></div>`;
  }).join('');
  const legend = cats.map(([name, pts]) => {
    const col = categoryColor(name);
    return `<div class="cat-leg-item"><span class="cat-leg-dot" style="background:${col}"></span><span class="cat-leg-name">${x(name)}</span><span class="cat-leg-pts">${pts}pt</span></div>`;
  }).join('');
  return `<div class="cat-bar-wrap"><div class="cat-bar">${segs}</div></div><div class="cat-legend">${legend}</div>`;
}

/* ── Render leaderboard ── */
function renderLB() {
  const el = document.getElementById('leaderboard');
  const players = Object.values(G.players).sort((a,b)=>b.pts-a.pts);

  if(!players.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">👥</div><h3>No players yet</h3><p>Sync your sheet to load data</p></div>`;
    renderCategoryBreakdown();
    return;
  }

  el.innerHTML = players.map((p,i) => {
    const key  = p.name.toLowerCase();
    const av   = AVATARS[key] || AVATARS.default;
    const col  = personColor(p.name);
    const lv   = Math.floor(p.pts / LV_PTS) + 1;
    const pct  = (p.pts % LV_PTS) / LV_PTS * 100;
    const left = Math.max(0, p.total - p.done);
    return `<div class="player-card rank-${Math.min(i+1,3)}" style="--player-color:${col};animation:pop .3s ${i*.07}s both">
      <div class="rank-emoji">${RANKS[i]||'🎖️'}</div>
      <div class="player-avatar" style="background:${col}22;border-color:${col}66">${av}</div>
      <div class="player-name">${x(p.name)}</div>
      <div class="player-level">Level ${lv}</div>
      <div class="pts-big" style="color:${col}">${p.pts}</div>
      <div class="pts-label">Quest Points</div>
      <div class="xp-track"><div class="xp-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="xp-hint">${p.pts % LV_PTS}/${LV_PTS} → Lv ${lv+1}</div>
      ${catChart(p)}
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-val">${p.done}</div><div class="mini-lbl">Done</div></div>
        <div class="mini-stat"><div class="mini-val">${p.total}</div><div class="mini-lbl">Total</div></div>
        <div class="mini-stat"><div class="mini-val">${left}</div><div class="mini-lbl">Left</div></div>
      </div>
    </div>`;
  }).join('');
  renderCategoryBreakdown();
  renderTodayByCategory();
}

function renderCategoryBreakdown() {
  const el = document.getElementById('categoryBreakdown');
  if(!el) return;

  const categories = {};
  G.tasks.forEach(t => {
    const name = t.topic || 'Uncategorized';
    if(!categories[name]) categories[name] = { name, total: 0, done: 0, points: 0 };
    categories[name].total++;
    if(t.isDone) {
      categories[name].done++;
      categories[name].points += t.pts;
    }
  });

  const items = Object.values(categories).sort((a,b)=>b.points-a.points || b.done-a.done || a.name.localeCompare(b.name));
  if(!items.length) {
    el.innerHTML = '';
    return;
  }

  el.innerHTML = items.map(cat => {
    const color = categoryColor(cat.name);
    const open = Math.max(0, cat.total - cat.done);
    const active = G.filters.category === cat.name;
    return `<button class="category-chip${active?' active':''}" type="button" style="border-bottom-color:${color};color:${color}" onclick="toggleCategoryFilter(${jsString(cat.name)})">
      <span class="category-name">${x(cat.name)}</span>
      <span class="category-meta">
        <span>${cat.done}/${cat.total} done</span>
        <span>${open} open</span>
        <span>${cat.points} pts</span>
      </span>
    </button>`;
  }).join('');
}

function renderTodayByCategory() {
  const el = document.getElementById('todayCategory');
  const label = document.getElementById('todayCategoryLabel');
  if (!el) return;
  const today = todayIsoDate();
  const cats = {};

  // Sheet-completed tasks where completedDate contains today's ISO date
  G.tasks.forEach(t => {
    if (!t.sheetDone || !t.completedDate) return;
    if (!t.completedDate.includes(today)) return;
    const cat = t.topic || 'Uncategorized';
    cats[cat] = (cats[cat] || 0) + t.pts;
  });

  // Local completions done today (this session or saved with a date)
  Object.entries(G.completions).forEach(([key, info]) => {
    if (info.date && info.date !== today) return;
    const task = G.tasks.find(t => t.key === key);
    if (task && task.sheetDone) return; // already counted above
    const cat = info.topic || 'Uncategorized';
    cats[cat] = (cats[cat] || 0) + info.pts;
  });

  const items = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  if (!items.length) { el.innerHTML = ''; if (label) label.style.display = 'none'; return; }
  if (label) label.style.display = '';

  const todayTotal = items.reduce((s, [, pts]) => s + pts, 0);
  const overallTotal = Object.values(G.players).reduce((s, p) => s + p.pts, 0);
  el.innerHTML = items.map(([name, pts]) => {
    const color = categoryColor(name);
    return `<div class="today-cat-row">
      <span class="today-cat-name" style="color:${color}">${x(name)}</span>
      <span class="today-cat-bar-wrap"><span class="today-cat-bar" style="width:${Math.round(pts/todayTotal*100)}%;background:${color}"></span></span>
      <span class="today-cat-pts" style="color:${color}">+${pts}pt</span>
    </div>`;
  }).join('') + `<div class="today-cat-total"><span>Today: <strong>${todayTotal} pts</strong></span><span>Overall: <strong>${overallTotal} pts</strong></span></div>`;
}

/* ── Render tasks ── */
function renderPersonFilters() {
  document.querySelectorAll('#filterBar .pf').forEach(b=>b.remove());
  const srch = document.getElementById('searchBox');
  const people = [...new Set(G.tasks.map(t=>t.person).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  people.forEach(p => {

    btn2.dataset.person = p;
    btn2.textContent = p;
    btn2.onclick = function(){ togglePersonFilter(p); };
    document.getElementById('filterBar').insertBefore(btn2, srch);
  });
  updateFilterButtons();
}

function updateFilterButtons() {
  document.querySelectorAll('#filterBar .filter-chip[data-status]').forEach(b=>{
    b.classList.toggle('active', b.dataset.status === G.filters.status);
  });
  document.querySelectorAll('#filterBar .filter-chip[data-person]').forEach(b=>{
    b.classList.toggle('active', b.dataset.person === G.filters.person);
  });
}

function setStatusFilter(status) {
  G.filters.status = status;
  updateFilterButtons();
  renderTasks();
}

function togglePersonFilter(person) {
  G.filters.person = G.filters.person === person ? '' : person;
  updateFilterButtons();
  renderTasks();
}

function toggleCategoryFilter(category) {
  G.filters.category = G.filters.category === category ? '' : category;
  renderCategoryBreakdown();
  renderTasks();
}

function nextTaskInCategory(task) {
  const topic = task.topic || 'Uncategorized';
  const start = G.tasks.findIndex(item => item.key === task.key);
  if(start < 0) return null;
  return G.tasks.slice(start + 1).find(item => (item.topic || 'Uncategorized') === topic && !item.isDone) || null;
}

function assignTask(task, assignedDate) {
  if(!task) return;
  task.dateAssigned = assignedDate;
  task.isAssigned = true;
  G.assignments[task.key] = assignedDate;
}

function renderTasks() {
  const grid = document.getElementById('taskGrid');
  const q = (document.getElementById('searchBox')?.value||'').toLowerCase();
  const f = G.filters;

  let tasks = G.tasks.filter(t => {
    if(f.status==='open' && t.isDone)  return false;
    if(f.status==='done' && !t.isDone) return false;
    if(f.status==='assigned' && (!t.isAssigned || t.isDone)) return false;
    if(f.person && t.person !== f.person) return false;
    if(f.category && (t.topic || 'Uncategorized') !== f.category) return false;
    if(q && !t.title.toLowerCase().includes(q) && !t.person.toLowerCase().includes(q) && !(t.topic||'').toLowerCase().includes(q)) return false;
    return true;
  });

  if(!tasks.length) {
    grid.innerHTML = `<div class="empty"><div class="e-icon">${q?'🔍':'🎉'}</div><h3>${q?'No matches':'All caught up!'}</h3><p>${q?'Try a different word':'No tasks in this view'}</p></div>`;
    return;
  }

  grid.innerHTML = tasks.map(t => {
    const personCol = personColor(t.person);
    const topicCol = categoryColor(t.topic);
    const ptsLabel = t.pts > 0 ? `⭐ ${t.pts}pt` : '—';
    const assignedTag = t.isAssigned && !t.isDone ? `<span class="tag tag-assigned">Assigned</span>` : '';
    const resourceLinks = (t.links || []).filter(link => link.url).map(link =>
      `<a class="resource-link" href="${x(link.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${x(link.label || 'Resource')}</a>`
    ).join('');
    return `<div class="task-card ${t.isDone?'done':''}" style="border-left-color:${personCol};border-bottom-color:${topicCol}" onclick="openCard('${x(t.key)}')">
      <div class="task-top">
        <div class="task-title">${x(t.title)}</div>
        <div class="pts-pill">${ptsLabel}</div>
      </div>
      ${t.titleFR ? `<div style="font-size:.72rem;color:var(--muted);margin:-4px 0 6px;font-style:italic">${x(t.titleFR)}</div>` : ''}
      <div class="task-tags">
        ${assignedTag}
        ${t.person  ? `<span class="tag tag-person">👤 ${x(t.person)}</span>` : ''}
        ${t.topic   ? `<span class="tag tag-topic">📌 ${x(t.topic)}</span>`  : ''}
        ${t.estTime ? `<span class="tag" style="background:#fff0dc;color:#7a5500;border:1px solid #ffd166">⏱ ${x(t.estTime)}</span>` : ''}
        <span class="tag ${t.isDone?'tag-done':'tag-open'}">${t.isDone?'✓ Done':'○ Open'}</span>
      </div>
      ${t.desc ? `<div class="task-desc">${x(t.desc)}</div>` : ''}
      ${resourceLinks ? `<div class="task-resource-links">${resourceLinks}</div>` : ''}
      <div class="task-foot">
        <span class="date-hint">${t.dateAssigned ? 'Assigned '+x(t.dateAssigned) : ''}</span>
        <button class="complete-btn${t.isDone?' done-btn':''}" onclick="event.stopPropagation();${t.isDone?'':` doComplete('${x(t.key)}')`}">
          ${t.isDone ? '✓ Done' : '+ Complete'}
        </button>
      </div>
    </div>`;
  }).join('');
}

/* ── Complete ── */
async function doComplete(key) {
  const t = G.tasks.find(t=>t.key===key);
  if(!t||t.isDone) return;
  const today = todayIsoDate();
  const nextTask = nextTaskInCategory(t);

  // 1. Optimistically update UI immediately
  t.isDone = true;
  t.isAssigned = false;
  t.completedDate = today;
  delete G.assignments[key];
  if(nextTask) assignTask(nextTask, today);
  G.completions[key] = { person: t.person||'Family', pts: t.pts, topic: t.topic||'Uncategorized', date: today };
  G.activity.push({ person: t.person||'Family', title: t.title, pts: t.pts });
  save(); buildPlayers(); renderLB(); renderTasks(); renderActivity(); renderTodayByCategory();
  toast(`🎉 ${t.pts} pt${t.pts!==1?'s':''} for ${t.person||'the family'}!`);
  if(nextTask) {
    toast(`Assigned next ${nextTask.topic || 'category'} task: ${nextTask.title}`);
    openWorksheet(nextTask);
  }
  burst();

  // 2. Write to sheet via GET with URL params — works cross-origin, no CORS preflight
  const endpoint = sheetEndpoint();
  if(!endpoint) return;

  const params = new URLSearchParams({
    action: 'complete',
    rowNumber: t.rowNumber,
    completedDate: today
  });
  if(nextTask) {
    params.set('assignNextRowNumber', nextTask.rowNumber);
    params.set('assignedDate', today);
  }

  try {
    const res = await fetch(`${endpoint}?${params}`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    if(payload.ok === false) toast(`⚠️ Sheet: ${payload.error || 'unknown error'}`);
  } catch(err) {
    toast(`⚠️ Could not write to sheet: ${err.message}`);
  }
}

function openCard(key) {
  const t = G.tasks.find(t=>t.key===key);
  if(!t) return;
  openWorksheet(t);
}

function worksheetSteps(t) {
  const pieces = String(t.desc || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
  if(pieces.length > 1) return pieces;
  if(t.desc) return [t.desc];
  return [
    'Read the task carefully.',
    'Gather any materials you need.',
    'Complete the work neatly.',
    'Mark it complete from the task card when you are done.'
  ];
}

    <article class="worksheet-printable" style="--person-color:${personCol};--topic-color:${topicCol}">
      <header class="worksheet-head">
        <div>
          <div class="worksheet-kicker">${x(t.topic || 'Task Worksheet')}</div>

          ${t.titleFR ? `<p class="worksheet-fr">${x(t.titleFR)}</p>` : ''}
        </div>
        <div class="worksheet-points">${t.pts} pt${t.pts===1?'':'s'}</div>
      </header>

      <div class="worksheet-meta">
        <span>${x(t.person || 'Family')}</span>
        ${t.estTime ? `<span>${x(t.estTime)}</span>` : ''}
        ${t.dateAdd ? `<span>Added ${x(t.dateAdd)}</span>` : ''}
      </div>

      <section class="worksheet-block">
        <h2>Work Plan</h2>
        <ol class="worksheet-steps">
          ${steps.map(step => `<li>${x(step)}</li>`).join('')}
        </ol>
      </section>

        <h2>Website Links</h2>
        <ul class="worksheet-links">

        </ul>

      </section>` : ''}

      ${t.questions ? `<section class="worksheet-block">
        <h2>Questions</h2>
        <p style="white-space:pre-wrap">${x(t.questions)}</p>
      </section>` : ''}

      ${t.answers ? `<section class="worksheet-block">
        <h2>Answers</h2>
        <p style="white-space:pre-wrap">${x(t.answers)}</p>
      </section>` : ''}

      <section class="worksheet-workspace" aria-label="Writing space">

function closeWorksheet() {
  document.getElementById('worksheetModal').hidden = true;
}

function printWorksheet() {
  window.print();
}

function completePendingTask() {
  if(!G.pendingCompleteKey) return;
  const key = G.pendingCompleteKey;
  G.pendingCompleteKey = '';
  const url = new URL(location.href);
  url.searchParams.delete('complete');
  history.replaceState(null, '', url);
  doComplete(key);
}

/* ── Activity feed ── */
function renderActivity() {
  const sec = document.getElementById('activitySection');
  const el  = document.getElementById('activityList');
  let sharedLog = [];
  try { sharedLog = JSON.parse(localStorage.getItem('sf_activity_log') || '[]'); } catch(e) {}

    const icon = a.type === 'badge' ? '🏅' : a.type === 'mission' ? '⚡' : a.type === 'fi_study' ? '📚' : a.type === 'skill' ? '💡' : a.type === 'bible' ? '✝️' : '';
    const pts = a.pts > 0 ? `<div class="a-pts">+${a.pts}pt</div>` : `<div class="a-pts">${icon}</div>`;

/* ── Sync ── */
async function sync() {
  const btn = document.getElementById('syncBtn');
  btn.classList.add('spinning');
  setErr('');
  setStatus('Loading tasks…');

  // Try tasks.json first, fall back to Google Sheets
  try {
    await loadFromJson();
    renderLB(); renderPersonFilters(); renderCategoryBreakdown(); renderTasks(); renderActivity(); completePendingTask();
    const done = G.tasks.filter(t=>t.sheetDone||t.isDone).length;
    const totalPts = Object.values(G.players).reduce((s,p)=>s+p.pts,0);
    setStatus(`${G.tasks.length} tasks · ${done} completed · ${totalPts} total points earned · source: tasks.json`);
    toast(`✅ Loaded ${G.tasks.length} tasks from tasks.json`);
    btn.classList.remove('spinning');
    return;
  } catch(jsonErr) {
    setStatus(`tasks.json empty or missing — trying Google Sheet…`);
  }

  try {
    const rows = await loadRowsFromSheet();
    if(rows.length < 2) throw new Error('No data rows found in sheet');

    buildFromRows(rows);

    // Merge any locally-added tasks on top of sheet tasks
    const localTasks = loadLocalTasks();
    localTasks.forEach((lt, i) => {
      const key = `local_${i}_${String(lt.title||'').slice(0,10).replace(/\W/g,'_')}`;
      if(!G.tasks.find(t => t.title === lt.title && t.dateAdded === lt.dateAdded)) {
        const localDone = !!G.completions[key];
        G.tasks.push({ ...lt, key, rowNumber: -1, desc: lt.description||lt.desc||'', pts: lt.points||lt.pts||0, isDone: localDone, isAssigned: false, sheetDone: false, completedDate: '', dateAssigned: '' });
      }
    });

    renderLB(); renderPersonFilters(); renderCategoryBreakdown(); renderTasks(); renderActivity(); completePendingTask();
    const done = G.tasks.filter(t=>t.sheetDone).length;
    const totalPts = Object.values(G.players).reduce((s,p)=>s+p.pts,0);
    setStatus(`${G.tasks.length} tasks · ${done} completed · ${totalPts} total points earned · source: Google Sheet`);
    toast(`✅ Loaded ${G.tasks.length} tasks from Sheet`);
  } catch(e) {
    setErr(`<strong>Could not reach the sheet.</strong> Make sure it's shared as "Anyone with the link → Viewer".<br><small>Error: ${e.message}</small>`);
    setStatus('Sync failed — see error above');
    buildPlayers(); renderLB(); renderTasks();
  }
  btn.classList.remove('spinning');
}

/* ── Helpers ── */
function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }
function setErr(html) { const el=document.getElementById('errBox'); el.innerHTML=html; el.classList.toggle('on',!!html); }
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg) {
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  c.appendChild(el); setTimeout(()=>el.remove(),3200);
}

function burst() {
  for(let i=0;i<25;i++){
    const el=document.createElement('div');
    el.className='cf';
    el.style.cssText=`left:${15+Math.random()*70}vw;top:${5+Math.random()*45}vh;background:${CONFETTI_CLR[~~(Math.random()*CONFETTI_CLR.length)]};animation-delay:${Math.random()*.4}s;animation-duration:${.75+Math.random()*.7}s;width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'3px'}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1600);
  }
}

/* ── Local tasks (added via UI) ── */
function loadLocalTasks() {
  try { return JSON.parse(localStorage.getItem('sf_local_tasks') || '[]'); } catch(e) { return []; }
}

function saveLocalTasks(arr) {
  localStorage.setItem('sf_local_tasks', JSON.stringify(arr));
}

function openAddTask() {
  document.getElementById('addTaskForm').reset();
  document.getElementById('categoryOtherWrap').style.display = 'none';
  document.getElementById('pointsInput').value = 0;
  document.getElementById('addTaskModal').hidden = false;
}

function closeAddTask() {
  document.getElementById('addTaskModal').hidden = true;
}

function toggleCategoryOther(value) {
  document.getElementById('categoryOtherWrap').style.display = value === '__other__' ? 'block' : 'none';
}

function autoCalcPoints(minutesStr) {
  const minutes = parseFloat(minutesStr);
  const pointsField = document.getElementById('pointsInput');
  if(!pointsField) return;
  pointsField.value = minutes > 0 ? Math.round(minutes * 0.4) : 0;  // 2 pts per 5 min
}

function submitAddTask(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const title = fd.get('title').trim();
  if(!title) return;

  const people = fd.getAll('person').map(p => p.trim()).filter(Boolean);
  if(people.length === 0) {
    toast('⚠️ Pick at least one person');
    return;
  }

  const topicRaw = fd.get('topic');
  const topic = topicRaw === '__other__' ? fd.get('topicOther').trim() : topicRaw.trim();
  const assignToday = fd.get('assignToday') === 'yes';
  const today = todayIsoDate();

  const shared = {
    titleFR: '',
    topic,
    description: fd.get('description').trim(),
    points: Math.max(0, parseInt(fd.get('points')) || 0),
    estTime: fd.get('estTime').trim(),
    questions: fd.get('questions').trim(),
    answers: fd.get('answers').trim(),
    worksheetText: fd.get('worksheet').trim(),
    dateAdded: today,
    dateAssigned: assignToday ? today : '',
    links: fd.get('link').trim() ? [{ label: fd.get('link').trim().replace(/^https?:\/\//,''), url: fd.get('link').trim() }] : [],
    _local: true
  };

  const localTasks = loadLocalTasks();
  people.forEach((person, i) => {
    const newTask = { title, person, ...shared };
    localTasks.push(newTask);
    const key = `local_${Date.now()}_${i}_${title.slice(0,10).replace(/\W/g,'_')}`;
    G.tasks.push({ ...newTask, key, rowNumber: -1, isDone: false, isAssigned: assignToday, sheetDone: false, completedDate: '' });
    if(assignToday) G.assignments[key] = today;
  });
  saveLocalTasks(localTasks);
  if(assignToday) save();

  buildPlayers(); renderLB(); renderPersonFilters(); renderTasks();
  closeAddTask();
  toast(`✅ "${title}" added for ${people.length} ${people.length === 1 ? 'person' : 'people'}${assignToday ? ' · assigned to today' : ''}`);
}

/* ── JSON-first loading ── */
async function loadFromJson() {
  const r = await fetch('tasks.json', { cache: 'no-store' });
  if(!r.ok) throw new Error(`tasks.json not found (${r.status})`);
  const arr = await r.json();
  if(!Array.isArray(arr) || arr.length === 0) throw new Error('tasks.json is empty — falling back to Sheets');

  // Merge local tasks on top of JSON tasks
  const local = loadLocalTasks();
  const all = [...arr, ...local];

  G.tasks = all.map((t, i) => {
    const key = t.key || `json_${i}_${String(t.title||'').slice(0,14).replace(/\W/g,'_')}`;
    const localDone = !!G.completions[key];
    return {
      key,
      rowNumber: t.rowNumber || -1,
      title: t.title || '',
      titleFR: t.titleFR || '',
      person: t.person || '',
      topic: t.topic || '',
      desc: t.description || t.desc || '',
      pts: Math.max(0, parseInt(t.points ?? t.pts) || 0),
      estTime: t.estTime || '',
      dateAdded: t.dateAdded || '',
      dateAssigned: t.dateAssigned || '',
      completedDate: t.completedDate || '',
      links: t.links || [],
      questions: t.questions || '',
      answers: t.answers || '',
      worksheetText: t.worksheetText || '',
      sheetDone: !!t.isDone,
      isDone: !!t.isDone || localDone,
      isAssigned: !!(t.dateAssigned) && !t.isDone && !localDone,
      _local: !!t._local
    };
  });
  buildPlayers();
}

/* ── Export ── */
function exportJson() {
  const localTasks = loadLocalTasks();
  // Combine sheet tasks (non-local) with local tasks, strip runtime-only fields
  const exportData = G.tasks
    .filter(t => !t._local)
    .map(t => ({
      title: t.title, titleFR: t.titleFR, person: t.person, topic: t.topic,
      description: t.desc, points: t.pts, estTime: t.estTime,
      dateAdded: t.dateAdded, dateAssigned: t.dateAssigned,
      isDone: t.isDone, completedDate: t.completedDate, links: t.links,
      questions: t.questions || '', answers: t.answers || '', worksheetText: t.worksheetText || ''
    }));

  // append local tasks
  localTasks.forEach(lt => {
    if(!exportData.find(t => t.title === lt.title && t.dateAdded === lt.dateAdded)) {
      exportData.push(lt);
    }
  });

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tasks.json';
  a.click();
  toast('⬇ tasks.json downloaded — commit it to make tasks permanent');
}

/* ── Import (bulk add from JSON file, appends — never deletes) ── */
function importJsonTasks(file) {
  if(!file) return;
  const norm = s => String(s||'').trim().toLowerCase();

  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch(e) {
      toast('❌ Not valid JSON — import cancelled');
      document.getElementById('importJsonInput').value = '';
      return;
    }

    const incoming = Array.isArray(parsed) ? parsed
                    : (parsed && Array.isArray(parsed.tasks)) ? parsed.tasks
                    : null;
    if(!incoming) {
      toast('❌ Expected a JSON array of tasks (or {"tasks":[...]})');
      document.getElementById('importJsonInput').value = '';
      return;
    }

    const localTasks = loadLocalTasks();
    let added = 0, skipped = 0;

    incoming.forEach((raw, i) => {
      const title = String((raw && raw.title) || '').trim();
      if(!title) { skipped++; return; }
      const person = String((raw && raw.person) || '').trim();

      // A task only counts as a duplicate if a matching (same title + person)
      // existing task is found that is NOT yet completed. If every match is
      // already done, this is treated as a fresh (re-)occurrence and added.
      const matches = G.tasks.filter(t => norm(t.title) === norm(title) && norm(t.person) === norm(person));
      const isDup = matches.length > 0 && matches.some(t => !(t.isDone || t.sheetDone));
      if(isDup) { skipped++; return; }

      const newTask = {
        title,
        titleFR: raw.titleFR || '',
        person,
        topic: raw.topic || '',
        description: raw.description || raw.desc || '',
        points: Math.max(0, parseInt(raw.points ?? raw.pts) || 0),
        estTime: String(raw.estTime || ''),
        questions: raw.questions || '',
        answers: raw.answers || '',
        worksheetText: raw.worksheetText || '',
        dateAdded: raw.dateAdded || todayIsoDate(),
        links: Array.isArray(raw.links) ? raw.links : [],
        _local: true
      };

      localTasks.push(newTask);
      const key = `import_${Date.now()}_${i}_${title.slice(0,10).replace(/\W/g,'_')}`;
      G.tasks.push({ ...newTask, key, rowNumber: -1, isDone: false, isAssigned: false, sheetDone: false, completedDate: '', dateAssigned: '' });
      added++;
    });

    saveLocalTasks(localTasks);
    buildPlayers(); renderLB(); renderPersonFilters(); renderCategoryBreakdown(); renderTasks();

    const skipMsg = skipped ? `, skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}` : '';
    toast(`⬆ Imported ${added} task${added === 1 ? '' : 's'}${skipMsg}`);
    document.getElementById('importJsonInput').value = '';
  };
  reader.onerror = () => {
    toast('❌ Could not read file');
    document.getElementById('importJsonInput').value = '';
  };
  reader.readAsText(file);
}

/* ── Init ── */
renderLB();
renderTasks();
renderActivity();
sync();
</script>
