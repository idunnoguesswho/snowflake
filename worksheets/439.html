<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>439 | Worksheet</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f7fb;
    color: #1f2933;
    font-family: Arial, sans-serif;
  }
  main {
    width: min(8.5in, 100%);
    min-height: 11in;
    margin: 0 auto;
    padding: 0.55in;
    background: white;
  }
  header {
    border-bottom: 3px solid #2f80ed;
    padding-bottom: 14px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 25px;
    line-height: 1.15;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    color: #52606d;
    font-size: 12px;
    font-weight: 700;
  }
  .pill {
    border: 1px solid #d8dee6;
    border-radius: 999px;
    padding: 4px 9px;
  }
  .prompt {
    font-size: 14px;
    line-height: 1.45;
    margin: 0 0 14px;
  }
  .box {
    border: 1.5px solid #cbd5df;
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
    break-inside: avoid;
  }
  h2 {
    margin: 0 0 6px;
    font-size: 15px;
  }
  .box p {
    margin: 0 0 8px;
    color: #52606d;
    font-size: 12px;
    line-height: 1.35;
  }
  .lines {
    height: 1.45in;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, #d8dee6 26px);
  }
  footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
    font-size: 12px;
  }
  .small-line {
    border-bottom: 1.5px solid #9aa5b1;
    min-height: 24px;
  }
  @media print {
    body { background: white; }
    main { width: 8.5in; min-height: 11in; margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Session 1: What Is Addiction?</h1>
    <div class="meta">
      <span class="pill">Task ID: 439</span>
      <span class="pill">Logan</span>
      <span class="pill">Wellbeing</span>
      <span class="pill">30 min</span>
      <span class="pill">6 pts</span>
    </div>
  </header>
  <p class="prompt"><strong>Task:</strong> Read what addiction is and complete the true/false activity.</p>
  
        <section class="box">
          <h2>Check In</h2>
          <p>Draw, circle, or write what feels true today. Sharing is optional.</p>
          <div class="lines"></div>
        </section>
        

        <section class="box">
          <h2>One Safe Step</h2>
          <p>Choose one small helpful action, person, phrase, or plan.</p>
          <div class="lines"></div>
        </section>
        
  <footer>
    <label>Name<div class="small-line"></div></label>
    <label>Date<div class="small-line"></div></label>
  </footer>
</main>
</body>
</html>
